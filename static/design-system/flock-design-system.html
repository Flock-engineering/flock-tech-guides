sá con tu cuenta de Flock.</p></div>\n        <${Button} size=\"lg\" block icon=\"shield\">Ingresar con SSO<//>\n        <${Divider} label=\"o con tu mail\" />\n        <${FormField} label=\"Mail\"><${TextInput} icon=\"mail\" placeholder=\"nombre@flockit.com.ar\" /><//>\n        <${FormField} label=\"Contraseña\"><${TextInput} type=\"password\" icon=\"lock\" defaultValue=\"contraseña\" /><//>\n        <div className=\"fk-login__row\"><${Checkbox} label=\"Recordarme\" defaultChecked /><${Link} href=\"#\">¿Olvidaste tu contraseña?<//></div>\n        <${Button} variant=\"secondary\" size=\"lg\" block>Ingresar<//>\n      </form>\n    </div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Pantalla de ingreso: panel de marca con el isologo y el claim, y formulario con SSO.\n\n## Cuándo usarlo\n- Entrada a cualquier sistema interno. Es una composición de componentes, no un componente del bundle.\n\n## Cómo se arma\n- Panel izquierdo sobre `brand-night` con los brillos radiales de la marca (`purple-heart-100` y `lavender-100`), logo blanco y claim en Zalando Sans Expanded (`display-lg`) con el énfasis en `accent`.\n- Panel derecho: `Button` primario `block` para SSO (la acción principal), `Divider` con texto, `FormField` + `TextInput`, `Checkbox`, `Button` `secondary` `block`. El `brand` no va acá: el panel es claro.\n\n## Reglas\n- SSO primero; usuario y contraseña como alternativa. Mensajes de error genéricos (\"El mail o la contraseña no coinciden\").\n- Bajo 820px el panel de marca pasa arriba.\n"},{"name":"Modal","group":"Contenedores","height":440,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, Button, Checkbox, FormField, Modal, TextInput } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ height: 440 }}><${Modal} open inline title=\"Agregar contacto de facturación\" description=\"Va a recibir los mails de cierre de cada período.\" onClose=${() => {}}\n    footerStart=${html`<${Checkbox} label=\"Contacto principal\" />`}\n    footer=${html`<${Button} variant=\"secondary\">Cancelar<//><${Button}>Agregar contacto<//>`}>\n    <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 15 }}>\n      <${FormField} label=\"Nombre\" required><${TextInput} defaultValue=\"Paula Ortiz\" /><//>\n      <${FormField} label=\"Mail\" required><${TextInput} icon=\"mail\" defaultValue=\"paula@andessoftware.com\" /><//>\n    </div>\n  <//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Diálogo enfocado para formularios cortos y decisiones que bloquean el flujo.\n\n## Cuándo usarlo\n- Tareas de 1–5 campos que no justifican una página (renombrar, agregar un contacto). Para editar con contexto de la lista, `Drawer`; para confirmar algo destructivo, `ConfirmDialog`.\n\n## Qué provee el consumidor\n- `open`, `onClose`, `title`, `description`, `children`, `footer` (botones), `footerStart` (contenido a la izquierda del pie), `size` (`sm` 420 · `md` 560 · `lg` 800), `closeOnBackdrop`.\n\n## Mobile\n- Se convierte en hoja inferior a todo el ancho, con los botones del pie repartidos.\n\n## Reglas\n- Título con verbo: \"Agregar contacto\". Botón primario a la derecha con la misma acción.\n- Se cierra con Esc, con la X y con clic afuera (salvo cambios sin guardar).\n- Un solo modal a la vez.\n"},{"name":"MultiSelect","group":"Formularios","height":360,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FormField, MultiSelect } = window.FlockUI;\nconst PARTNERS = [{ value: 'ibis', label: 'Andes Software', description: 'CUIT 30-71234567-8' }, { value: 'clovinn', label: 'Nodo Labs', description: 'CUIT 30-70987654-3' }, { value: 'itr', label: 'Pampa Dev' }, { value: 'w3', label: 'Río Sistemas' }, { value: 'bright', label: 'Sur Digital' }, { value: 'flock', label: 'Flock IT' }];\n\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Partners del proyecto\"><${MultiSelect} options=${PARTNERS} defaultValue=${['ibis', 'clovinn']} defaultOpen /><//>\n    <${FormField} label=\"Tecnologías\"><${MultiSelect} options=${['Angular', 'React', '.NET', 'Java', 'Oracle PL/SQL', 'Python']} defaultValue=${['Angular', '.NET', 'Oracle PL/SQL', 'Python']} maxChips=${2} /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Selección de varias opciones, mostradas como chips removibles.\n\n## Cuándo usarlo\n- Asignar varias etiquetas, partners o personas a un registro. Para filtrar una tabla preferí `FilterDropdown`.\n\n## Qué provee el consumidor\n- `options`, `value` / `defaultValue` (array) / `onChange`, `placeholder`, `maxChips` (resto como \"+N\"), `size`, `invalid`, `disabled`.\n\n## Reglas\n- Backspace con el campo vacío quita el último chip.\n"},{"name":"NotificationCenter","group":"Personas y colaboración","height":520,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, NotificationCenter } = window.FlockUI;\nfunction Demo() {\n  const items = [\n    { actor: 'Martín López', text: html`<span><b>Martín López</b> aprobó el período de octubre de Andes Software</span>`, time: 'hace 5 min', unread: true },\n    { icon: 'alert-triangle', text: html`<span><b>Diferencia de horas</b> en Nodo Labs: 12 h más en el reporte</span>`, time: 'hace 1 hora', unread: true },\n    { actor: 'Julia Méndez', text: html`<span><b>Julia Méndez</b> te mencionó en SVC-198</span>`, time: 'ayer' },\n    { icon: 'file-spreadsheet', text: html`<span><b>Exportación lista:</b> Facturación octubre.xlsx</span>`, time: '02/10/2026' },\n  ];\n  return html`<div style=${{ display: 'flex', justifyContent: 'flex-end', width: '100%' }}><${NotificationCenter} items=${items} defaultOpen /></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Campana con contador de no leídas y panel de notificaciones.\n\n## Cuándo usarlo\n- En el `Header`, para avisos que requieren seguimiento (aprobaciones, menciones, procesos terminados).\n\n## Qué provee el consumidor\n- `items` `{ actor | icon, text (puede incluir <b>), time, unread }`, `onMarkAllRead`, `inverse` (sobre el header), `defaultOpen`.\n\n## Reglas\n- Texto con sujeto y acción: \"Martín López aprobó el período de octubre\". Tiempo relativo (\"hace 5 min\").\n- Lo urgente también va por mail; la campana no reemplaza al `Alert`.\n"},{"name":"NumberInput","group":"Formularios","height":140,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FormField, NumberInput } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0, 1fr))', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Monto a facturar\"><${NumberInput} currency defaultValue=${1234567.5} /><//>\n    <${FormField} label=\"Tarifa USD\"><${NumberInput} prefix=\"US$\" defaultValue=${42} /><//>\n    <${FormField} label=\"Descuento\"><${NumberInput} suffix=\"%\" decimals=${1} defaultValue=${7.5} /><//>\n    <${FormField} label=\"Horas\"><${NumberInput} decimals=${0} defaultValue=${168} suffix=\"h\" /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Números e importes con formato argentino: 1.234,56 y $ 1.234,56.\n\n## Cuándo usarlo\n- Montos, tarifas, porcentajes y cantidades. Acepta coma o punto al tipear y formatea al salir del campo.\n\n## Qué provee el consumidor\n- `value` / `defaultValue` (número) / `onChange(number)`, `currency` (prefijo $), `prefix`, `suffix`, `decimals`, `min`, `max`, `size`, `invalid`, `disabled`.\n\n## Reglas\n- Alineado a la derecha con cifras tabulares. Indicá la moneda o la unidad siempre.\n"},{"name":"PageHeader","group":"Layout y navegación","height":300,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Button, DropdownMenu, IconButton, PageHeader, StatusBadge, Tabs } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${PageHeader} title=\"Partners\" description=\"Empresas que suman personas a los equipos de nuestros proyectos.\"\n      breadcrumbs=${[{ label: 'Inicio' }, { label: 'Gestión' }, { label: 'Partners' }]}\n      actions=${html`<${Button} variant=\"secondary\" icon=\"download\">Exportar<//><${Button} icon=\"plus\">Nuevo partner<//>`} />\n    <${PageHeader} title=\"Andes Software\" onBack=${() => {}} status=${html`<${StatusBadge} tone=\"success\">Activo<//>`}\n      breadcrumbs=${[{ label: 'Partners' }, { label: 'Andes Software' }]}\n      actions=${html`<${DropdownMenu} placement=\"end\" items=${[{ label: 'Duplicar', icon: 'copy' }, { label: 'Dar de baja', icon: 'trash', danger: true }]} trigger=${html`<${IconButton} icon=\"more-horizontal\" label=\"Más acciones\" variant=\"secondary\" />`} /><${Button} variant=\"secondary\" icon=\"edit\">Editar<//>`}\n      tabs=${html`<${Tabs} items=${[{ value: 'datos', label: 'Datos' }, { value: 'fact', label: 'Facturación', count: 12 }, { value: 'docs', label: 'Documentos', count: 4 }, { value: 'hist', label: 'Historial' }]} />`} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Encabezado de página: breadcrumbs, título, estado, descripción, acciones y, opcionalmente, tabs.\n\n## Cuándo usarlo\n- Al inicio de cada página dentro de `AppShell`. Uno por página.\n\n## Qué provee el consumidor\n- `title` (en `heading-1`), `description`, `breadcrumbs` (array de `{ label, href }`).\n- `status`: un `StatusBadge` junto al título (páginas de detalle).\n- `actions`: botones; como máximo un `primary` y dos secundarios. El resto va en un `DropdownMenu` (⋯).\n- `onBack`: muestra flecha de volver en páginas de detalle.\n- `tabs`: un `Tabs` debajo del título.\n\n## Mobile\n- Título a 24 px; las acciones pasan debajo y la primaria ocupa el ancho.\n\n## Reglas\n- El título repite el nombre del ítem del sidebar o el nombre del registro (\"Contrato CTR-2026-014\").\n- La acción primaria va a la derecha de todo.\n"},{"name":"Pagination","group":"Layout y navegación","height":140,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Pagination } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${Pagination} total=${1248} defaultPage=${4} />\n    <${Pagination} total=${36} pageSizes=${[10, 20]} defaultPageSize=${10} noun=\"partners\" compact />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Navegación entre páginas de resultados, con cantidad por página y total.\n\n## Cuándo usarlo\n- Debajo de toda `DataTable` o `List` con más de 20 registros (en el slot `footer` de la tabla).\n\n## Qué provee el consumidor\n- `total`, `page` / `defaultPage` / `onPageChange`, `pageSize` / `defaultPageSize` / `onPageSizeChange`.\n- `pageSizes` (por defecto 10, 20, 50, 100), `noun` (\"registros\", \"partners\"), `compact`.\n\n## Mobile\n- Oculta \"Por página\" y deja solo la navegación.\n\n## Reglas\n- Números con formato AR (1.248). Página actual en `primary`.\n- Al cambiar filtros, volvé a la página 1.\n"},{"name":"Popover","group":"Contenedores","height":280,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Button, Popover } = window.FlockUI;\nfunction Demo() {\n  return html`<${Popover} defaultOpen title=\"¿Cómo se calcula el desvío?\" trigger=${html`<${Button} variant=\"ghost\" icon=\"help-circle\">Desvío de horas<//>`}\n    footer=${html`<${Button} size=\"sm\" variant=\"ghost\">Ver manual<//><${Button} size=\"sm\">Entendido<//>`}>\n    Comparamos las horas cargadas en el sistema con las del reporte mensual del partner. Más de 2% de diferencia marca el período para revisión.\n  <//>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Panel flotante con contenido interactivo, anclado a un disparador.\n\n## Cuándo usarlo\n- Información contextual con acciones (vista previa de una persona, explicación con link, mini formulario de una línea).\n\n## Qué provee el consumidor\n- `trigger`, `title`, `children`, `footer`, `open` / `defaultOpen` / `onOpenChange`, `placement`, `width`.\n\n## Reglas\n- Contenido corto. Si necesita scroll o más de 3 campos, usá `Modal` o `Drawer`.\n"},{"name":"ProgressBar","group":"Feedback y estado","height":230,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, ProgressBar, ProgressRing } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 28, width: '100%' }}>\n    <${ProgressBar} value=${31} label=\"Importando horas\" hint=\"1.248 de 4.028 filas\" />\n    <${ProgressBar} value=${100} tone=\"success\" label=\"Mails generados\" hint=\"5 de 5 partners\" />\n    <${ProgressBar} value=${88} tone=\"warning\" label=\"Presupuesto consumido\" size=\"sm\" />\n    <${ProgressBar} indeterminate label=\"Preparando el Excel…\" />\n    <div className=\"fk-row\" style=${{ gap: 20 }}><${ProgressRing} value=${72} label=\"Avance\" /><${ProgressRing} value=${35} size=${36} stroke=${4} label=\"Avance\" /></div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Progreso de un proceso largo: importaciones, generación de archivos, cargas masivas. Incluye `ProgressRing` para espacios chicos.\n\n## Cuándo usarlo\n- Procesos de más de ~3 s con avance medible. Si no se puede medir, `indeterminate`.\n\n## Qué provee el consumidor\n- `ProgressBar`: `value` (0–100), `label`, `hint`, `tone` (`primary` · `success` · `warning` · `danger`), `size` (`sm` | `md`), `indeterminate`, `showValue`.\n- `ProgressRing`: `value`, `size`, `stroke`, `label`.\n\n## Reglas\n- Decí qué está pasando y cuánto falta: \"Importando 1.248 de 4.028 filas\".\n"},{"name":"RadioGroup","group":"Formularios","height":250,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, RadioGroup } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${RadioGroup} legend=\"Frecuencia del reporte\" row defaultValue=\"m\" options=${[{ value: 's', label: 'Semanal' }, { value: 'm', label: 'Mensual' }, { value: 't', label: 'Trimestral' }]} />\n    <${RadioGroup} legend=\"Modalidad de facturación\" cards defaultValue=\"h\" options=${[{ value: 'h', label: 'Por hora', description: 'Horas cargadas × tarifa por perfil' }, { value: 'f', label: 'Precio fijo', description: 'Monto mensual acordado' }, { value: 'p', label: 'Por entregable', description: 'Al aprobar cada hito' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Elegir exactamente una opción entre pocas, todas visibles.\n\n## Cuándo usarlo\n- 2 a 5 opciones que conviene comparar. `cards` para opciones con descripción más larga.\n\n## Qué provee el consumidor\n- `legend`, `options` (strings o `{ value, label, description, disabled }`), `value` / `defaultValue` / `onChange`, `row`, `cards`, `name`.\n\n## Reglas\n- Siempre una opción preseleccionada si hay un valor por defecto razonable.\n"},{"name":"SavedViews","group":"Filtros y datos","height":120,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, SavedViews } = window.FlockUI;\nfunction Demo() {\n  return html`<${SavedViews} defaultValue=\"pend\" onSave=${() => {}} views=${[{ id: 'all', label: 'Todos', count: 248 }, { id: 'pend', label: 'Pendientes de aprobar', count: 12, default: true }, { id: 'mine', label: 'Mis partners', count: 3 }, { id: 'diff', label: 'Con diferencias', count: 2 }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Vistas guardadas: combinaciones de filtros con nombre, a un clic.\n\n## Cuándo usarlo\n- Listados que la gente consulta siempre con los mismos filtros (\"Pendientes de aprobar\", \"Mis partners\"). Va entre el `PageHeader` y la `FilterBar`.\n\n## Qué provee el consumidor\n- `views` `{ id, label, count, default }`, `value` / `defaultValue` / `onChange`, `onSave` (botón \"Guardar vista\"), `onAction(acción, vistaId)` para renombrar, duplicar, marcar como predeterminada o eliminar.\n\n## Reglas\n- Hasta 6 vistas visibles. La predeterminada lleva estrella `accent`.\n"},{"name":"SearchField","group":"Formularios","height":130,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, SearchField } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 20, width: '100%' }}>\n    <${SearchField} placeholder=\"Buscar por partner o CUIT\" />\n    <${SearchField} defaultValue=\"Nodo Labs\" />\n    <${SearchField} size=\"sm\" placeholder=\"Buscar\" shortcut=\"Ctrl+K\" />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Buscador pill con ícono, limpiar y atajo de teclado opcional.\n\n## Cuándo usarlo\n- Búsqueda en tablas, listas y en el header. Para elegir un valor de una lista usá `Combobox`.\n\n## Qué provee el consumidor\n- `value` / `defaultValue` / `onChange`, `onSearch(value)` al apretar Enter, `placeholder` (qué se busca), `shortcut` (\"Ctrl+K\"), `size`.\n\n## Reglas\n- El placeholder dice qué campos busca: \"Buscar por partner o CUIT\".\n"},{"name":"SegmentedControl","group":"Acciones","height":150,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, SegmentedControl } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${SegmentedControl} label=\"Período\" options=${['Día', 'Semana', 'Mes', 'Año']} defaultValue=\"Mes\" />\n    <${SegmentedControl} label=\"Vista\" size=\"sm\" options=${[{ value: 't', label: 'Tabla', icon: 'list' }, { value: 'k', label: 'Tablero', icon: 'kanban' }, { value: 'c', label: 'Calendario', icon: 'calendar' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Alterna entre pocas vistas o períodos mutuamente excluyentes.\n\n## Cuándo usarlo\n- 2 a 5 opciones cortas que cambian la vista al instante (Día / Semana / Mes, Tabla / Tarjetas).\n\n## Qué provee el consumidor\n- `options`: strings o `{ value, label, icon }`; `value` / `defaultValue` / `onChange`; `size` (`sm` | `md`); `block`; `label` (accesible).\n\n## Reglas\n- No lo uses dentro de formularios para datos que se guardan: para eso está `RadioGroup`.\n"},{"name":"Select","group":"Formularios","height":380,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FormField, Select } = window.FlockUI;\nfunction Demo() {\n  const estados = [{ value: 'pend', label: 'Pendiente', icon: 'clock' }, { value: 'rev', label: 'En revisión', icon: 'eye' }, { value: 'ok', label: 'Aprobado', icon: 'check-circle' }, { value: 'rech', label: 'Rechazado', icon: 'x-circle' }];\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 20, width: '100%', alignItems: 'start' }}>\n    <${FormField} label=\"Estado\"><${Select} options=${estados} defaultValue=\"rev\" defaultOpen /><//>\n    <${FormField} label=\"Moneda\"><${Select} options=${['ARS', 'USD']} placeholder=\"Elegí una moneda\" /><//>\n    <${FormField} label=\"Perfil\" error=\"Elegí un perfil\"><${Select} options=${['Backend', 'Frontend', 'QA']} placeholder=\"Elegí un perfil\" /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Elegir una opción de una lista cerrada y corta.\n\n## Cuándo usarlo\n- Hasta ~10 opciones conocidas. Con más opciones o si hay que buscar, usá `Combobox`. Con 2–4 opciones visibles, `RadioGroup`.\n\n## Qué provee el consumidor\n- `options`: strings o `{ value, label, description, icon, disabled, group }`.\n- `value` / `defaultValue` / `onChange(value)`, `placeholder`, `size`, `invalid`, `disabled`.\n\n## Reglas\n- Placeholder con verbo: \"Elegí un estado\". Navegable con ↑ ↓ Enter Esc.\n"},{"name":"Sidebar","group":"Layout y navegación","height":520,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Sidebar } = window.FlockUI;\nconst NAV = [\n  { label: 'Inicio', icon: 'home' },\n  { type: 'section', label: 'Gestión' },\n  { label: 'Facturación', icon: 'receipt', active: true, count: 12 },\n  { label: 'Partners', icon: 'building', count: 5 },\n  { label: 'Contratos', icon: 'file' },\n  { label: 'Equipos', icon: 'users', children: [{ label: 'Equipo Alfa' }, { label: 'Equipo Beta' }] },\n  { type: 'section', label: 'Reportes' },\n  { label: 'Tableros', icon: 'bar-chart' },\n  { label: 'Exportaciones', icon: 'download' },\n];\nconst LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN4AAAA5CAYAAABZJpWNAAAACXBIWXMAABCcAAAQnAEmzTo0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAlISURBVHgB7Z3vdRM5EMAnPL6fqeCWCggVsFRAqACngjMVxKmAUEH2KkiuAi8VBCrYpYJABXMaa4yNWa9Gf6119HtPL2CvJa1WI400o1mATEDEmUpXKnUqPaIfnUq3KlUQGVVGzfW+43I3aaXS3CKfSqUb198X3KF25vamdn9Q6Z8UfefocKfrMDxdrAbE7SBh4kqQF93/o+vvC+6gHqCT9p1swDhCt2EFAVH5nTvU9wL87r+GQnBQD57J+k5WUKfE+NQQAJXPB3RTg1ee93+6HeCIoGwAPYcIPIPjU0N8avAE9azVqDQDe84dv7O5pmCBep70HCvBpVHa/jn8XpkaxjspVfYvGOenSl/Pzs4aOBFQ6/q3cDxchL0wzlHbdC143LHuIKB0o94UeK8E8Kvh0h7y5xP4Pah7KBR2eMZCR2uI0FNqRfmieWeoUekHZAprARfgDt3bNRQKO9AabwkyXdcFmiVGVTQ1I1LH/Aj54rOdT/dGs34PhcIOpGq+gbiQgXnGAjYIrQfVNb36541KryATeLauLX7yBbTq/IP/NmP3XXi6kOBVEB+a+UY7oOqgrfpzzrtN5yP5zFV6B2mohdf1Kl3yPRQKRkjwSCCy2TXjGaIdueReCecC9IZHbKRru+sidAUbaI33L0wM1clJJ e case (\"Gestión\", no \"GESTIÓN\").\n"},{"name":"Skeleton","group":"Feedback y estado","height":250,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, DataTable, Skeleton } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <div className=\"fk-card\" style=${{ padding: 20, display: 'flex', gap: 14 }}><${Skeleton} circle width=${44} /><div style=${{ flex: 1 }}><${Skeleton} width=\"50%\" height=${16} /><div style=${{ height: 10 }} /><${Skeleton} lines=${3} /></div></div>\n    <${DataTable} loading loadingRows=${3} columns=${[{ key: 'a', header: 'Partner' }, { key: 'b', header: 'Período' }, { key: 'c', header: 'Monto', align: 'right' }]} rows=${[]} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Marcador de posición mientras carga el contenido, con la forma del contenido final.\n\n## Cuándo usarlo\n- Primera carga de tablas, cards y detalles. `DataTable loading` ya lo usa.\n\n## Qué provee el consumidor\n- `width`, `height`, `circle`, `lines` (párrafo), `radius`.\n\n## Reglas\n- Respetá la estructura real (mismas columnas, mismos tamaños). Respeta `prefers-reduced-motion`.\n"},{"name":"Slider","group":"Formularios","height":170,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Slider } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 40, width: '100%' }}>\n    <${Slider} label=\"Avance mínimo\" defaultValue=${60} format=${(n) => n + '%'} />\n    <${Slider} label=\"Tarifa por hora\" min=${0} max=${80} defaultValue=${[25, 55]} format=${(n) => 'US$ ' + n} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Valor o rango numérico sobre una pista.\n\n## Cuándo usarlo\n- Rangos aproximados en filtros (porcentaje de avance, rango de tarifas). Para valores exactos usá `NumberInput`.\n\n## Qué provee el consumidor\n- `label`, `min`, `max`, `step`, `value` / `defaultValue` (número, o `[desde, hasta]` para rango), `onChange`, `format(n)`, `showScale`.\n\n## Reglas\n- Mostrá siempre el valor elegido con formato (%, $).\n"},{"name":"Spinner","group":"Feedback y estado","height":110,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Spinner } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ gap: 30 }}><${Spinner} size=${16} /><${Spinner} /><${Spinner} size=${32} /><${Spinner} label=\"Cargando partners…\" /></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Indicador de carga indeterminada.\n\n## Cuándo usarlo\n- Esperas cortas (menos de ~3 s) en botones, celdas o paneles. Para contenido que se está cargando, preferí `Skeleton`; para procesos largos, `ProgressBar`.\n\n## Qué provee el consumidor\n- `size` (px), `label` (texto visible y accesible).\n\n## Reglas\n- No bloquees toda la pantalla con un spinner. En botones usá `Button loading`.\n"},{"name":"SplitButton","group":"Acciones","height":260,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, SplitButton } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ gap: 40 }}>\n    <${SplitButton} icon=\"download\" defaultOpen items=${[{ label: 'Exportar a CSV', icon: 'file' }, { label: 'Exportar a PDF', icon: 'file' }, { type: 'separator' }, { label: 'Programar envío', icon: 'clock' }]}>Exportar a Excel<//>\n    <${SplitButton} variant=\"secondary\" icon=\"mail\" items=${[{ label: 'Solo Andes Software' }, { label: 'Solo Nodo Labs' }]}>Generar mails<//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Acción principal con un menú de alternativas relacionadas (\"Exportar ▾\").\n\n## Cuándo usarlo\n- Cuando hay una acción por defecto clara y variantes poco usadas (Exportar a Excel / CSV / PDF).\n\n## Qué provee el consumidor\n- `children` y `onClick` de la acción principal, `icon`, `items` (como en `DropdownMenu`), `variant` (`primary` | `secondary`), `size`, `disabled`.\n\n## Reglas\n- La acción principal debe ser la más frecuente; si no hay una, usá `DropdownMenu`.\n"},{"name":"StatCard","group":"Filtros y datos","height":170,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, StatCard } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0, 1fr))', gap: 20, width: '100%' }}>\n    <${StatCard} variant=\"brand\" label=\"Facturado en octubre\" value=\"$ 48,2 M\" delta=${8.4} icon=\"dollar\" />\n    <${StatCard} label=\"Horas cargadas\" value=\"6.412\" delta=${-2.1} icon=\"clock\" spark=${[40, 52, 48, 61, 58, 66, 62]} />\n    <${StatCard} label=\"Días promedio de aprobación\" value=\"3,4\" delta=${-12} invert icon=\"hourglass\" spark=${[6, 5.2, 5, 4.4, 4, 3.6, 3.4]} />\n    <${StatCard} label=\"Partners activos\" value=\"5\" delta=${0} deltaLabel=\"sin cambios\" icon=\"building\" />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"KPI: una métrica con su variación y una sparkline.\n\n## Cuándo usarlo\n- Fila de 3–4 indicadores al inicio de un tablero o listado. Un número por card.\n\n## Qué provee el consumidor\n- `label`, `value` (ya formateado: \"$ 48.250.000\"), `delta` (% con signo), `deltaLabel`, `icon`, `spark` (array de números), `invert` (cuando bajar es bueno), `variant` (`default` | `brand`).\n\n## Reglas\n- La variación lleva ícono y signo, no solo color. Hasta 4 cards por fila (`Grid` de 3 columnas cada una).\n- `brand` para el KPI principal, uno por pantalla como máximo.\n"},{"name":"StatusBadge","group":"Feedback y estado","height":130,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, StatusBadge } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\"><${StatusBadge} tone=\"success\">Aprobado<//><${StatusBadge} tone=\"warning\">Pendiente<//><${StatusBadge} tone=\"danger\">Rechazado<//><${StatusBadge} tone=\"info\">En revisión<//><${StatusBadge} tone=\"brand\">Nuevo<//><${StatusBadge}>Borrador<//></div>\n    <div className=\"fk-row\"><${StatusBadge} tone=\"success\" size=\"sm\">Activo<//><${StatusBadge} tone=\"danger\" size=\"sm\" outline>Vencido<//><${StatusBadge} tone=\"info\" dot=${false}>3 de 5<//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Estado de un registro: punto + palabra.\n\n## Cuándo usarlo\n- En celdas de tabla, títulos de detalle y cards: Activo, Pendiente, Aprobado, Rechazado.\n\n## Qué provee el consumidor\n- `tone` (`neutral` · `success` · `warning` · `danger` · `info` · `brand`), `children` (la palabra), `size` (`sm` | `md`), `outline`, `dot`.\n\n## Reglas\n- Mapeo fijo por producto: definí una vez qué estado usa cada tono y no lo cambies entre pantallas.\n- Nunca un badge sin texto.\n"},{"name":"Stepper","group":"Layout y navegación","height":260,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Stepper } = window.FlockUI;\nfunction Demo() {\n  const steps = [{ label: 'Datos del partner', description: 'Razón social y CUIT' }, { label: 'Tarifas', description: 'Valor hora por perfil' }, { label: 'Documentación' }, { label: 'Revisión' }];\n  return html`\n    <${Stepper} steps=${steps} current=${1} />\n    <div style=${{ display: 'flex', gap: 40 }}>\n      <${Stepper} vertical steps=${[{ label: 'Archivo subido' }, { label: 'Validación', status: 'error', description: '3 filas con CUIT inválido' }, { label: 'Importación' }]} current=${1} />\n    </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Progreso dentro de un flujo de varios pasos (altas, importaciones, wizards).\n\n## Cuándo usarlo\n- Flujos de 3 a 6 pasos que se completan en orden. Horizontal arriba del formulario; vertical en drawers o columnas angostas.\n\n## Qué provee el consumidor\n- `steps`: `{ label, description, status }` (`status` opcional: `done`, `current`, `upcoming`, `error`).\n- `current`: índice del paso actual. `onStepClick` si se puede volver a pasos anteriores.\n- `vertical`.\n\n## Reglas\n- Etiquetas cortas, con sustantivo: \"Datos del partner\", \"Tarifas\", \"Revisión\".\n- El botón del pie dice el siguiente paso: \"Continuar a tarifas\".\n"},{"name":"Switch","group":"Formularios","height":130,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Switch } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\" style=${{ gap: 28 }}>\n      <${Switch} label=\"Notificaciones por mail\" defaultChecked />\n      <${Switch} label=\"Modo oscuro\" />\n      <${Switch} label=\"Deshabilitado\" disabled defaultChecked />\n      <${Switch} label=\"Compacto\" size=\"sm\" defaultChecked />\n    </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Interruptor para activar o desactivar algo al instante.\n\n## Cuándo usarlo\n- Preferencias que se aplican sin botón Guardar (notificaciones, tema). Dentro de formularios con Guardar, usá `Checkbox`.\n\n## Qué provee el consumidor\n- `label`, `checked` / `defaultChecked` / `onChange(checked)`, `disabled`, `size` (`sm` | `md`).\n\n## Reglas\n- El label nombra lo que se activa, no el estado: \"Notificaciones por mail\".\n"},{"name":"TableToolbar","group":"Filtros y datos","height":260,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Button, SplitButton, TableToolbar } = window.FlockUI;\nfunction Demo() {\n  const [cols, setCols] = React.useState([{ key: 'p', label: 'Partner' }, { key: 'c', label: 'Código' }, { key: 'm', label: 'Monto' }, { key: 'r', label: 'Responsable', visible: false }]);\n  const [d, setD] = React.useState('normal');\n  return html`<div className=\"fk-tablebox\">\n      <${TableToolbar} title=\"Partners\" count=${1248} search columns=${cols} onColumnsChange=${setCols} density=${d} onDensityChange=${setD}\n        actions=${html`<${SplitButton} size=\"sm\" icon=\"download\" items=${[{ label: 'Exportar a CSV' }, { label: 'Exportar a PDF' }]}>Exportar<//>`} />\n    </div>\n    <div className=\"fk-tablebox\">\n      <${TableToolbar} selectedCount=${3} onClearSelection=${() => {}} bulkActions=${html`<${Button} size=\"sm\" variant=\"secondary\" icon=\"check\">Aprobar<//><${Button} size=\"sm\" variant=\"secondary\" icon=\"user\">Asignar<//><${Button} size=\"sm\" variant=\"danger\" icon=\"trash\">Eliminar<//>`} />\n    </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Barra superior de una tabla: título, total, búsqueda local, columnas visibles, densidad y acciones. Cambia a modo selección cuando hay filas marcadas.\n\n## Cuándo usarlo\n- En el slot `toolbar` de `DataTable`.\n\n## Qué provee el consumidor\n- `title`, `count`, `search`, `searchPlaceholder`, `onSearchChange`.\n- `columns` `{ key, label, visible }` + `onColumnsChange` (menú \"Columnas\").\n- `density` + `onDensityChange`, `actions` (Exportar, `SplitButton`).\n- `selectedCount`, `bulkActions`, `onClearSelection` (modo selección).\n\n## Reglas\n- Total con formato AR (\"1.248 registros\"). En modo selección solo se muestran acciones masivas.\n"},{"name":"Tabs","group":"Layout y navegación","height":170,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Tabs } = window.FlockUI;\nfunction Demo() {\n  const items = [{ value: 'datos', label: 'Datos' }, { value: 'fact', label: 'Facturación', count: 12 }, { value: 'docs', label: 'Documentos', count: 4 }, { value: 'hist', label: 'Historial' }, { value: 'perm', label: 'Permisos', disabled: true }];\n  return html`\n    <${Tabs} items=${items} defaultValue=\"fact\" />\n    <${Tabs} variant=\"pill\" items=${[{ value: 'm', label: 'Mensual' }, { value: 't', label: 'Trimestral' }, { value: 'a', label: 'Anual' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Secciones de una misma entidad o página (Datos, Historial, Documentos).\n\n## Cuándo usarlo\n- Para dividir el detalle de un registro en secciones del mismo nivel.\n- `variant=\"pill\"` para filtros de vista livianos dentro de una card.\n\n## Qué provee el consumidor\n- `items`: `{ value, label, count, icon, disabled }`.\n- `value` / `defaultValue` / `onChange`. El contenido lo renderizás vos (o con `TabPanel`).\n\n## Reglas\n- Entre 2 y 7 tabs. Si son más, replanteá la navegación.\n- No uses tabs para pasos secuenciales: para eso está `Stepper`.\n- Navegables con flechas ← →.\n"},{"name":"Tag","group":"Feedback y estado","height":150,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Tag } = window.FlockUI;\nfunction Demo() {\n  const [sel, setSel] = React.useState(['React']);\n  const t = (x) => setSel(sel.includes(x) ? sel.filter((y) => y !== x) : [...sel, x]);\n  return html`\n    <div className=\"fk-row\" style=${{ gap: 6 }}><${Tag}>Angular<//><${Tag}>.NET<//><${Tag}>Oracle PL/SQL<//><${Tag} icon=\"sparkles\">IA generativa<//><${Tag} variant=\"brand\">Caso de éxito<//></div>\n    <div className=\"fk-row\" style=${{ gap: 6 }}>${['React', 'Java', 'Python', 'Go'].map((x) => html`<${Tag} key=${x} selected=${sel.includes(x)} onClick=${() => t(x)}>${x}<//>`)}</div>\n    <div className=\"fk-row\" style=${{ gap: 6 }}><${Tag} onRemove=${() => {}}>Backend<//><${Tag} onRemove=${() => {}}>Urgente<//><${Tag} size=\"sm\" swatch=\"var(--chart-2)\">Q4<//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Etiqueta para categorías, tecnologías o palabras clave; puede ser seleccionable o removible.\n\n## Cuándo usarlo\n- Tecnologías de un proyecto (como los casos de éxito del sitio), categorías, filtros rápidos tipo chip.\n- Para estados de un registro usá `StatusBadge`.\n\n## Qué provee el consumidor\n- `children`, `onRemove`, `selected` + `onClick` (seleccionable), `variant` (`brand`: `surface-brand` con borde Lavender), `size`, `swatch` (color), `icon`.\n\n## Reglas\n- Texto corto (1–3 palabras). No mezcles tags seleccionables y removibles en la misma fila.\n"},{"name":"TemplateDetail","group":"Plantillas","height":760,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, Alert, AppShell, Button, Card, Comments, DescriptionList, DropdownMenu, Header, IconButton, Link, PageHeader, Sidebar, StatCard, StatusBadge, Tabs, Timeline } = window.FlockUI;\nconst LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN4AAAA5CAYAAABZJpWNAAAACXBIWXMAABCcAAAQnAEmzTo0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAlISURBVHgB7Z3vdRM5EMAnPL6fqeCWCggVsFRAqACngjMVxKmAUEH2KkiuAi8VBCrYpYJABXMaa4yNWa9Gf6119HtPL2CvJa1WI400o1mATEDEmUpXKnUqPaIfnUq3KlUQGVVGzfW+43I3aaXS3CKfSqUb198X3KF25vamdn9Q6Z8UfefocKfrMDxdrAbE7SBh4kqQF93/o+vvC+6gHqCT9p1swDhCt2EFAVH5nTvU9wL87r+GQnBQD57J+k5WUKfE+NQQAJXPB3RTg1ee93+6HeCIoGwAPYcIPIPjU0N8avAE9azVqDQDe84dv7O5pmCBep70HCvBpVHa/jn8XpkaxjspVfYvGOenSl/Pzs4aOBFQ6/q3cDxchL0wzlHbdC143LHuIKB0o94UeK8E8Kvh0h7y5xP4Pah7KBR2eMZCR2uI0FNqRfmieWeoUekHZAprARfgDt3bNRQKO9AabwkyXdcFmiVGVTQ1I1LH/Aj54rOdT/dGs34PhcIOpGq+gbiQgXnGAjYIrQfVNb36541KryATeLauLX7yBbTq/IP/NmP3XXi6kOBVEB+a+UY7oOqgrfpzzrtN5yP5zFV6B2mohdf1Kl3yPRQKRkjwSCCy2TXjGaIdueReCecC9IZHbKRru+sidAUbaI33L0wM1clJJU2xYfG34Jr+lEwnhTSQ4FEnnuI6JEW9K8E1LRQKl ondary\" icon=\"download\">Exportar<//><${Button} icon=\"plus\">Nuevo período<//>`} />\n    <div style=${{ display: 'flex', flexDirection: 'column', gap: 16 }}>\n      <${SavedViews} defaultValue=\"pend\" views=${[{ id: 'all', label: 'Todos', count: 248 }, { id: 'pend', label: 'Pendientes', count: 12, default: true }, { id: 'mine', label: 'Mis partners', count: 3 }]} onSave=${() => {}} />\n      <${FilterGrid} activeCount=${2} more=${html`<${FormField} label=\"Responsable\"><${Select} options=${['Ana Torres', 'Martín López']} placeholder=\"Todos\" /><//>`}>\n        <${FormField} label=\"Partner\"><${Combobox} options=${ROWS.map((r) => r.partner)} placeholder=\"Buscá un partner\" /><//>\n        <${FormField} label=\"Estado\"><${Select} options=${['Pendiente', 'En revisión', 'Aprobado', 'Rechazado']} defaultValue=\"Pendiente\" /><//>\n        <${FormField} label=\"Período\"><${DatePicker} range defaultValue=${{ from: new Date(2026, 9, 1), to: new Date(2026, 9, 31) }} /><//>\n        <${FormField} label=\"Código\"><${TextInput} placeholder=\"FP-0000\" /><//>\n      <//>\n      <${DataTable} rows=${ROWS} selectable rowActions=${() => [{ label: 'Ver detalle', icon: 'eye' }, { label: 'Editar', icon: 'edit' }, { type: 'separator' }, { label: 'Anular', icon: 'trash', danger: true }]}\n        columns=${[{ key: 'partner', header: 'Partner', sub: 'cuit', sortable: true }, { key: 'id', header: 'Código', render: (r) => html`<span className=\"fk-mono\">${r.id}</span>` }, { key: 'horas', header: 'Horas', align: 'right', render: (r) => r.horas.toLocaleString('es-AR') }, { key: 'monto', header: 'Monto', align: 'right', sortable: true, render: (r) => '$ ' + r.monto.toLocaleString('es-AR', { minimumFractionDigits: 2 }) }, { key: 'estado', header: 'Estado', render: (r) => html`<${StatusBadge} tone=${TONE[r.estado]}>${r.estado}<//>` }, { key: 'resp', header: 'Responsable' }]}\n        toolbar=${html`<${TableToolbar} title=\"Resultados\" count=${12} actions=${html`<${IconButton} icon=\"columns\" label=\"Columnas\" size=\"sm\" variant=\"secondary\" />`} />`}\n        footer=${html`<${Pagination} total=${12} compact />`} />\n    </div>\n  <//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Plantilla de listado: shell, encabezado, vistas guardadas, grilla de filtros, tabla con acciones y paginación.\n\n## Cuándo usarlo\n- Punto de partida para cualquier pantalla de consulta de registros (partners, períodos, contratos).\n\n## Cómo se arma\n- `AppShell` con `Header`, `Sidebar` y `AppFooter`.\n- `PageHeader` (título + Exportar + acción primaria) → `SavedViews` → `FilterGrid` → `DataTable` con `TableToolbar`, `StatusBadge` y `Pagination`.\n\n## Reglas\n- Un solo buscador por nivel: el del header es global; el de la tabla, local.\n- Si la consulta es instantánea y con pocos criterios, reemplazá `FilterGrid` por `FilterBar`.\n"},{"name":"TemplateMobile","group":"Plantillas","height":800,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, AppShell, Button, DataTable, DropdownMenu, Header, IconButton, PageHeader, Pagination, SavedViews, Sidebar, Stack, StatusBadge } = window.FlockUI;\nconst LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN4AAAA5CAYAAABZJpWNAAAACXBIWXMAABCcAAAQnAEmzTo0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAlISURBVHgB7Z3vdRM5EMAnPL6fqeCWCggVsFRAqACngjMVxKmAUEH2KkiuAi8VBCrYpYJABXMaa4yNWa9Gf6119HtPL2CvJa1WI400o1mATEDEmUpXKnUqPaIfnUq3KlUQGVVGzfW+43I3aaXS3CKfSqUb198X3KF25vamdn9Q6Z8UfefocKfrMDxdrAbE7SBh4kqQF93/o+vvC+6gHqCT9p1swDhCt2EFAVH5nTvU9wL87r+GQnBQD57J+k5WUKfE+NQQAJXPB3RTg1ee93+6HeCIoGwAPYcIPIPjU0N8avAE9azVqDQDe84dv7O5pmCBep70HCvBpVHa/jn8XpkaxjspVfYvGOenSl/Pzs4aOBFQ6/q3cDxchL0wzlHbdC143LHuIKB0o94UeK8E8Kvh0h7y5xP4Pah7KBR2eMZCR2uI0FNqRfmieWeoUekHZAprARfgDt3bNRQKO9AabwkyXdcFmiVGVTQ1I1LH/Aj54rOdT/dGs34PhcIOpGq+gbiQgXnGAjYIrQfVNb36541KryATeLauLX7yBbTq/IP/NmP3XXi6kOBVEB+a+UY7oOqgrfpzzrtN5yP5zFV6B2mohdf1Kl3yPRQKRk 'text' } },\n  { key: 'estado', header: 'Estado', mobile: 'badge', filter: { type: 'multi' }, render: (r) => html`<${StatusBadge} tone=${TONE[r.estado]} size=\"sm\">${r.estado}<//>` },\n  { key: 'resp', header: 'Responsable', filter: { type: 'select' } },\n  { key: 'fecha', header: 'Fecha', sortable: true, sortValue: (r) => r.fecha.split('/').reverse().join('') },\n  { key: 'monto', header: 'Monto', align: 'right', sortable: true, filter: { type: 'number', currency: true }, render: (r) => money(r.monto) },\n];\n\nfunction Demo() {\n  return html`<div style=${{ height: 800 }}><${AppShell} fixed style=${{ height: '100%' }}\n    header=${html`<${Header} logoSrc=${LOGO} product=\"Gestión\" env=\"test\" notifications=${3} user=${USER} />`}\n    sidebar=${html`<${Sidebar} items=${NAV} />`}>\n    <${PageHeader} title=\"Facturación de partners\" actions=${html`<${Button} icon=\"plus\">Nuevo período<//><${DropdownMenu} placement=\"end\" items=${[{ label: 'Exportar a Excel', icon: 'file-spreadsheet' }, { label: 'Generar mails', icon: 'mail' }]} trigger=${html`<${IconButton} icon=\"more-horizontal\" label=\"Más acciones\" variant=\"secondary\" />`} />`} />\n    <${Stack} gap=\"space-15\">\n      <${SavedViews} defaultValue=\"pend\" views=${[{ id: 'all', label: 'Todos', count: 248 }, { id: 'pend', label: 'Pendientes', count: 12, default: true }, { id: 'mine', label: 'Mis partners', count: 3 }]} />\n      <${DataTable} columns=${COLS} rows=${ROWS} rowActions=${() => [{ label: 'Ver detalle', icon: 'eye' }, { label: 'Editar', icon: 'edit' }, { type: 'separator' }, { label: 'Anular', icon: 'trash', danger: true }]}\n        defaultFilters=${{ estado: ['Aprobado', 'En revisión', 'Pendiente'] }} footer=${html`<${Pagination} total=${12} pageSizes=${[10]} defaultPageSize=${10} />`} />\n    <//>\n  <//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Plantilla de listado en mobile (390 px): es el mismo código que la versión de escritorio; los componentes se adaptan solos por debajo de `bp-md` (768 px).\n\n## Qué cambia sin tocar código\n- `AppShell` saca el `Sidebar` de la pantalla y el `Header` muestra el botón de menú, que lo abre como cajón lateral.\n- `Header` oculta el nombre del producto, el buscador y la ayuda; aparece un botón \"Buscar\".\n- `PageHeader` pone el título arriba y la acción primaria a ancho completo.\n- `DataTable` pasa a una tarjeta por registro: la primera columna es el título, la columna con `mobile: 'badge'` va arriba a la derecha, la primera columna numérica es el importe y hasta dos columnas más quedan como datos secundarios. Los filtros de columna y el orden se manejan desde \"Filtrar\" y \"Ordenar\".\n- `Pagination` queda compacta; `SavedViews` y los chips se deslizan en horizontal.\n\n## Qué decide quien construye\n- Qué columna es cada cosa en la tarjeta: `mobile: 'title' | 'subtitle' | 'badge' | 'amount' | 'meta' | 'hidden'`.\n- Si la tabla tiene que verse como tabla igual (muchas columnas comparables): `mobileLayout=\"scroll\"` en `DataTable`.\n"},{"name":"TemplateMobileForm","group":"Plantillas","height":720,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, Button, Checkbox, FormField, Modal, Select, Stack, TextInput } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ height: 720, background: 'var(--bg)' }}>\n    <${Modal} open inline title=\"Nuevo contacto\" description=\"Va a recibir los mails de cierre.\" onClose=${() => {}}\n      footer=${html`<${Button} variant=\"secondary\">Cancelar<//><${Button}>Agregar<//>`}>\n      <${Stack} gap=\"space-15\">\n        <${FormField} label=\"Nombre\" required><${TextInput} defaultValue=\"Paula Ortiz\" /><//>\n        <${FormField} label=\"Mail\" required><${TextInput} icon=\"mail\" defaultValue=\"paula@andessoftware.com\" /><//>\n        <${FormField} label=\"Partner\"><${Select} options=${['Andes Software', 'Nodo Labs', 'Pampa Dev']} defaultValue=\"Andes Software\" /><//>\n        <${Checkbox} label=\"Contacto principal\" defaultChecked />\n      <//>\n    <//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Formulario corto en mobile: el mismo `Modal` de escritorio se convierte en hoja inferior por debajo de `bp-md`, con los botones del pie a ancho completo.\n\n## Qué cambia sin tocar código\n- `Modal` sube desde abajo, ocupa todo el ancho y hasta el 92 % del alto; `Drawer` ocupa la pantalla completa.\n- Los campos de `FormSection` y las grillas pasan a una columna; los botones de `FormActions` y del pie del modal se reparten el ancho.\n- En pantallas táctiles todo control mide al menos 44 px (`size-touch`) y los inputs usan texto de 16 px para que el teléfono no haga zoom.\n\n## Qué decide quien construye\n- Más de 5 campos: no uses un modal, llevá el formulario a una página con `FormLayout` y `FormActions sticky`.\n"},{"name":"TextInput","group":"Formularios","height":260,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, TextInput } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 16, width: '100%' }}>\n    <${TextInput} placeholder=\"Nombre del proyecto\" />\n    <${TextInput} icon=\"mail\" placeholder=\"nombre@flockit.com.ar\" />\n    <${TextInput} prefix=\"https://\" suffix=\".flockit.com.ar\" defaultValue=\"maart\" />\n    <${TextInput} defaultValue=\"CTR-2026-014\" clearable />\n    <${TextInput} maxLength=${40} showCount defaultValue=\"Equipo Alfa\" />\n    <${TextInput} invalid defaultValue=\"30-7123\" />\n    <${TextInput} size=\"sm\" placeholder=\"Chico (32px)\" />\n    <${TextInput} disabled defaultValue=\"Deshabilitado\" />\n    <${TextInput} readOnly defaultValue=\"Solo lectura\" />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Campo de texto de una línea, con ícono, prefijo/sufijo, contador y botón de limpiar.\n\n## Cuándo usarlo\n- Datos cortos: nombres, códigos, emails, CUIT. Para importes usá `NumberInput`; para búsquedas, `SearchField`.\n\n## Qué provee el consumidor\n- `value` / `defaultValue` / `onChange(value, event)`, `placeholder`, `type`.\n- `icon`, `prefix`, `suffix`, `clearable`, `maxLength` + `showCount`.\n- `size` (`sm` 32px · `md` 40px · `lg` 48px), `invalid`, `disabled`, `readOnly`.\n\n## Reglas\n- Siempre dentro de un `FormField`. El placeholder es un ejemplo, nunca el label.\n"},{"name":"Textarea","group":"Formularios","height":190,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FormField, Textarea } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Observaciones\" optional><${Textarea} placeholder=\"Agregá contexto para el equipo de facturación\" /><//>\n    <${FormField} label=\"Motivo del rechazo\" required><${Textarea} maxLength=${280} defaultValue=\"Las horas de septiembre no coinciden con el reporte del partner.\" /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Texto de varias líneas para observaciones y descripciones.\n\n## Cuándo usarlo\n- Texto libre de más de una oración. Para comentarios con menciones usá `Comments`.\n\n## Qué provee el consumidor\n- `value` / `defaultValue` / `onChange`, `rows` (por defecto 3), `maxLength` (muestra contador), `invalid`, `disabled`, `placeholder`.\n\n## Reglas\n- Se redimensiona solo en vertical. Con límite, mostralo siempre.\n"},{"name":"TimePicker","group":"Formularios","height":360,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FormField, TimePicker } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Inicio de la ventana de despliegue\"><${TimePicker} defaultValue=\"20:00\" from=\"18:00\" to=\"23:30\" defaultOpen /><//>\n    <${FormField} label=\"Hora de la daily\"><${TimePicker} step=${15} defaultValue=\"09:45\" /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Hora del día en formato 24 h, elegida de una lista o tipeada.\n\n## Cuándo usarlo\n- Horarios de reuniones, cortes de procesos, ventanas de despliegue.\n\n## Qué provee el consumidor\n- `value` / `defaultValue` (\"hh:mm\") / `onChange`, `step` en minutos (por defecto 30), `from` y `to` (\"08:00\"–\"20:00\"), `placeholder`.\n\n## Reglas\n- Siempre 24 h (\"14:30\"), sin \"a. m.\" ni \"p. m.\".\n"},{"name":"Timeline","group":"Filtros y datos","height":360,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Timeline } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-card\" style=${{ padding: 20, width: '100%', maxWidth: 560 }}>\n    <${Timeline} items=${[\n      { tone: 'success', icon: 'check', title: html`<b>Martín López</b> aprobó el período`, meta: '05/10/2026 14:32' },\n      { tone: 'warning', icon: 'alert-triangle', title: html`<b>Sistema</b> detectó diferencia de horas`, meta: '04/10/2026 09:10', content: 'El reporte de Nodo Labs tiene 12 h más que lo cargado en el sistema.' },\n      { tone: 'info', icon: 'upload', title: html`<b>Ana Torres</b> subió el Excel de octubre`, meta: '03/10/2026 18:05' },\n      { tone: 'brand', icon: 'plus', title: html`<b>Ana Torres</b> creó el período`, meta: '01/10/2026 08:00' },\n    ]} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Historial de actividad o auditoría de un registro.\n\n## Cuándo usarlo\n- Pestaña \"Historial\" de un detalle, cambios de estado, trazabilidad de aprobaciones.\n\n## Qué provee el consumidor\n- `items` `{ title (puede incluir <b>), meta (\"Persona · fecha hora\"), tone (success · warning · danger · info · brand), icon, content }`.\n\n## Reglas\n- Más reciente arriba. Fechas dd/mm/aaaa hh:mm. El tono acompaña al ícono, nunca solo.\n"},{"name":"Toast","group":"Feedback y estado","height":300,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Link, Toast, ToastStack } = window.FlockUI;\nfunction Demo() {\n  return html`<${ToastStack} inline>\n    <${Toast} tone=\"success\" title=\"Período guardado\" onClose=${() => {}} action=${html`<${Link} href=\"#\">Deshacer<//>`}>Los cambios ya son visibles para el equipo.<//>\n    <${Toast} tone=\"info\" title=\"Exportación en curso\" onClose=${() => {}}>Te avisamos cuando el Excel esté listo.<//>\n    <${Toast} tone=\"danger\" title=\"No pudimos enviar 2 mails\" onClose=${() => {}}>Revisá las direcciones de Pampa Dev y Río Sistemas.<//>\n  <//>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Confirmación breve de una acción, que desaparece sola. Se apilan con `ToastStack` abajo a la derecha.\n\n## Cuándo usarlo\n- Después de guardar, enviar, copiar o exportar. Si la persona tiene que actuar, usá `Alert` o un `Modal`.\n\n## Qué provee el consumidor\n- `Toast`: `tone` (`success` · `info` · `warning` · `danger`), `title`, `children`, `action` (por ejemplo \"Deshacer\"), `onClose`, `duration` (ms; por defecto 5000, y sin cierre automático en `danger`).\n- `ToastStack`: contenedor fijo; `inline` para mostrarlo en el flujo.\n\n## Mobile\n- El `ToastStack` va abajo a todo el ancho.\n\n## Reglas\n- Máximo 3 a la vez; se cierran solos a los 5 s (los de error quedan hasta cerrarlos).\n- Texto en pasado: \"Período guardado\".\n"},{"name":"Tooltip","group":"Contenedores","height":130,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, IconButton, Tooltip } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ gap: 60, padding: '36px 0 0 40px' }}>\n    <${Tooltip} content=\"Editar período\" open><${IconButton} icon=\"edit\" label=\"Editar período\" variant=\"secondary\" /><//>\n    <${Tooltip} content=\"Copiado\" placement=\"bottom\" open><${IconButton} icon=\"check\" label=\"Copiar\" /><//>\n    <${Tooltip} content=\"Horas cargadas vs. reportadas\" placement=\"right\" open><span className=\"fk-text fk-text--muted\" style=${{ textDecoration: 'underline dotted' }}>Desvío</span><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Ayuda breve al pasar el mouse o enfocar; etiqueta de los botones de solo ícono.\n\n## Cuándo usarlo\n- Para nombrar un `IconButton` o aclarar un dato abreviado. Si la información es necesaria para completar una tarea, escribila en pantalla.\n\n## Qué provee el consumidor\n- `content`, `children` (el disparador), `placement` (`top` · `bottom` · `right`), `wrap` (texto de varias líneas), `open` (forzar).\n\n## Mobile\n- En pantallas táctiles no se muestra: lo necesario tiene que estar visible.\n\n## Reglas\n- Una línea, sin acciones ni links adentro (para eso, `Popover`). Invertido: fondo `ink`, texto `surface`.\n"},{"name":"TreeView","group":"Filtros y datos","height":340,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, TreeView } = window.FlockUI;\nfunction Demo() {\n  const data = [{ id: 'cliente', label: 'Cliente Ejemplo', icon: 'building', children: [\n    { id: 'maart', label: 'Portal de Gestión', meta: '4 módulos', children: [{ id: 'svcc', label: 'Equipo Alfa', icon: 'users', meta: '7 personas' }, { id: 'cross', label: 'Equipo Beta', icon: 'users', meta: '5 personas' }] },\n    { id: 'fact', label: 'Facturación partners', children: [{ id: 'oct', label: 'Octubre 2026.xlsx', icon: 'file-spreadsheet' }, { id: 'sep', label: 'Septiembre 2026.xlsx', icon: 'file-spreadsheet' }] },\n  ] }, { id: 'interno', label: 'Flock interno', icon: 'building', children: [{ id: 'iaday', label: 'Jornada de innovación', children: [] }] }];\n  return html`<div className=\"fk-card\" style=${{ padding: 12, width: 420 }}><${TreeView} data=${data} defaultExpanded=${['cliente', 'maart', 'fact']} defaultSelected=\"svcc\" /></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Jerarquía expandible: organización, módulos, carpetas.\n\n## Cuándo usarlo\n- Datos con más de dos niveles de anidamiento. Para dos niveles alcanza el `Sidebar` o un `Accordion`.\n\n## Qué provee el consumidor\n- `data` `{ id, label, icon, meta, children }`, `defaultExpanded` (ids), `selected` / `defaultSelected`, `onSelect(id, node)`.\n\n## Reglas\n- Íconos de carpeta para nodos con hijos; metadato (cantidad) a la derecha.\n"},{"name":"UserCard","group":"Personas y colaboración","height":300,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, UserCard } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <${UserCard} name=\"Martín López\" role=\"Analista funcional\" team=\"Equipo Alfa\" tags=${['Facturación', 'QA']} email=\"martin.lopez@flockit.com.ar\" location=\"Buenos Aires · Híbrido\" status=\"online\" />\n    <${UserCard} name=\"Julia Méndez\" role=\"Desarrolladora backend\" team=\"Equipo Beta\" tags=${['.NET', 'Oracle']} email=\"julia.mendez@flockit.com.ar\" location=\"Córdoba · Remoto\" actions=${false} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Tarjeta de una persona: rol, equipo, contacto y acciones rápidas.\n\n## Cuándo usarlo\n- Directorio del equipo, responsables de un partner, vista previa al pasar sobre un avatar (dentro de un `Popover`).\n\n## Qué provee el consumidor\n- `name`, `role`, `email`, `phone`, `location`, `team` (tag de marca), `tags`, `avatar`, `status`, `actions` (o `false` para ocultarlas).\n\n## Reglas\n- Datos de contacto laborales solamente.\n"},{"name":"UserMenu","group":"Layout y navegación","height":330,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, UserMenu } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'flex', justifyContent: 'flex-end', width: '100%' }}>\n    <${UserMenu} defaultOpen user=${{ name: 'Ana Torres', role: 'Team Manager', email: 'ana.torres@flockit.com.ar' }} theme=\"light\" />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Menú de la persona usuaria: perfil, preferencias, tema y cerrar sesión.\n\n## Cuándo usarlo\n- En el `Header` (ya incluido) o al pie del `Sidebar`.\n\n## Qué provee el consumidor\n- `user` `{ name, role, email, avatar }`.\n- `items` para reemplazar las opciones por defecto; `theme` + `onThemeChange` para el cambio claro/oscuro; `onSignOut`.\n- `compact`: solo avatar (como en el header).\n\n## Reglas\n- \"Cerrar sesión\" siempre último, separado.\n- No pongas acciones de negocio acá.\n"}],"logos":[{"name":"Logo flock complete.svg","uri":"data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjYwIiBoZWlnaHQ9IjY3IiB2aWV3Qm94PSIwIDAgMjYwIDY3IiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgo8cGF0aCBkPSJNMTA1LjU4MyAyNy45MTE3QzEwNS41OCAyOC42NDM4IDEwNS40MzIgMjkuMzY3OSAxMDUuMTQ4IDMwLjA0MjRDMTA0Ljg2MyAzMC43MTY4IDEwNC40NDkgMzEuMzI4MyAxMDMuOTI4IDMxLjg0MTRDMTAzLjQwNyAzMi4zNTQ2IDEwMi43ODkgMzIuNzU5MyAxMDIuMTExIDMzLjAzMjNDMTAxLjQzMyAzMy4zMDUzIDEwMC43MDggMzMuNDQxMiA5OS45NzczIDMzLjQzMkg5NC40Njc0VjYxLjIzMDFDOTQuNDY2IDYyLjY5MzggOTMuODg1IDY0LjA5NzEgOTIuODUyIDY1LjEzMkM5MS44MTkgNjYuMTY3IDkwLjQxODQgNjYuNzQ5IDg4Ljk1NzUgNjYuNzUwNEM4Ny40ODY0IDY2Ljc1MjkgODYuMDczNSA2Ni4xNzUxIDg1LjAyNDMgNjUuMTQyMUM4My45NzUxIDY0LjEwOTEgODM <script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var SH = JSON.parse(document.getElementById('shared').textContent);
  var root = document.documentElement;
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var h = function (tag, attrs, html) { var e = document.createElement(tag); for (var k in (attrs || {})) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var md = function (s) { return marked.parse(s, { gfm: true }); };

  // Fonts (needs internet; falls back to system-ui offline)
  var fm = /url\('([^']+)'\)/.exec(SH.fontImport || '');
  if (fm) { var l = h('link', { rel: 'stylesheet', href: fm[1] }); document.head.appendChild(l); }

  // ---- theme
  var theme = 'light';
  try { theme = localStorage.getItem('flock-ds-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  function applyTheme() {
    root.setAttribute('data-theme', theme);
    var bl = $('#side .brand img'); if (bl) bl.src = theme === 'dark' ? DATA.logos[2].uri : DATA.logos[0].uri;
    $('#theme').textContent = theme === 'dark' ? 'Switch to light' : 'Switch to dark';
    document.querySelectorAll('iframe[data-pv]').forEach(function (f) {
      try { f.contentDocument.documentElement.setAttribute('data-theme', theme); } catch (e) {}
    });
  }
  $('#theme').onclick = function () { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('flock-ds-theme', theme); } catch (e) {} applyTheme(); };
  $('#menu').onclick = function () { $('#app').classList.toggle('open'); };

  // ---- preview iframes
  var CLOSE = '</' + 'script>';
  function srcdoc(c) {
    return '<!doctype html><html data-theme="' + theme + '"><head><meta charset="utf-8">' +
      '<style>' + SH.tokensCss + '\n' + SH.bundleCss + '\nhtml,body{margin:0}body{background:var(--bg);color:var(--ink)}</style>' +
      (c.head || '') +
      '<script>' + SH.react + CLOSE + '<script>' + SH.reactDom + CLOSE + '<script>' + SH.bundleJs + CLOSE +
      '</head><body>' + c.body + '</body></html>';
  }
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); load(e.target); } });
  }, { rootMargin: '400px' }) : null;
  function load(box) {
    var c = DATA.comps[+box.getAttribute('data-i')];
    var f = h('iframe', { 'data-pv': '1', title: c.name + ' preview', loading: 'eager' });
    f.style.height = c.height + 'px';
    f.srcdoc = srcdoc(c);
    box.innerHTML = ''; box.appendChild(f);
  }
  function preview(i) {
    var c = DATA.comps[i];
    var card = h('div', { class: 'card' });
    card.appendChild(h('div', { class: 'hd' }, '<span>Live preview</span><span>' + esc(c.group || 'Cover') + '</span>'));
    var box = h('div', { class: 'ph', 'data-i': i });
    box.style.height = c.height + 'px'; box.textContent = 'Loading preview…';
    card.appendChild(box);
    if (io) io.observe(box); else load(box);
    return card;
  }

  // ---- routing
  var comps = DATA.comps, idx = {}; comps.forEach(function (c, i) { idx[c.name] = i; });
  var groups = []; var gmap = {};
  comps.forEach(function (c) { if (!c.group) return; if (!gmap[c.group]) { gmap[c.group] = []; groups.push(c.group); } gmap[c.group].push(c); });
  groups.forEach(function (g) { gmap[g].sort(function (a, b) { return a.name.localeCompare(b.name); }); });

  var side = $('#side');
  var logo = DATA.logos[0].uri;
  var nav = '<div class="brand"><img src="' + logo + '" alt="Flock"><b>' + esc(DATA.title) + '</b></div>';
  nav += '<a href="#/cover">Cover</a><h6>Brand book</h6>';
  DATA.docs.forEach(function (d) { nav += '<a href="#/doc/' + d.id + '">' + esc(d.title) + '</a>'; });
  nav += '<a href="#/logos">Logos</a><h6>Foundations</h6><a href="#/tokens">Tokens</a><h6>Components</h6>';
  groups.forEach(function (g) {
    nav += '<details data-g="' + esc(g) + '"><summary>' + esc(g) + '<span>' + gmap[g].length + '</span></summary><a href="#/group/' + encodeURIComponent(g) + '"><em>All in group</em></a>' +
      gmap[g].map(function (c) { return '<a href="#/c/' + c.name + '">' + c.name + '</a>'; }).join('') + '</details>';
  });
  side.innerHTML = nav;

  function setCrumb(t) { $('#crumb').textContent = t; document.title = t + ' — ' + DATA.title; }
  function page(el) { var p = $('#page'); p.innerHTML = ''; p.appendChild(el); $('#main').scrollTop = 0; }
  function mdBlock(src) { return h('div', { class: 'md' }, md(src)); }

  function pCover() {
    var w = h('div'); setCrumb('Cover');
    w.appendChild(h('h1', { class: 'pt' }, esc(DATA.title)));
    w.appendChild(h('p', { class: 'lede' }, 'Flock Design System — brand book, tokens and the ' + esc(DATA.namespace) + ' component library.'));
    if (idx.Cover != null) w.appendChild(preview(idx.Cover));
    var lc = DATA.lastChange; if (lc) w.appendChild(h('p', { class: 'note' }, 'Last change (' + esc(lc.at) + ', ' + esc(lc.by) + '): ' + esc(lc.note)));
    return w;
  }
  function pDoc(id) {
    var d = DATA.docs.filter(function (x) { return x.id === id; })[0]; if (!d) return pCover();
    setCrumb(d.title); return mdBlock(d.md);
  }
  function pLogos() {
    setCrumb('Logos'); var w = h('div'); w.appendChild(h('h1', { class: 'pt' }, 'Logos'));
    w.appendChild(h('p', { class: 'lede' }, 'Embedded assets from the design system. The SVG logos use a single ink (brand-night) and are for light backgrounds only; the white PNG is for dark brand surfaces.'));
    var g = h('div', { class: 'logos' });
    DATA.logos.forEach(function (l) { g.appendChild(h('figure', {}, '<div class="pic' + (l.dark ? ' dark' : '') + '"><img src="' + l.uri + '" alt="' + esc(l.name) + '"></div><figcaption>' + esc(l.name) + '</figcaption>')); });
    w.appendChild(g); return w;
  }
  function pComp(name) {
    var i = idx[name]; if (i == null) return pCover(); var c = comps[i]; setCrumb(c.name);
    var w = h('div'); w.appendChild(h('h1', { class: 'pt' }, esc(c.name)));
    w.appendChild(h('p', { class: 'lede' }, esc(c.group || '')));
    w.appendChild(preview(i)); if (c.readme) w.appendChild(mdBlock(c.readme)); return w;
  }
  function pGroup(g) {
    setCrumb(g); var w = h('div'); w.appendChild(h('h1', { class: 'pt' }, esc(g)));
    (gmap[g] || []).forEach(function (c) {
      w.appendChild(h('h2', { class: 'cname' }, '<a href="#/c/' + c.name + '">' + c.name + '</a>'));
      w.appendChild(preview(idx[c.name])); if (c.readme) w.appendChild(mdBlock(c.readme));
    });
    return w;
  }

  // ---- tokens page
  var T = DATA.tokens, cbn = {}; T.color.tokens.forEach(function (t) { cbn[t.name] = t; });
  function resolve(v) { if (typeof v !== 'string') return v; var m = /^\{([\w-]+)\}$/.exec(v); if (m && cbn[m[1]] && typeof cbn[m[1]].value === 'string') return cbn[m[1]].value + ' (' + m[1] + ')'; return v; }
  function hex(v) { var m = /^\{([\w-]+)\}$/.exec(v); return m && cbn[m[1]] && typeof cbn[m[1]].value === 'string' ? cbn[m[1]].value : v; }
  function pTokens() {
    setCrumb('Tokens'); var w = h('div'); w.appendChild(h('h1', { class: 'pt' }, 'Tokens'));
    w.appendChild(h('p', { class: 'lede' }, 'Generated from tokens.json. Swatches follow the active theme; both theme values are listed.'));
    // palette scales
    w.appendChild(h('div', { class: 'sec' }, 'Brand palette'));
    var scales = {}, order = [];
    T.color.tokens.forEach(function (t) { if (typeof t.value !== 'string') return; var m = /^(.*?)-(\d+)$/.exec(t.name); if (!m && t.name !== "brand-night") return; var k = m ? m[1] : t.name; if (!scales[k]) { scales[k] = []; order.push(k); } scales[k].push(t); });
    order.forEach(function (k) {
      w.appendChild(h('div', { class: 'lbl' }, k));
      w.appendChild(h('div', { class: 'scale' }, scales[k].map(function (t) { var l = parseInt(t.value.slice(1, 3), 16) * .3 + parseInt(t.value.slice(3, 5), 16) * .6 + parseInt(t.value.slice(5, 7), 16) * .1; return '<i title="' + esc(t.name + ' ' + t.value + ' — ' + (t.usage || '')) + '" style="background:var(--' + t.name + ');color:' + (l > 140 ? '#000' : '#fff') + '"><span>' + t.name.replace(k + '-', '') + '</span></i>'; }).join('')));
    });
    // semantic
    w.appendChild(h('div', { class: 'sec' }, 'Semantic colors'));
    var g = h('div', { class: 'sw' });
    T.color.tokens.forEach(function (t) {
      if (typeof t.value === 'string' && /-\d+$/.test(t.name)) return;
      if (t.name === 'brand-night') { /* keep */ }
      var val = typeof t.value === 'string' ? '<small>' + esc(resolve(t.value)) + '</small>' : '<small>light: ' + esc(resolve(t.value.light)) + '</small><small>dark: ' + esc(resolve(t.value.dark)) + '</small>';
      g.appendChild(h('div', { class: 'c' }, '<i style="background:var(--' + t.name + ')"></i><div><b>--' + t.name + '</b>' + val + '<em>' + esc(t.usage || '') + '</em></div>'));
    });
    w.appendChild(g);
    // gradients
    w.appendChild(h('div', { class: 'sec' }, 'Gradients'));
    var gg = h('div', { class: 'sw' });
    T.gradient.tokens.forEach(function (t) { gg.appendChild(h('div', { class: 'c' }, '<i style="background:' + esc(t.value) + '"></i><div><b>--' + t.name + '</b><small>' + esc(t.value) + '</small><em>' + esc(t.usage || '') + '</em></div>')); });
    w.appendChild(gg);
    // type
    w.appendChild(h('div', { class: 'sec' }, 'Typography'));
    var fl = h('table', { class: 'tbl' }, Object.keys(T.type.families).map(function (k) { return '<tr><td>--font-' + k + '</td><td>' + esc(T.type.families[k]) + '</td></tr>'; }).join(''));
    w.appendChild(fl);
    T.type.groups.forEach(function (gr) {
      w.appendChild(h('div', { class: 'lbl', style: 'margin-top:20px' }, gr.name));
      gr.styles.forEach(function (s) {
        w.appendChild(h('div', { class: 'trow' }, '<div><code>' + s.name + '</code><small>' + s.fontWeight + ' · ' + s.fontSize + '/' + s.lineHeight + ' · ls ' + s.letterSpacing + '</small></div><div><div style="font:var(--text-' + s.name + ');letter-spacing:' + s.letterSpacing + '">' + esc(s.sample || s.name) + '</div><small style="display:block;color:var(--ink-subtle);font-size:12px;margin-top:4px">' + esc(s.usage || '') + '</small></div>'));
      });
    });
    // spacing
    w.appendChild(h('div', { class: 'sec' }, 'Spacing'));
    w.appendChild(h('div', { class: 'bars' }, T.spacing.tokens.map(function (t) { return '<div><span style="width:90px">' + t.name + '</span><i style="width:' + t.value + '"></i><span>' + t.value + '</span><span style="font-family:var(--font-sans);color:var(--ink-subtle)">' + esc(t.usage || '') + '</span></div>'; }).join('')));
    // radius
    w.appendChild(h('div', { class: 'sec' }, 'Radius'));
    w.appendChild(h('div', { class: 'boxes' }, T.radius.tokens.map(function (t) { return '<div style="border-radius:' + t.value + '">' + t.name + '<br>' + t.value + '</div>'; }).join('')));
    // border
    w.appendChild(h('div', { class: 'sec' }, 'Border widths'));
    w.appendChild(h('div', { class: 'boxes' }, T.borderWidth.tokens.map(function (t) { return '<div style="border:' + t.value + ' solid var(--primary)">' + t.name + '<br>' + t.value + '</div>'; }).join('')));
    // shadows
    w.appendChild(h('div', { class: 'sec' }, 'Shadows'));
    w.appendChild(h('div', { class: 'boxes' }, T.shadow.tokens.map(function (t) { return '<div style="border-radius:10px;box-shadow:var(--' + t.name + ')">' + t.name + '</div>'; }).join('')));
    w.appendChild(h('table', { class: 'tbl', style: 'margin-top:12px' }, T.shadow.tokens.map(function (t) { return '<tr><td>' + t.name + '</td><td>light: ' + esc(t.value.light) + '<br>dark: ' + esc(t.value.dark) + '</td><td>' + esc(t.usage || '') + '</td></tr>'; }).join('')));
    // tables
    [['zIndex', 'Layers (z-index)'], ['breakpoint', 'Breakpoints'], ['size', 'Sizes']].forEach(function (p) {
      w.appendChild(h('div', { class: 'sec' }, p[1]));
      if (T[p[0]].note) w.appendChild(h('p', { class: 'lede' }, esc(T[p[0]].note)));
      w.appendChild(h('table', { class: 'tbl' }, T[p[0]].tokens.map(function (t) { return '<tr><td>--' + t.name + '</td><td>' + esc(t.value) + '</td><td>' + esc(t.usage || '') + '</td></tr>'; }).join('')));
    });
    return w;
  }

  function route() {
    var hs = location.hash.replace(/^#\/?/, ''), parts = hs.split('/'), r = parts[0], a = decodeURIComponent(parts.slice(1).join('/'));
    var el;
    if (r === 'doc') el = pDoc(a); else if (r === 'logos') el = pLogos(); else if (r === 'tokens') el = pTokens();
    else if (r === 'c') el = pComp(a); else if (r === 'group') el = pGroup(a); else el = pCover();
    page(el);
    var cur = '#/' + (hs || 'cover');
    side.querySelectorAll('a').forEach(function (x) { x.classList.toggle('on', x.getAttribute('href') === cur); });
    var on = side.querySelector('a.on'); if (on) { var d = on.closest('details'); if (d) d.open = true; }
    $('#app').classList.remove('open');
  }
  window.addEventListener('hashchange', route);
  applyTheme(); route();
})();
</script>
</body>
