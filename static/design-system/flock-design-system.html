 Torres', role: 'Team Manager', email: 'ana.torres@flockit.com.ar' };\n\nfunction Demo() {\n  return html`<${AppShell} fixed style=${{ height: 560 }}\n    header=${html`<${Header} logoSrc=${LOGO} product=\"Facturación\" env=\"test\" notifications=${3} user=${USER} />`}\n    sidebar=${html`<${Sidebar} items=${NAV} />`}\n    footer=${html`<${AppFooter} product=\"Facturación\" version=\"2.4.1\" />`}>\n    <${PageHeader} title=\"Facturación de partners\" description=\"Seguimiento mensual de horas y montos por partner.\"\n      breadcrumbs=${[{ label: 'Inicio' }, { label: 'Facturación' }]}\n      actions=${html`<${Button} variant=\"secondary\" icon=\"download\">Exportar<//><${Button} icon=\"plus\">Nuevo período<//>`} />\n    <${Grid} cols=${3}>\n      <${StatCard} label=\"Facturado en octubre\" value=\"$ 48.250.000\" delta=${8.4} icon=\"dollar\" />\n      <${StatCard} label=\"Horas cargadas\" value=\"6.412\" delta=${-2.1} icon=\"clock\" />\n      <${StatCard} label=\"Partners activos\" value=\"5\" delta=${0} deltaLabel=\"sin cambios\" icon=\"building\" />\n    <//>\n  <//>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Estructura base de toda app interna: header de marca arriba, sidebar a la izquierda, contenido y footer.\n\n## Cuándo usarlo\n- Siempre, como raíz de cada aplicación interna. Una sola por app.\n\n## Qué provee el consumidor\n- `header`: normalmente un `Header`.\n- `sidebar`: normalmente un `Sidebar`.\n- `footer` (opcional): `AppFooter`.\n- `children`: el contenido de la página, que arranca con un `PageHeader`.\n- `fixed`: alto fijo con scroll interno (para embeber en un contenedor de altura conocida).\n\n## Mobile\n- Por debajo de 768 px el `Sidebar` sale de la pantalla y se abre como cajón lateral desde el botón de menú del `Header`; el margen de página pasa a `space-15`.\n\n## Reglas\n- El contenido tiene margen `space-30`; no agregues otro contenedor con padding.\n- El header queda fijo al hacer scroll; el sidebar ocupa todo el alto.\n- No anides dos `AppShell`.\n"},{"name":"Avatar","group":"Personas y colaboración","height":150,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Avatar, AvatarGroup } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\" style=${{ gap: 16 }}>\n      <${Avatar} name=\"Ana Torres\" size=\"xs\" /><${Avatar} name=\"Martín López\" size=\"sm\" /><${Avatar} name=\"Julia Méndez\" /><${Avatar} name=\"Diego Sosa\" size=\"lg\" status=\"online\" /><${Avatar} name=\"Laura Ríos\" size=\"xl\" status=\"away\" />\n      <${Avatar} name=\"Equipo Alfa\" size=\"lg\" tone=\"t4\" />\n    </div>\n    <${AvatarGroup} people=${['Ana Torres', 'Martín López', 'Julia Méndez', 'Diego Sosa', 'Laura Ríos', 'Pablo Díaz', 'Sofía Paz']} max=${4} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Persona o equipo, con foto o iniciales y estado de presencia. `AvatarGroup` superpone varios con \"+N\".\n\n## Cuándo usarlo\n- Responsables en tablas, autores de comentarios, menú de usuario, equipos asignados.\n\n## Qué provee el consumidor\n- `Avatar`: `name` (genera iniciales y color estable), `src`, `size` (`xs` 24 · `sm` 28 · `md` 32 · `lg` 40 · `xl` 56), `status` (`online` · `away` · `busy`), `tone` (forzar color).\n- `AvatarGroup`: `people` (nombres u objetos `{ name, avatar }`), `max`, `size`.\n\n## Reglas\n- Siempre con `name` (es el texto accesible). El color de iniciales sale de la paleta de marca.\n"},{"name":"Breadcrumbs","group":"Layout y navegación","height":110,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Breadcrumbs } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${Breadcrumbs} items=${[{ label: 'Inicio' }, { label: 'Facturación' }]} />\n    <${Breadcrumbs} items=${[{ label: 'Partners' }, { label: 'Andes Software' }, { label: 'Octubre 2026' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Muestra dónde está la página dentro de la jerarquía y permite subir niveles.\n\n## Cuándo usarlo\n- En páginas de segundo nivel o más profundas, dentro de `PageHeader`.\n\n## Qué provee el consumidor\n- `items`: `{ label, href, onClick }`. El último es la página actual y no es link.\n\n## Reglas\n- Máximo 4 niveles; si hay más, empezá desde el módulo.\n- No repitas el nombre de la app ni \"Inicio\" si el sidebar ya lo deja claro.\n"},{"name":"BulkActionBar","group":"Acciones","height":120,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, BulkActionBar } = window.FlockUI;\nfunction Demo() {\n  return html`<${BulkActionBar} count=${8} noun=${['registro seleccionado', 'registros seleccionados']} onClear=${() => {}}\n    actions=${[{ label: 'Aprobar', icon: 'check' }, { label: 'Exportar', icon: 'download' }, { label: 'Asignar', icon: 'user' }, { label: 'Eliminar', icon: 'trash' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Barra de acciones sobre las filas seleccionadas de una tabla.\n\n## Cuándo usarlo\n- Cuando una `DataTable` tiene `selectable` y hay acciones masivas (aprobar, exportar, eliminar). Aparece solo si hay selección.\n\n## Qué provee el consumidor\n- `count`, `noun` (singular y plural), `actions` `{ label, icon, onClick }`, `onClear`, `floating` (fija abajo al centro).\n\n## Reglas\n- Máximo 4 acciones. Las destructivas piden confirmación con el número de elementos: \"Eliminar 8 registros\".\n"},{"name":"Button","group":"Acciones","height":260,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Button } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\">\n      <${Button}>Guardar cambios<//>\n      <${Button} variant=\"secondary\" icon=\"download\">Exportar<//>\n      <${Button} variant=\"ghost\" icon=\"plus\">Agregar fila<//>\n      <${Button} variant=\"danger\" icon=\"trash\">Eliminar<//>\n    </div>\n    <div className=\"fk-row\">\n      <${Button} size=\"sm\">Chico<//><${Button}>Mediano<//><${Button} size=\"lg\">Grande<//>\n      <${Button} loading>Guardando<//><${Button} disabled>Deshabilitado<//>\n    </div>\n    <div className=\"fk-row\" style=${{ background: 'var(--surface-brand)', padding: 16, borderRadius: 20 }}>\n      <${Button} variant=\"brand\" iconRight=\"arrow-right\">Agendá una consultoría<//>\n      <${Button} variant=\"inverse\" icon=\"mail\">Generar mails<//>\n    </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Botón pill para acciones: primario, de marca, secundario, ghost, peligro e inverso.\n\n## Cuándo usarlo\n- `primary`: la acción principal de la vista. Una sola por pantalla o modal.\n- `brand`: CTA de marca, como la lámina de botones: pill blanco 20% con texto blanco; en hover pasa a blanco con texto `brand-night`. Solo sobre `surface-brand`, `brand-night` o un degradé de marca (login, portadas, card y ErrorPage de marca): sobre fondos claros no se ve.\n- `secondary`: acciones alternativas (Exportar, Cancelar).\n- `ghost`: acciones terciarias y dentro de tablas o cards.\n- `danger`: acciones destructivas, siempre después de un `ConfirmDialog`.\n- `inverse`: alternativa con borde sobre `surface-brand` (header, barra de acciones masivas, al lado de un `brand`).\n\n## Qué provee el consumidor\n- `children` (verbo + objeto), `variant`, `size` (`sm` 32px · `md` 40px · `lg` 44px, el \"Leer más\" del sitio).\n- `icon` / `iconRight` (nombres de `Icon`), `loading`, `disabled`, `block`, `href` (renderiza `<a>`).\n\n## Reglas\n- Texto en Zalando Sans SemiExpanded Regular (`button`, `button-sm`), sentence case y sin punto final: \"Guardar cambios\". El CTA de marca lleva `iconRight=\"arrow-right\"`.\n- Con `loading` el ancho no cambia y el botón no recibe clics.\n- No uses dos `primary` juntos; el segundo es `secondary`.\n"},{"name":"Calendar","group":"Filtros y datos","height":620,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Calendar } = window.FlockUI;\nfunction Demo() {\n  const d = (n) => new Date(2026, 9, n);\n  return html`<${Calendar} year=${2026} month=${9} today=${d(5)} events=${[\n    { date: d(1), title: 'Apertura período', time: '08:00' },\n    { date: d(5), title: 'Daily del equipo', time: '09:45', tone: 'info' }, { date: d(5), title: 'Aprobación Nodo Labs', tone: 'success' },\n    { date: d(8), title: 'Deploy a TEST', time: '20:00', tone: 'warning' },\n    { date: d(15), title: 'Cierre de horas', tone: 'accent' },\n    { date: d(20), title: 'Deploy a PROD', time: '21:00', tone: 'accent' }, { date: d(20), title: 'Revisión de hallazgos', time: '10:00' }, { date: d(20), title: 'Revisión de objetivos', time: '15:00' }, { date: d(20), title: 'Comité', time: '17:00' },\n    { date: d(28), title: 'Jornada de innovación', tone: 'info' },\n  ]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Vista mensual con eventos.\n\n## Cuándo usarlo\n- Vencimientos, despliegues, cierres de período, ausencias del equipo.\n\n## Qué provee el consumidor\n- `year`, `month` (0–11), `events` `{ date (Date), title, time, tone (accent · success · warning · info) }`, `today`, `maxPerDay`, `onEventClick`.\n\n## Mobile\n- Los eventos pasan a marcas de color; con muchos eventos, usá una `List` agrupada por día.\n\n## Reglas\n- Semana de lunes a domingo. Más de `maxPerDay` eventos se resumen en \"+N más\".\n- `accent` (Lavender, texto `brand-night`) solo para hitos críticos: cierres y despliegues a PROD.\n"},{"name":"Card","group":"Contenedores","height":330,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Button, Card, DescriptionList, IconButton } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 20, width: '100%', alignItems: 'start' }}>\n    <${Card} title=\"Datos del contrato\" subtitle=\"Vigente desde 01/03/2026\" actions=${html`<${IconButton} icon=\"edit\" label=\"Editar\" size=\"sm\" /><${IconButton} icon=\"more-horizontal\" label=\"Más acciones\" size=\"sm\" />`}\n      footer=${html`<${Button} size=\"sm\" variant=\"ghost\">Ver historial<//><${Button} size=\"sm\" variant=\"secondary\">Descargar PDF<//>`}>\n      <${DescriptionList} columns=${1} items=${[{ label: 'Modalidad', value: 'Por hora' }, { label: 'Tarifa', value: 'US$ 42,00' }]} />\n    <//>\n    <${Card} variant=\"brand\" padding=\"roomy\" title=\"Desarrollos con IA\" subtitle=\"Servicio destacado\">\n      <p className=\"fk-text\" style=${{ color: 'var(--cornflower-20)', marginBottom: 16 }}>Contanos tu desafío y armamos el equipo.</p>\n      <${Button} variant=\"brand\" iconRight=\"arrow-right\">Ver más<//>\n    <//>\n    <div style=${{ display: 'flex', flexDirection: 'column', gap: 12 }}>\n      <${Card} interactive selected title=\"Equipo Alfa\" subtitle=\"7 personas · 3 partners\" />\n      <${Card} interactive title=\"Equipo Beta\" subtitle=\"5 personas · 1 partner\" />\n      <${Card} variant=\"subtle\" title=\"Sin asignar\" subtitle=\"2 personas\" />\n    </div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Contenedor con encabezado, acciones y pie opcionales.\n\n## Cuándo usarlo\n- Agrupar información relacionada en una página: fichas, gráficos, formularios cortos.\n- `interactive` para tarjetas que navegan; `brand` para destacar un bloque (uno por pantalla); `subtle` dentro de otras superficies.\n\n## Qué provee el consumidor\n- `title` (en `heading-3`), `subtitle`, `actions` (icon buttons o un `DropdownMenu`), `footer`, `children`.\n- `variant` (`default` · `brand` · `subtle`), `padding` (`default` 20px · `roomy` 30/40px como el sitio · `none`), `interactive`, `selected`, `onClick`.\n\n## Reglas\n- Radio `radius-lg`, borde `border`, `shadow-sm` solo en claro.\n- No anides cards con borde; dentro de una card usá `subtle` o `Divider`.\n- Sin barras de color al costado.\n"},{"name":"Chart","group":"Filtros y datos","height":380,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Chart } = window.FlockUI;\nfunction Demo() {\n  const fmtM = (n) => '$ ' + (n / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M';\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 20, width: '100%' }}>\n    <div className=\"fk-card\" style=${{ padding: 20 }}>\n      <${Chart} type=\"bar\" title=\"Horas por partner\" subtitle=\"Últimos 3 meses\" categories=${['Andes Software', 'Nodo Labs', 'Pampa Dev', 'Río Sistemas', 'Sur Digital']}\n        series=${[{ name: 'Agosto', data: [1180, 900, 640, 400, 760] }, { name: 'Septiembre', data: [1210, 950, 590, 430, 800] }, { name: 'Octubre', data: [1248, 932, 610, 418, 820] }]} height=${220} />\n    </div>\n    <div className=\"fk-card\" style=${{ padding: 20 }}>\n      <${Chart} type=\"donut\" title=\"Monto por partner\" categories=${['Andes Software', 'Nodo Labs', 'Pampa Dev', 'Sur Digital', 'Otros']} series=${[{ name: 'Octubre', data: [15.6e6, 11.65e6, 7.6e6, 10.25e6, 5.2e6] }]} format=${fmtM} height=${220} />\n    </div>\n    <div className=\"fk-card\" style=${{ padding: 20, gridColumn: '1 / -1' }}>\n      <${Chart} type=\"line\" title=\"Facturación mensual\" categories=${['May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct']} format=${fmtM}\n        series=${[{ name: '2026', data: [38e6, 40.5e6, 41e6, 44.2e6, 46e6, 48.2e6] }, { name: '2025', data: [30e6, 31e6, 33.5e6, 34e6, 36.1e6, 37e6] }]} height=${200} />\n    </div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Gráficos de barras, líneas y dona con la paleta de marca, leyenda y tooltip al pasar el mouse.\n\n## Cuándo usarlo\n- `bar`: comparar magnitudes entre categorías (horas por partner). `line`: evolución en el tiempo. `donut`: partes de un total con 2–5 categorías.\n- Si el mensaje es un solo número, usá `StatCard`.\n\n## Qué provee el consumidor\n- `type`, `title`, `subtitle`, `categories` (eje X o porciones), `series` `{ name, data[] }`, `format(n)` para valores y ejes, `height`, `centerLabel` (dona), `showTable` (tabla accesible debajo).\n\n## Reglas\n- Colores en orden fijo `chart-1` → `chart-4`; a partir de la quinta serie, agrupá en \"Otros\" (`chart-other`). El color sigue a la entidad, no al ranking.\n- Un solo eje Y. Nunca dos escalas en el mismo gráfico.\n- Con 2 o más series siempre hay leyenda. Textos en tokens de texto, nunca del color de la serie.\n"},{"name":"Checkbox","group":"Formularios","height":230,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Checkbox, CheckboxGroup } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\" style=${{ gap: 24 }}>\n      <${Checkbox} label=\"Enviar copia al partner\" defaultChecked />\n      <${Checkbox} label=\"Selección parcial\" indeterminate checked />\n      <${Checkbox} label=\"Sin marcar\" />\n      <${Checkbox} label=\"Deshabilitado\" disabled />\n    </div>\n    <${CheckboxGroup} legend=\"Notificarme cuando\" defaultValue=${['aprob']} options=${[{ value: 'aprob', label: 'Se aprueba un período', description: 'Por mail y en la app' }, { value: 'rech', label: 'Se rechaza un período' }, { value: 'nuevo', label: 'Se suma un partner' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Casilla de verificación: una opción independiente, o varias con `CheckboxGroup`.\n\n## Cuándo usarlo\n- Opciones que se confirman al guardar y selección de filas. Para activar algo al instante usá `Switch`.\n\n## Qué provee el consumidor\n- `Checkbox`: `label`, `description`, `checked` / `defaultChecked` / `onChange(checked)`, `indeterminate`, `disabled`.\n- `CheckboxGroup`: `legend`, `options`, `value` / `defaultValue` (array) / `onChange`, `row`.\n\n## Reglas\n- El label describe el estado activo en positivo: \"Enviar copia al partner\".\n"},{"name":"ColumnFilter","group":"Filtros y datos","height":860,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Avatar, DataTable, StatusBadge } = window.FlockUI;\nconst ROWS = [\n  { id: 'FP-1042', partner: 'Andes Software', cuit: '30-71234567-8', periodo: 'Oct 2026', horas: 1248, monto: 15600000, estado: 'Aprobado', resp: 'Martín López' },\n  { id: 'FP-1043', partner: 'Nodo Labs', cuit: '30-70987654-3', periodo: 'Oct 2026', horas: 932, monto: 11650000, estado: 'En revisión', resp: 'Ana Torres' },\n  { id: 'FP-1044', partner: 'Pampa Dev', cuit: '30-71555222-1', periodo: 'Oct 2026', horas: 610, monto: 7625000, estado: 'Pendiente', resp: 'Julia Méndez' },\n  { id: 'FP-1045', partner: 'Río Sistemas', cuit: '30-70111999-4', periodo: 'Oct 2026', horas: 418, monto: 5225000, estado: 'Rechazado', resp: 'Diego Sosa' },\n  { id: 'FP-1046', partner: 'Sur Digital', cuit: '30-71888333-6', periodo: 'Oct 2026', horas: 820, monto: 10250000, estado: 'Aprobado', resp: 'Laura Ríos' },\n];\nconst TONE = { 'Aprobado': 'success', 'En revisión': 'info', 'Pendiente': 'warning', 'Rechazado': 'danger' };\nconst money = (n) => '$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2 });\nconst COLS = [\n  { key: 'partner', header: 'Partner', sortable: true, sub: 'cuit', minWidth: 160, filter: { type: 'text', placeholder: 'Partner o CUIT' } },\n  { key: 'id', header: 'Código', render: (r) => html`<span className=\"fk-mono\">${r.id}</span>` },\n  { key: 'horas', header: 'Horas', align: 'right', sortable: true, render: (r) => r.horas.toLocaleString('es-AR') },\n  { key: 'monto', header: 'Monto', align: 'right', sortable: true, render: (r) => money(r.monto) },\n  { key: 'estado', header: 'Estado', filter: { type: 'multi' }, render: (r) => html`<${StatusBadge} tone=${TONE[r.estado]}>${r.estado}<//>` },\n  { key: 'resp', header: 'Responsable', render: (r) => html`<span style=${{ display: 'inline-flex', gap: 8, alignItems: 'center' }}><${Avatar} name=${r.resp} size=\"xs\" />${r.resp}</span>` },\n];\nconst ACTIONS = (r) => [{ label: 'Ver detalle', icon: 'eye' }, { label: 'Editar', icon: 'edit' }, { label: 'Descargar Excel', icon: 'file-spreadsheet' }, { type: 'separator' }, { label: 'Anular', icon: 'trash', danger: true }];\n\nconst ROWS_X = [\n  { id: 'FP-1047', partner: 'Delta Cloud', cuit: '30-71222444-9', periodo: 'Oct 2026', horas: 270, monto: 3375000, estado: 'Pendiente', resp: 'Laura Ríos' },\n];\nROWS.push(...ROWS_X);\nconst FECHAS = { 'FP-1042': '02/10/2026', 'FP-1043': '04/10/2026', 'FP-1044': '06/10/2026', 'FP-1045': '09/10/2026', 'FP-1046': '13/10/2026', 'FP-1047': '15/10/2026' };\nROWS.forEach((r) => { r.fecha = FECHAS[r.id]; });\nconst COLS_F = [\n  { key: 'partner', header: 'Partner', sortable: true, sub: 'cuit', minWidth: 170, filter: { type: 'text', placeholder: 'Partner', value: (r) => r.partner + ' ' + r.cuit } },\n  { key: 'estado', header: 'Estado', filter: { type: 'multi' }, render: (r) => html`<${StatusBadge} tone=${TONE[r.estado]}>${r.estado}<//>` },\n  { key: 'resp', header: 'Responsable', filter: { type: 'select' } },\n  { key: 'fecha', header: 'Fecha', sortable: true, sortValue: (r) => r.fecha.split('/').reverse().join(''), filter: { type: 'date' } },\n  { key: 'monto', header: 'Monto', align: 'right', sortable: true, filter: { type: 'number', currency: true }, render: (r) => money(r.monto) },\n];\n\nfunction Demo() {\n  const menuCols = COLS_F.map((c) => (c.key === 'estado' ? { ...c, filter: { ...c.filter, defaultOpen: true } } : c));\n  return html`\n    <span className=\"fk-caption\">filterMode=\"menu\" · ícono en cada encabezado</span>\n    <${DataTable} columns=${menuCols} rows=${ROWS} defaultFilters=${{ estado: ['Pendiente', 'En revisión', 'Aprobado'], monto: { min: 6000000, max: null } }} rowActions=${ACTIONS} />\n    <div style=${{ height: 70 }} />\n    <span className=\"fk-caption\">filterMode=\"row\" · fila de filtros bajo los títulos</span>\n    <${DataTable} filterMode=\"row\" density=\"compact\" columns=${COLS_F} rows=${ROWS} defaultFilters=${{ partner: { op: 'contains', q: 'a' }, fecha: { from: new Date(2026, 9, 1), to: new Date(2026, 9, 10) } }} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Filtros de la tabla (data-table filters): cada columna filtra sus propios valores, desde un ícono en el encabezado o desde una fila de filtros debajo de los títulos.\n\n## Cuándo usarlo\n- `filterMode=\"menu\"` (por defecto): tablas de gestión donde se filtra de vez en cuando; el encabezado queda limpio y el ícono se marca cuando la columna tiene filtro.\n- `filterMode=\"row\"`: tablas de consulta intensiva (conciliaciones, auditorías) donde se filtra todo el tiempo, estilo planilla.\n- Para filtros que cruzan varias columnas o no son columnas visibles, usá `FilterBar` o `FilterGrid` arriba de la tabla. Se pueden combinar.\n\n## Qué provee el consumidor\n- En cada columna de `DataTable`: `filter: { type, options, placeholder, value(row), searchable, currency, decimals }`.\n  - `text`: condición (contiene, empieza con, es igual a, no contiene) + valor.\n  - `select`: un valor; `multi`: varios con \"Seleccionar todo\" y cantidades. Sin `options`, se arman solas con los valores de la columna.\n  - `number`: rango desde / hasta (formato AR); `date`: rango de fechas con calendario (acepta `Date` o \"dd/mm/aaaa\").\n- En `DataTable`: `filterMode`, `filters` / `defaultFilters` / `onFiltersChange`, `manualFilters` (no filtra en el cliente: usalo cuando filtra el servidor), `showFilterSummary`.\n- `ColumnFilter` también se puede usar suelto: `column`, `value`, `onChange`, `rows`, `variant` (`icon` | `field`).\n\n## Reglas\n- Los filtros activos se resumen arriba de la tabla como `FilterChip`, con \"Limpiar filtros\" y \"Mostrando X de Y\".\n- Sin resultados, la tabla lo dice y ofrece limpiar los filtros; nunca una tabla vacía muda.\n- Los paneles se aplican con \"Aplicar\"; en la fila de filtros, texto y selección filtran al instante.\n- Filtrá sobre el valor real, no el formateado: usá `filter.value(row)` cuando la celda muestra otra cosa.\n"},{"name":"Combobox","group":"Formularios","height":360,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Combobox, FormField } = window.FlockUI;\nconst PARTNERS = [{ value: 'ibis', label: 'Andes Software', description: 'CUIT 30-71234567-8' }, { value: 'clovinn', label: 'Nodo Labs', description: 'CUIT 30-70987654-3' }, { value: 'itr', label: 'Pampa Dev' }, { value: 'w3', label: 'Río Sistemas' }, { value: 'bright', label: 'Sur Digital' }, { value: 'flock', label: 'Flock IT' }];\n\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Partner\"><${Combobox} options=${PARTNERS} defaultOpen defaultQuery=\"cl\" placeholder=\"Buscá un partner\" /><//>\n    <${FormField} label=\"Responsable\"><${Combobox} icon=\"user\" options=${['Ana Torres', 'Martín López', 'Julia Méndez', 'Diego Sosa']} defaultValue=\"Martín López\" /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Selector con búsqueda para listas largas (partners, clientes, personas).\n\n## Cuándo usarlo\n- Más de ~10 opciones, o cuando la persona sabe qué busca. Resalta la coincidencia y acepta teclado.\n\n## Qué provee el consumidor\n- `options` (como `Select`), `value` / `defaultValue` / `onChange`, `placeholder`, `icon`, `emptyText`, `size`, `invalid`, `disabled`.\n\n## Reglas\n- Si no hay resultados, decilo: \"Sin resultados para 'xyz'\". Para varias opciones usá `MultiSelect`.\n"},{"name":"CommandPalette","group":"Layout y navegación","height":520,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, CommandPalette } = window.FlockUI;\nfunction Demo() {\n  const groups = [\n    { label: 'Ir a', items: [{ label: 'Facturación', icon: 'receipt', hint: 'Gestión' }, { label: 'Partners', icon: 'building', hint: 'Gestión' }, { label: 'Tableros', icon: 'bar-chart', hint: 'Reportes' }] },\n    { label: 'Registros', items: [{ label: 'Andes Software · Octubre 2026', icon: 'file' }, { label: 'Contrato CTR-2026-014', icon: 'file' }] },\n    { label: 'Acciones', items: [{ label: 'Nuevo período de facturación', icon: 'plus', shortcut: 'Ctrl+N' }, { label: 'Generar mails de partners', icon: 'mail' }, { label: 'Cambiar a tema oscuro', icon: 'moon' }] },\n  ];\n  return html`<div style=${{ height: 520 }}><${CommandPalette} inline groups=${groups} onClose=${() => {}} /></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Búsqueda global y acciones rápidas con teclado (Ctrl+K).\n\n## Cuándo usarlo\n- Apps con muchas pantallas o registros. Se abre desde el buscador del `Header` o con Ctrl+K.\n\n## Qué provee el consumidor\n- `groups`: `{ label, items: [{ label, icon, hint, shortcut }] }` (por ejemplo \"Ir a…\", \"Registros\", \"Acciones\").\n- `open`, `onClose`, `onSelect(item)`, `placeholder`.\n\n## Reglas\n- Resultados agrupados; máximo ~8 por grupo.\n- Navegable con ↑ ↓ Enter Esc; mostralo en el pie.\n"},{"name":"Comments","group":"Personas y colaboración","height":420,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Comments } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-card\" style=${{ padding: 20, width: '100%', maxWidth: 640 }}>\n    <${Comments} currentUser=${{ name: 'Ana Torres' }} comments=${[\n      { author: 'Martín López', time: '05/10/2026 10:12', text: 'Las horas de septiembre no coinciden con el reporte. @Ana.Torres ¿lo revisás con el partner?' },\n      { author: 'Ana Torres', time: '05/10/2026 11:40', text: 'Sí, ya les escribí. Eran 12 h de una guardia que cargaron en octubre.', reply: true },\n      { author: 'Diego Sosa', time: '05/10/2026 12:02', text: 'Perfecto, lo dejo aprobado con la observación.' },\n    ]} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Hilo de comentarios sobre un registro, con menciones, respuestas y compositor.\n\n## Cuándo usarlo\n- Pestaña o panel de discusión en detalles (períodos, contratos, tickets).\n\n## Qué provee el consumidor\n- `comments` `{ author, time, text (las @menciones se resaltan), reply }`, `currentUser` `{ name }` (muestra el compositor), `onSubmit(text)`, `placeholder`.\n\n## Reglas\n- Orden cronológico, el más viejo arriba. Respuestas indentadas un nivel.\n"},{"name":"ConfirmDialog","group":"Contenedores","height":380,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, ConfirmDialog } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ height: 380 }}><${ConfirmDialog} open inline title=\"¿Eliminar el período de octubre?\" confirmLabel=\"Eliminar período\" confirmText=\"ELIMINAR\" onClose=${() => {}}\n    message=\"Se borran las 4.028 horas cargadas y los 5 borradores de mail. Esta acción no se puede deshacer.\" /></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Confirmación explícita antes de una acción destructiva o irreversible.\n\n## Cuándo usarlo\n- Eliminar, anular, dar de baja, enviar a muchos destinatarios. `confirmText` para lo irreversible y masivo.\n\n## Qué provee el consumidor\n- `open`, `onClose`, `onConfirm`, `tone` (`danger` · `warning` · `info`), `title` (pregunta concreta), `message` (consecuencias), `confirmLabel` (verbo exacto), `cancelLabel`, `confirmText` (texto a tipear), `loading`.\n\n## Mobile\n- Hoja inferior, igual que `Modal`.\n\n## Reglas\n- El título nombra el objeto: \"¿Eliminar el período de octubre?\". El botón repite el verbo: \"Eliminar período\", nunca \"Aceptar\".\n- Decí qué se pierde y si se puede deshacer.\n"},{"name":"CopyButton","group":"Utilitarios","height":110,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, CopyButton } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ gap: 20 }}>\n    <${CopyButton} value=\"30-71234567-8\" showValue />\n    <${CopyButton} value=\"FP-1043\" showValue />\n    <span className=\"fk-row\" style=${{ gap: 4 }}><span className=\"fk-text\">https://gestion.flockit.com.ar/p/1043</span><${CopyButton} value=\"https://gestion.flockit.com.ar/p/1043\" label=\"Copiar link\" /></span>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Copiar al portapapeles un ID, CUIT o link, con confirmación.\n\n## Cuándo usarlo\n- Datos que la gente copia para pegar en otro sistema: códigos, CUIT, CBU de prueba, URLs.\n\n## Qué provee el consumidor\n- `value`, `label` (por defecto \"Copiar\"), `showValue` (muestra el valor en mono junto al botón), `copiedLabel`.\n\n## Reglas\n- Confirmá con el ícono de check y el tooltip \"Copiado\" durante ~1,5 s.\n"},{"name":"Cover","group":null,"height":300,"head":"\n\n<style>\n  html, body { margin: 0; background: var(--bg); }\n  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); font-family: var(--font-sans); }\n  .cover svg { position: absolute; left: 0; top: 0; }\n  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }\n  .name { margin: 0; font-family: var(--font-display); font-size: 88px; line-height: 0.92; font-weight: 600; letter-spacing: -1.5px; color: var(--ink); }\n  .tag { margin: 14px 0 0; font-size: 14px; line-height: 20px; letter-spacing: 0.3px; color: var(--ink-muted); }\n  .g1a    { stop-color: var(--christalle-100); }\n  .g1b    { stop-color: var(--lavender-100); }\n  .grad   { fill: url(#g1); }\n  .night  { fill: var(--brand-night); }\n  .heart  { fill: var(--purple-heart-100); }\n  .corn   { fill: var(--cornflower-100); }\n  .white  { fill: var(--on-brand); }\n  .tile   { rx: var(--radius-lg); ry: var(--radius-lg); }\n</style>\n","body":"\n<div class=\"cover\">\n  <svg width=\"960\" height=\"300\" viewBox=\"0 0 960 300\" aria-hidden=\"true\">\n    \u003c!--\n      blocks: gradient-1 slab 400x252 (christalle-100 → lavender-100, stops 20% / 55% as the brand sheet), purple-heart-100 184x168 (bleeds bottom), cornflower-100 88x112, brand-night pill 220x60 (bleeds right); tile corners = radius-lg (20px)\n      arrangement: one tall gradient slab bleeding right with two satellites stacked at its left edge, the two blues of the palette beside the Christalle → Lavender sweep\n      pattern: pills (radius-pill shape, rx = half of 20px height) in staggered rows flowing up-right, \"flock\" = bandada; the pill is the shape of every button in the brand sheet\n      steps & radii: pill height 20 = space-20, row pitch 30 = space-30, gaps 10 = space-10, insets 20/40 = space-20/space-40; radius-lg 20px, pills rx 10/30\n    -->\n    <defs>\n      <linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n        <stop class=\"g1a\" offset=\"0.2\"/>\n        <stop class=\"g1b\" offset=\"0.55\"/>\n      </linearGradient>\n    </defs>\n    <rect class=\"grad tile\" x=\"600\" y=\"24\" width=\"400\" height=\"252\"/>\n    <rect class=\"corn tile\" x=\"496\" y=\"24\" width=\"88\" height=\"112\"/>\n    <rect class=\"heart tile\" x=\"496\" y=\"152\" width=\"184\" height=\"168\"/>\n    <rect class=\"night\" x=\"780\" y=\"44\" width=\"220\" height=\"60\" rx=\"30\" ry=\"30\"/>\n\n    <rect class=\"white\" x=\"710\" y=\"224\" width=\"100\" height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"night\" x=\"820\" y=\"224\" width=\"40\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"690\" y=\"194\" width=\"40\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"740\" y=\"194\" width=\"80\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"night\" x=\"830\" y=\"194\" width=\"60\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"900\" y=\"194\" width=\"100\" height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"720\" y=\"164\" width=\"100\" height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"830\" y=\"164\" width=\"40\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"night\" x=\"880\" y=\"164\" width=\"60\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"770\" y=\"134\" width=\"40\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"820\" y=\"134\" width=\"80\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"640\" y=\"44\"  width=\"100\" height=\"20\" rx=\"10\" ry=\"10\"/>\n    <rect class=\"white\" x=\"640\" y=\"74\"  width=\"60\"  height=\"20\" rx=\"10\" ry=\"10\"/>\n  </svg>\n  <div class=\"text\">\n    <h1 class=\"name\">Flock IT</h1>\n    <p class=\"tag\">Sistema de diseño para los productos internos de Flock</p>\n  </div>\n</div>\n","readme":""},{"name":"DataTable","group":"Filtros y datos","height":520,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Avatar, Button, DataTable, Pagination, StatusBadge, TableToolbar } = window.FlockUI;\nconst ROWS = [\n  { id: 'FP-1042', partner: 'Andes Software', cuit: '30-71234567-8', periodo: 'Oct 2026', horas: 1248, monto: 15600000, estado: 'Aprobado', resp: 'Martín López' },\n  { id: 'FP-1043', partner: 'Nodo Labs', cuit: '30-70987654-3', periodo: 'Oct 2026', horas: 932, monto: 11650000, estado: 'En revisión', resp: 'Ana Torres' },\n  { id: 'FP-1044', partner: 'Pampa Dev', cuit: '30-71555222-1', periodo: 'Oct 2026', horas: 610, monto: 7625000, estado: 'Pendiente', resp: 'Julia Méndez' },\n  { id: 'FP-1045', partner: 'Río Sistemas', cuit: '30-70111999-4', periodo: 'Oct 2026', horas: 418, monto: 5225000, estado: 'Rechazado', resp: 'Diego Sosa' },\n  { id: 'FP-1046', partner: 'Sur Digital', cuit: '30-71888333-6', periodo: 'Oct 2026', horas: 820, monto: 10250000, estado: 'Aprobado', resp: 'Laura Ríos' },\n];\nconst TONE = { 'Aprobado': 'success', 'En revisión': 'info', 'Pendiente': 'warning', 'Rechazado': 'danger' };\nconst money = (n) => '$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2 });\nconst COLS = [\n  { key: 'partner', header: 'Partner', sortable: true, sub: 'cuit', minWidth: 160, filter: { type: 'text', placeholder: 'Partner o CUIT' } },\n  { key: 'id', header: 'Código', render: (r) => html`<span className=\"fk-mono\">${r.id}</span>` },\n  { key: 'horas', header: 'Horas', align: 'right', sortable: true, render: (r) => r.horas.toLocaleString('es-AR') },\n  { key: 'monto', header: 'Monto', align: 'right', sortable: true, render: (r) => money(r.monto) },\n  { key: 'estado', header: 'Estado', filter: { type: 'multi' }, render: (r) => html`<${StatusBadge} tone=${TONE[r.estado]}>${r.estado}<//>` },\n  { key: 'resp', header: 'Responsable', render: (r) => html`<span style=${{ display: 'inline-flex', gap: 8, alignItems: 'center' }}><${Avatar} name=${r.resp} size=\"xs\" />${r.resp}</span>` },\n];\nconst ACTIONS = (r) => [{ label: 'Ver detalle', icon: 'eye' }, { label: 'Editar', icon: 'edit' }, { label: 'Descargar Excel', icon: 'file-spreadsheet' }, { type: 'separator' }, { label: 'Anular', icon: 'trash', danger: true }];\n\nfunction Demo() {\n  const [sel, setSel] = React.useState(['FP-1043']);\n  return html`<${DataTable} columns=${COLS} rows=${ROWS} selectable selected=${sel} onSelectionChange=${setSel} rowActions=${ACTIONS} defaultSort=${{ key: 'monto', dir: 'desc' }}\n    toolbar=${html`<${TableToolbar} title=\"Períodos de facturación\" count=${248} search selectedCount=${sel.length > 1 ? sel.length : 0} onClearSelection=${() => setSel([])}\n      bulkActions=${html`<${Button} size=\"sm\" variant=\"secondary\" icon=\"check\">Aprobar<//><${Button} size=\"sm\" variant=\"secondary\" icon=\"download\">Exportar<//>`}\n      actions=${html`<${Button} size=\"sm\" variant=\"secondary\" icon=\"download\">Exportar<//>`} />`}\n    footer=${html`<${Pagination} total=${248} compact />`} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"La grilla de datos: orden y filtros por columna, selección de filas, acciones por fila, densidad, encabezado fijo y estados de carga y vacío.\n\n## Cuándo usarlo\n- Listados de registros con varias columnas comparables. Para 1–2 datos por ítem, `List`; para tarjetas visuales, `Card` en `Grid`.\n\n## Qué provee el consumidor\n- `columns`: `{ key, header, align ('right' para números), sortable, sortValue, render(row), sub (clave de texto secundario), width, minWidth, sticky }`.\n- `rows`, `rowKey` (por defecto `id`).\n- `selectable` + `selected` / `defaultSelected` / `onSelectionChange`.\n- `sort` / `defaultSort` / `onSortChange` (sin `onSortChange` ordena en el cliente).\n- Filtros de columna: `filter` en cada columna (`{ type: 'text' | 'select' | 'multi' | 'number' | 'date' }`), `filterMode` (`menu` en el encabezado · `row` fila de filtros), `filters` / `defaultFilters` / `onFiltersChange`, `manualFilters` (filtrado en el servidor). Ver `ColumnFilter`.\n- `rowActions(row)` → items de `DropdownMenu`; `onRowClick`; `density` (`normal` 52px · `compact` 38px); `striped`.\n- Mobile (< 768 px): `mobileLayout` (`cards` por defecto: una tarjeta por registro · `scroll`: tabla con scroll horizontal) y `mobile` en cada columna (`title`, `subtitle`, `badge`, `amount`, `meta`, `hidden`).\n- `loading`, `empty` (un `EmptyState`), `toolbar` (`TableToolbar`), `footer` (`Pagination`), `maxHeight`, `caption`.\n\n## Reglas\n- Números y montos alineados a la derecha con formato AR; estados con `StatusBadge`; códigos en `fk-mono`.\n- Una sola columna con texto secundario. La primera columna identifica el registro.\n- Acciones por fila en el menú ⋯ (máximo una acción visible).\n"},{"name":"DatePicker","group":"Formularios","height":440,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, DatePicker, FormField } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Fecha de alta\"><${DatePicker} defaultValue=${new Date(2026, 9, 5)} /><//>\n    <${FormField} label=\"Período\"><${DatePicker} range defaultOpen defaultValue=${{ from: new Date(2026, 9, 1), to: new Date(2026, 9, 15) }} /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Fecha o rango de fechas en formato dd/mm/aaaa, con calendario y atajos.\n\n## Cuándo usarlo\n- Fechas de alta, vencimientos y períodos. `range` para filtros por período.\n\n## Qué provee el consumidor\n- `value` / `defaultValue` / `onChange` — un `Date`, o `{ from, to }` con `range`.\n- `range`, `presets` (Últimos 7 días, Este mes, Mes anterior), `minDate`, `maxDate`, `placeholder`, `size`, `invalid`, `disabled`.\n\n## Reglas\n- Semana de lunes a domingo; meses en español. El día de hoy lleva un anillo `primary`.\n"},{"name":"DescriptionList","group":"Filtros y datos","height":280,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, CopyButton, DescriptionList, StatusBadge } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-card\" style=${{ padding: 20 }}>\n      <${DescriptionList} columns=${3} items=${[\n        { label: 'Razón social', value: 'Andes Software S.A.' },\n        { label: 'CUIT', value: html`<span className=\"fk-mono\">30-71234567-8</span>`, copy: html`<${CopyButton} value=\"30-71234567-8\" />` },\n        { label: 'Estado', value: html`<${StatusBadge} tone=\"success\">Activo<//>` },\n        { label: 'Alta', value: '15/03/2024' },\n        { label: 'Tarifa vigente', value: 'US$ 42,00 / hora' },\n        { label: 'Observaciones', value: '' },\n      ]} />\n    </div>\n    <div className=\"fk-card\" style=${{ padding: '4px 20px' }}>\n      <${DescriptionList} variant=\"rows\" items=${[{ label: 'Mail de facturación', value: 'facturacion@andessoftware.com' }, { label: 'Responsable en Flock', value: 'Martín López' }, { label: 'Equipo', value: 'Equipo Alfa' }]} />\n    </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Detalle clave–valor de un registro.\n\n## Cuándo usarlo\n- Fichas de detalle (partner, contrato, período), dentro de una `Card` o un `Drawer`.\n\n## Qué provee el consumidor\n- `items` `{ label, value, span, copy }` (`copy`: un `CopyButton`), `columns` (por defecto 2), `variant` (`grid` | `rows`).\n\n## Reglas\n- Valor vacío se muestra como \"—\". Fechas dd/mm/aaaa; montos con $ y formato AR.\n"},{"name":"Divider","group":"Contenedores","height":150,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Divider } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${Divider} />\n    <${Divider} label=\"o ingresá con tu mail\" />\n    <div className=\"fk-row\" style=${{ height: 32 }}><span className=\"fk-text\">Octubre</span><${Divider} vertical /><span className=\"fk-text\">5 partners</span><${Divider} vertical /><span className=\"fk-text\">$ 48,2 M</span></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Línea que separa bloques; puede llevar un texto centrado.\n\n## Cuándo usarlo\n- Entre grupos dentro de una card o formulario. Entre secciones de página alcanza con espacio (`space-40`).\n\n## Qué provee el consumidor\n- `label`, `vertical`, `strong` (`border-strong`).\n\n## Reglas\n- Usalo con moderación: el espacio separa mejor que las líneas.\n"},{"name":"Drawer","group":"Contenedores","height":560,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, Alert, Button, DescriptionList, Drawer, FormField, StatusBadge, Textarea } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ height: 560, background: 'var(--bg)' }}><${Drawer} open inline title=\"Andes Software\" description=\"Período octubre 2026\" onClose=${() => {}}\n    headerExtra=${html`<div style=${{ marginTop: 6 }}><${StatusBadge} tone=\"info\">En revisión<//></div>`}\n    footer=${html`<${Button} variant=\"secondary\">Rechazar<//><${Button} icon=\"check\">Aprobar período<//>`}>\n    <div style=${{ display: 'flex', flexDirection: 'column', gap: 20 }}>\n      <${DescriptionList} items=${[{ label: 'Horas', value: '1.248' }, { label: 'Monto', value: '$ 15.600.000,00' }, { label: 'Responsable', value: 'Martín López' }, { label: 'Vence', value: '15/10/2026' }]} />\n      <${Alert} tone=\"warning\" title=\"Diferencia de 12 h\">El reporte del partner no coincide con lo cargado.<//>\n      <${FormField} label=\"Comentario para el partner\" optional><${Textarea} rows=${3} /><//>\n    </div>\n  <//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Panel lateral para ver o editar un registro sin salir de la lista.\n\n## Cuándo usarlo\n- Detalle rápido desde una fila de `DataTable`, ediciones medianas, filtros avanzados (`FilterPanel`).\n\n## Qué provee el consumidor\n- `open`, `onClose`, `title`, `description`, `headerExtra` (badges), `children`, `footer`, `side` (`right` | `left`), `size` (`md` 440 · `lg` 640).\n\n## Mobile\n- Ocupa la pantalla completa.\n\n## Reglas\n- Desde la derecha por defecto. Un drawer no abre otro drawer: navegá a la página de detalle.\n"},{"name":"DropdownMenu","group":"Acciones","height":360,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Button, DropdownMenu, IconButton } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'flex', gap: 220, width: '100%' }}>\n    <${DropdownMenu} defaultOpen trigger=${html`<${Button} variant=\"secondary\" iconRight=\"chevron-down\">Acciones<//>`}\n      items=${[{ type: 'label', label: 'Período' }, { label: 'Editar', icon: 'edit', shortcut: 'E' }, { label: 'Duplicar', icon: 'copy' }, { label: 'Exportar a Excel', icon: 'file-spreadsheet' }, { label: 'Enviar por mail', icon: 'send', disabled: true }, { type: 'separator' }, { label: 'Eliminar período', icon: 'trash', danger: true }]} />\n    <${DropdownMenu} trigger=${html`<${IconButton} icon=\"more-horizontal\" label=\"Más acciones\" variant=\"secondary\" />`} items=${[{ label: 'Ver detalle', icon: 'eye' }, { label: 'Dar de baja', icon: 'trash', danger: true }]} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Menú desplegable de acciones: el \"⋯\" de filas, cards y encabezados.\n\n## Cuándo usarlo\n- Para agrupar acciones secundarias o poco frecuentes. Para elegir un valor de formulario usá `Select`.\n\n## Qué provee el consumidor\n- `trigger`: cualquier `Button` o `IconButton`.\n- `items`: `{ label, icon, onSelect, danger, disabled, shortcut, checked }`, `{ type: 'separator' }` o `{ type: 'label', label }`.\n- `placement` (`start` | `end`), `open` / `defaultOpen` / `onOpenChange`, `closeOnSelect`.\n\n## Reglas\n- Acciones destructivas al final, separadas y en `danger`.\n- Máximo ~8 ítems; si son más, agrupá con `label`.\n- Se cierra con Esc o clic afuera.\n"},{"name":"EmptyState","group":"Feedback y estado","height":300,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Button, EmptyState } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, width: '100%' }}>\n    <div className=\"fk-card\"><${EmptyState} icon=\"receipt\" title=\"Todavía no hay períodos\" actions=${html`<${Button} icon=\"plus\">Crear el primer período<//>`}>Creá un período para empezar a cargar las horas de los partners.<//></div>\n    <div className=\"fk-card\"><${EmptyState} icon=\"search\" title=\"Sin resultados\" actions=${html`<${Button} variant=\"secondary\">Limpiar filtros<//>`}>No hay partners que coincidan con “Estado: Rechazado” y “Período: octubre”.<//></div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Pantalla o bloque sin datos: todavía no hay nada, o los filtros no devuelven resultados.\n\n## Cuándo usarlo\n- Tablas y listas vacías, primera vez en un módulo, búsquedas sin resultados.\n\n## Qué provee el consumidor\n- `icon`, `title`, `children` (explicación), `actions` (la acción que resuelve), `compact`.\n\n## Reglas\n- Explicá por qué está vacío y qué hacer. Sin resultados por filtros: ofrecé \"Limpiar filtros\".\n"},{"name":"EnvBadge","group":"Feedback y estado","height":150,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, EnvBadge } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\"><${EnvBadge} env=\"dev\" /><${EnvBadge} env=\"test\" /><${EnvBadge} env=\"uat\" /><${EnvBadge} env=\"prod\" /></div>\n    <div style=${{ background: 'var(--surface-brand)', borderRadius: 12, overflow: 'hidden' }}><${EnvBadge} env=\"test\" strip /><div className=\"fk-row\" style=${{ padding: 14 }}><span style=${{ color: 'var(--on-brand)' }}>Header con franja de ambiente</span><${EnvBadge} env=\"test\" /></div></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Indica en qué ambiente estás: DEV, TEST, UAT o PROD.\n\n## Cuándo usarlo\n- Siempre visible en el `Header` de ambientes no productivos. `strip` agrega una franja de 4px arriba de todo.\n\n## Qué provee el consumidor\n- `env` (`dev` · `test` · `uat` · `prod`), `strip`.\n\n## Reglas\n- Colores fijos de marca: DEV Cornflower, TEST Lavender, UAT Purple Heart, PROD blanco con borde Christalle. No los uses para otra cosa.\n"},{"name":"ErrorPage","group":"Feedback y estado","height":420,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, ErrorPage } = window.FlockUI;\nconst LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN4AAAA5CAYAAABZJpWNAAAACXBIWXMAABCcAAAQnAEmzTo0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAlISURBVHgB7Z3vdRM5EMAnPL6fqeCWCggVsFRAqACngjMVxKmAUEH2KkiuAi8VBCrYpYJABXMaa4yNWa9Gf6119HtPL2CvJa1WI400o1mATEDEmUpXKnUqPaIfnUq3KlUQGVVGzfW+43I3aaXS3CKfSqUb198X3KF25vamdn9Q6Z8UfefocKfrMDxdrAbE7SBh4kqQF93/o+vvC+6gHqCT9p1swDhCt2EFAVH5nTvU9wL87r+GQnBQD57J+k5WUKfE+NQQAJXPB3RTg1ee93+6HeCIoGwAPYcIPIPjU0N8avAE9azVqDQDe84dv7O5pmCBep70HCvBpVHa/jn8XpkaxjspVfYvGOenSl/Pzs4aOBFQ6/q3cDxchL0wzlHbdC143LHuIKB0o94UeK8E8Kvh0h7y5xP4Pah7KBR2eMZCR2uI0FNqRfmieWeoUekHZAprARfgDt3bNRQKO9AabwkyXdcFmiVGVTQ1I1LH/Aj54rOdT/dGs34PhcIOpGq+gbiQgXnGAjYIrQfVNb36541KryATeLauLX7yBbTq/IP/NmP3XXi6kOBVEB+a+UY7oOqgrfpzzrtN5yP5zFV6B2mohdf1Kl3yPRQKRkjwSCCy2TXjGaIdueReCecC9IZHbKRru+sidAUbaI33L0wM1clJJU2xYfG34Jr+lEwnhTSQ4FEnnuI6JEW9K8E1LRQKljzjHbfXMA172i9YJTXZCH2RqODfoVCwZG1AZ+F7ifoYCm1sDHU4+ox2HCvIh9LpC5PkN5cxyVqFhdPXk6NQeNJYO0mzcL6FQqHgjNPpBPa/LG5QhYIjPseCWjghcOBEufCnVwfOcT1gpqEbUIfZWKA+fU313D9j2KEOhXCDhkO8iepbc11W+OcZusedutaQCajPWa64fpTuMMSJdtThCqRUEAGVbyMsf2nI5xbjcWsoeynJBMK0F3XgFdpDHecWE4ZCwG0MHtuDxx0KBjyU919jXgN5X43ktwAfMA/BE3VaHBm1UQe6ic3C9x7Ar51cBW6IW4wsgKhn4xABr6qRMqIIHprDSdB9uW9MYh6CJ6lDZ8jjAeMzFvohmuChnjU+YXg6jKBGo36eKwzHylCWhDkIQbPQbVjkEPrBGbY/mo4UXRq+TxFWoYbEoB7sHlTyU22GqVS6xYAR0HB7LrSGcNBMX0MCuC2WwstfTVrwCPbbJOHq97 \n\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', height: 420 }}>\n    <${ErrorPage} code=${404} />\n    <${ErrorPage} code=${500} brand logoSrc=${LOGO} requestId=\"7f3a-22c1-9b0e\" />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Pantallas de error: 404, 403 (sin permisos), 500 y mantenimiento (503).\n\n## Cuándo usarlo\n- Rutas inexistentes, accesos denegados, fallas del servidor y ventanas de mantenimiento. `brand` para pantallas fuera del `AppShell`.\n\n## Qué provee el consumidor\n- `code` (404 · 403 · 500 · 503), `title` y `children` para reemplazar los textos por defecto, `actions`, `requestId` (para soporte), `brand`, `logoSrc`.\n\n## Reglas\n- Nunca culpes a la persona. Siempre una salida: \"Ir al inicio\".\n"},{"name":"FileUpload","group":"Formularios","height":380,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FileUpload } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ width: '100%', maxWidth: 560 }}>\n    <${FileUpload} accept=\".xlsx,.pdf\" defaultFiles=${[{ name: 'Horas por partner - Octubre.xlsx', size: 248000, progress: 100 }, { name: 'Factura Andes Software 0001-00012345.pdf', size: 1320000, progress: 64 }, { name: 'horas_nodo_labs.csv', size: 12000, progress: 0, error: 'El archivo supera las 5.000 filas' }]} />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Zona para arrastrar o elegir archivos, con la lista de adjuntos y su estado.\n\n## Cuándo usarlo\n- Adjuntar Excel de horas, facturas en PDF, documentación de partners.\n\n## Qué provee el consumidor\n- `files` / `defaultFiles` (`{ name, size, progress, error }`), `onFiles(FileList)`, `onRemove(file)`, `accept`, `multiple`, `hint` (formatos y tamaño máximo).\n\n## Reglas\n- Decí qué formatos y tamaño se aceptan. Un error se explica en la fila del archivo, con acción de reintentar.\n"},{"name":"FilterBar","group":"Filtros y datos","height":200,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Button, FilterBar } = window.FlockUI;\nconst FILTERS = [\n  { key: 'estado', label: 'Estado', options: [{ value: 'pend', label: 'Pendiente', count: 12 }, { value: 'rev', label: 'En revisión', count: 4 }, { value: 'ok', label: 'Aprobado', count: 230 }, { value: 'rech', label: 'Rechazado', count: 2 }] },\n  { key: 'partner', label: 'Partner', options: ['Andes Software', 'Nodo Labs', 'Pampa Dev', 'Río Sistemas', 'Sur Digital'] },\n  { key: 'equipo', label: 'Equipo', options: ['Equipo Alfa', 'Equipo Beta'] },\n];\n\nfunction Demo() {\n  return html`<${FilterBar} filters=${FILTERS} searchPlaceholder=\"Buscar por partner o CUIT\" defaultValue=${{ estado: ['pend', 'rev'], partner: ['Nodo Labs'] }}\n    onMoreFilters=${() => {}} moreCount=${2} actions=${html`<${Button} size=\"sm\" variant=\"secondary\" icon=\"download\">Exportar<//>`} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Barra de filtros rápidos sobre una lista: buscador, pills de filtro, chips activos y \"Limpiar filtros\".\n\n## Cuándo usarlo\n- Arriba de toda `DataTable` o `List` filtrable, con 1 a 5 dimensiones frecuentes. Para muchos criterios sumá `FilterPanel` (botón \"Más filtros\") o usá `FilterGrid`.\n\n## Qué provee el consumidor\n- `filters`: array de props de `FilterDropdown` con `key` (`{ key, label, options, multiple, searchable }`).\n- `value` / `defaultValue` / `onChange` — objeto `{ [key]: valores[] }`.\n- `search`, `searchPlaceholder`, `searchValue`, `onSearchChange`.\n- `onMoreFilters` y `moreCount` para abrir el panel avanzado; `actions` a la derecha (Exportar, vistas).\n\n## Mobile\n- Buscador a ancho completo y chips activos con scroll horizontal.\n\n## Reglas\n- Los filtros activos se muestran siempre como `FilterChip`, con \"Limpiar filtros\" al final.\n- Filtrar no cambia de página: resetea la paginación a 1.\n"},{"name":"FilterChip","group":"Filtros y datos","height":110,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FilterChip } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ gap: 6 }}>\n    <${FilterChip} label=\"Estado\" value=\"Pendiente\" onRemove=${() => {}} />\n    <${FilterChip} label=\"Partner\" value=\"Nodo Labs\" onRemove=${() => {}} />\n    <${FilterChip} label=\"Período\" value=\"01/10/2026 – 31/10/2026\" onRemove=${() => {}} />\n    <${FilterChip} value=\"Solo mis registros\" />\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Un filtro activo, removible.\n\n## Cuándo usarlo\n- Para mostrar qué filtros están aplicados (lo hace `FilterBar` automáticamente) o en búsquedas avanzadas.\n\n## Qué provee el consumidor\n- `label` (la dimensión), `value` (el valor legible), `onRemove`.\n\n## Reglas\n- Formato \"Dimensión: valor\". Un chip por valor.\n"},{"name":"FilterDropdown","group":"Filtros y datos","height":400,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FilterDropdown } = window.FlockUI;\nconst FILTERS = [\n  { key: 'estado', label: 'Estado', options: [{ value: 'pend', label: 'Pendiente', count: 12 }, { value: 'rev', label: 'En revisión', count: 4 }, { value: 'ok', label: 'Aprobado', count: 230 }, { value: 'rech', label: 'Rechazado', count: 2 }] },\n  { key: 'partner', label: 'Partner', options: ['Andes Software', 'Nodo Labs', 'Pampa Dev', 'Río Sistemas', 'Sur Digital'] },\n  { key: 'equipo', label: 'Equipo', options: ['Equipo Alfa', 'Equipo Beta'] },\n];\n\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ alignItems: 'flex-start' }}>\n    <${FilterDropdown} ...${FILTERS[0]} defaultValue=${['pend']} defaultOpen />\n    <div style=${{ marginLeft: 200 }} className=\"fk-row\">\n      <${FilterDropdown} ...${FILTERS[1]} defaultValue=${['Andes Software', 'Nodo Labs']} />\n      <${FilterDropdown} ...${FILTERS[2]} multiple=${false} />\n    </div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Pill de filtro que abre una lista con checkboxes (o una sola opción) para filtrar por una dimensión.\n\n## Cuándo usarlo\n- Dentro de `FilterBar`, o suelto sobre una tabla. Cada pill es una dimensión: Estado, Partner, Equipo.\n\n## Qué provee el consumidor\n- `label`, `options` (strings o `{ value, label, count }`), `value` / `defaultValue` (array) / `onChange`.\n- `multiple` (por defecto `true`; `false` usa radios), `searchable` (automático con más de 7 opciones), `placement`.\n\n## Reglas\n- Se aplica con \"Aplicar\"; \"Limpiar\" quita el filtro. La pill activa muestra el primer valor y \"+N\".\n- Mostrá cantidades (`count`) cuando ayuden a decidir.\n"},{"name":"FilterGrid","group":"Filtros y datos","height":330,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Combobox, DatePicker, FilterGrid, FormField, MultiSelect, NumberInput, Select, TextInput } = window.FlockUI;\nfunction Demo() {\n  return html`<${FilterGrid} activeCount=${3} defaultExpanded more=${html`\n      <${FormField} label=\"Responsable\"><${Combobox} options=${['Martín López', 'Ana Torres', 'Julia Méndez']} placeholder=\"Buscá una persona\" /><//>\n      <${FormField} label=\"Monto desde\"><${NumberInput} currency /><//>\n      <${FormField} label=\"Monto hasta\"><${NumberInput} currency /><//>\n      <${FormField} label=\"Solo con diferencias\"><${Select} options=${['Sí', 'No']} placeholder=\"Todos\" /><//>`}>\n    <${FormField} label=\"Partner\"><${MultiSelect} options=${['Andes Software', 'Nodo Labs', 'Pampa Dev', 'Río Sistemas', 'Sur Digital']} defaultValue=${['Andes Software']} /><//>\n    <${FormField} label=\"Estado\"><${Select} options=${['Pendiente', 'En revisión', 'Aprobado', 'Rechazado']} defaultValue=\"Pendiente\" /><//>\n    <${FormField} label=\"Período\"><${DatePicker} range defaultValue=${{ from: new Date(2026, 9, 1), to: new Date(2026, 9, 31) }} /><//>\n    <${FormField} label=\"Código\"><${TextInput} placeholder=\"FP-0000\" /><//>\n  <//>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Formulario de filtros en grilla sobre un listado, con \"Buscar\" y \"Limpiar\" — el clásico panel de búsqueda de los sistemas de gestión.\n\n## Cuándo usarlo\n- Búsquedas con muchos criterios donde la persona arma la consulta y luego busca (por ejemplo, consultas sobre bases grandes). Para filtros instantáneos y pocos criterios, `FilterBar`.\n\n## Qué provee el consumidor\n- `children`: `FormField` con sus controles (los visibles siempre).\n- `more`: campos adicionales que se muestran con \"Más filtros\".\n- `columns` (por defecto 4; 2 bajo 900px), `onSearch`, `onClear`, `activeCount`, `title`, `variant` (`default` | `subtle`), `searchLabel`.\n\n## Mobile\n- Dos columnas en contenedores angostos y una en teléfonos; botones del pie a ancho completo.\n\n## Reglas\n- Primera fila con los 4 criterios más usados. Enter en cualquier campo dispara la búsqueda.\n- Debajo va la `DataTable` con los resultados y su total.\n"},{"name":"FilterPanel","group":"Filtros y datos","height":560,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, CheckboxGroup, DatePicker, FilterPanel, FormField, MultiSelect, Slider, Switch } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ height: 560, background: 'var(--bg)' }}>\n    <${FilterPanel} inline activeCount=${3} onClose=${() => {}}>\n      <${FormField} label=\"Período\"><${DatePicker} range defaultValue=${{ from: new Date(2026, 8, 1), to: new Date(2026, 9, 31) }} /><//>\n      <${FormField} label=\"Partners\"><${MultiSelect} options=${['Andes Software', 'Nodo Labs', 'Pampa Dev', 'Río Sistemas', 'Sur Digital']} defaultValue=${['Andes Software', 'Pampa Dev']} /><//>\n      <${CheckboxGroup} legend=\"Estado\" defaultValue=${['pend']} options=${['Pendiente', 'En revisión', 'Aprobado', 'Rechazado'].map((x) => ({ value: x === 'Pendiente' ? 'pend' : x, label: x }))} />\n      <${Slider} label=\"Avance de horas\" defaultValue=${[40, 100]} format=${(n) => n + '%'} />\n      <${Switch} label=\"Solo períodos con diferencias\" />\n    <//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Panel lateral con todos los criterios de filtro (filtros avanzados).\n\n## Cuándo usarlo\n- Desde el botón \"Más filtros\" de `FilterBar`, cuando hay más criterios de los que entran en pills.\n\n## Qué provee el consumidor\n- `open`, `onClose`, `children` (`FormField`, `CheckboxGroup`, `Slider`…), `onApply`, `onClear`, `activeCount`, `title`.\n\n## Reglas\n- Los cambios se aplican con \"Aplicar filtros\"; cerrar descarta. \"Limpiar todo\" a la izquierda.\n"},{"name":"FormField","group":"Formularios","height":250,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, FormField, TextInput } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 20, width: '100%' }}>\n    <${FormField} label=\"Razón social\" required hint=\"Como figura en AFIP\"><${TextInput} placeholder=\"Andes Software S.A.\" /><//>\n    <${FormField} label=\"CUIT\" required error=\"Ingresá un CUIT de 11 dígitos\"><${TextInput} defaultValue=\"30-7123\" /><//>\n    <${FormField} label=\"Observaciones\" optional><${TextInput} placeholder=\"Notas internas\" /><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Contenedor de un campo: label, marca de obligatorio u opcional, ayuda y error.\n\n## Cuándo usarlo\n- Alrededor de todo control de formulario (`TextInput`, `Select`, `DatePicker`…). Le pasa `id`, `invalid` y `aria-describedby` al control.\n\n## Qué provee el consumidor\n- `label`, `required` u `optional`, `hint`, `error` (reemplaza al hint y pone el control en rojo), `inline`, `children` (un control).\n\n## Reglas\n- Label corto, sin dos puntos: \"Razón social\".\n- Marcá lo que sea minoría: si casi todo es obligatorio, marcá los opcionales.\n- El error dice cómo corregir: \"Ingresá un CUIT de 11 dígitos\".\n"},{"name":"FormLayout","group":"Formularios","height":560,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Button, DatePicker, FormActions, FormField, FormLayout, FormSection, NumberInput, Select, TextInput } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-card\" style=${{ width: '100%', overflow: 'hidden' }}>\n    <div style=${{ padding: 30 }}>\n      <${FormLayout}>\n        <${FormSection} title=\"Datos del partner\" description=\"Como figuran en la factura.\">\n          <${FormField} label=\"Razón social\" required><${TextInput} defaultValue=\"Andes Software S.A.\" /><//>\n          <${FormField} label=\"CUIT\" required><${TextInput} defaultValue=\"30-71234567-8\" /><//>\n          <${FormField} label=\"Mail de facturación\" className=\"fk-span-2\"><${TextInput} icon=\"mail\" defaultValue=\"facturacion@andessoftware.com\" /><//>\n        <//>\n        <${FormSection} title=\"Condiciones\" description=\"Se aplican desde el próximo período.\" columns=${3}>\n          <${FormField} label=\"Modalidad\"><${Select} options=${['Por hora', 'Precio fijo']} defaultValue=\"Por hora\" /><//>\n          <${FormField} label=\"Tarifa\"><${NumberInput} prefix=\"US$\" defaultValue=${42} /><//>\n          <${FormField} label=\"Vigencia\"><${DatePicker} defaultValue=${new Date(2026, 10, 1)} /><//>\n        <//>\n      <//>\n    </div>\n    <${FormActions} note=\"Los cambios quedan registrados en el historial\"><${Button} variant=\"secondary\">Cancelar<//><${Button} icon=\"save\">Guardar cambios<//><//>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Estructura de formularios largos: secciones con título a la izquierda, campos en grilla y barra de acciones.\n\n## Cuándo usarlo\n- Altas y ediciones con más de 6 campos. Para 1–5 campos, un `Modal` o `Drawer` alcanza.\n\n## Qué provee el consumidor\n- `FormLayout`: `onSubmit`, `children` (secciones).\n- `FormSection`: `title`, `description`, `columns` (1–3), `stacked` (título arriba), `children` (`FormField`). Usá `className=\"fk-span-2\"` o `fk-span-all` para campos anchos.\n- `FormActions`: `children` (botones), `note`, `sticky` (fija al pie al hacer scroll).\n\n## Mobile\n- Secciones y campos a una columna; `FormActions` con botones a ancho completo.\n\n## Reglas\n- Botones a la derecha: secundario (Cancelar) y primario (Guardar).\n- Agrupá por tema, no por tipo de control.\n"},{"name":"Grid","group":"Layout y navegación","height":300,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Col, Grid, Stack } = window.FlockUI;\nfunction Demo() {\n  const cell = (t) => html`<div className=\"fk-grid-demo\">${t}</div>`;\n  return html`\n    <${Grid}>${Array.from({ length: 12 }, (_, i) => html`<${Col} key=${i}>${cell(i + 1)}<//>`)}<//>\n    <${Grid}><${Col} span=${8}>${cell('span 8 · detalle')}<//><${Col} span=${4}>${cell('span 4 · panel')}<//><//>\n    <${Grid}><${Col} span=${3}>${cell('3')}<//><${Col} span=${3}>${cell('3')}<//><${Col} span=${3}>${cell('3')}<//><${Col} span=${3}>${cell('3')}<//><//>\n    <${Stack} direction=\"row\" gap=\"space-10\">${cell('Stack')}${cell('row')}${cell('gap space-10')}<//>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Grilla de 12 columnas (`Grid` + `Col`) y pila (`Stack`) para maquetar páginas con los espaciados del sistema.\n\n## Cuándo usarlo\n- Para distribuir cards, KPIs y formularios en columnas. `Stack` para apilar con un gap de token.\n\n## Qué provee el consumidor\n- `Grid`: `cols` (por defecto 12), `gap` (nombre de token: `space-10`, `space-20`… o px), `responsive` (a 1 columna bajo 720px).\n- `Col`: `span` (1–12).\n- `Stack`: `direction` (`column` | `row`), `gap`, `align`, `justify`.\n\n## Reglas\n- Gutter por defecto `space-20`. Entre secciones de página, `space-40`.\n- Layouts habituales: 8 + 4 (detalle + panel lateral), 3 × 4 (KPIs), 6 + 6 (formularios).\n"},{"name":"Header","group":"Layout y navegación","height":200,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Header } = window.FlockUI;\nconst NAV = [\n  { label: 'Inicio', icon: 'home' },\n  { type: 'section', label: 'Gestión' },\n  { label: 'Facturación', icon: 'receipt', active: true, count: 12 },\n  { label: 'Partners', icon: 'building', count: 5 },\n  { label: 'Contratos', icon: 'file' },\n  { label: 'Equipos', icon: 'users', children: [{ label: 'Equipo Alfa' }, { label: 'Equipo Beta' }] },\n  { type: 'section', label: 'Reportes' },\n  { label: 'Tableros', icon: 'bar-chart' },\n  { label: 'Exportaciones', icon: 'download' },\n];\nconst LOGO = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAN4AAAA5CAYAAABZJpWNAAAACXBIWXMAABCcAAAQnAEmzTo0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAlISURBVHgB7Z3vdRM5EMAnPL6fqeCWCggVsFRAqACngjMVxKmAUEH2KkiuAi8VBCrYpYJABXMaa4yNWa9Gf6119HtPL2CvJa1WI400o1mATEDEmUpXKnUqPaIfnUq3KlUQGVVGzfW+43I3aaXS3CKfSqUb198X3KF25vamdn9Q6Z8UfefocKfrMDxdrAbE7SBh4kqQF93/o+vvC+6gHqCT9p1swDhCt2EFAVH5nTvU9wL87r+GQnBQD57J+k5WUKfE+NQQAJXPB3RTg1ee93+6HeCIoGwAPYcIPIPjU0N8avAE9azVqDQDe84dv7O5pmCBep70HCvBpVHa/jn8XpkaxjspVfYvGOenSl/Pzs4aOBFQ6/q3cDxchL0wzlHbdC143LHuIKB0o94UeK8E8Kvh0h7y5xP4Pah7KBR2eMZCR2uI0FNqRfmieWeoUekHZAprARfgDt3bNRQKO9AabwkyXdcFmiVGVTQ1I1LH/Aj54rOdT/dGs34PhcIOpGq+gbiQgXnGAjYIrQfVNb36541KryATeLa . Dentro de `AppShell` muestra el botón de menú y un botón \"Buscar\" (`onSearchClick`, por ejemplo para abrir `CommandPalette`).\n\n## Reglas\n- Alto fijo 64px. Un solo buscador por pantalla: si el header tiene búsqueda global, la tabla usa su propia búsqueda local.\n- No cambies el fondo: es la firma de marca de la app.\n"},{"name":"Icon","group":"Utilitarios","height":560,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Icon } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-icongrid\">${Icon.names.map((n) => html`<div key=${n} className=\"fk-icongrid__cell\"><${Icon} name=${n} size=${22} /><span className=\"fk-icongrid__name\">${n}</span></div>`)}</div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Set de íconos de línea (Lucide, licencia ISC) con trazo de 1.75px y puntas redondeadas.\n\n## Cuándo usarlo\n- En botones, navegación, estados y campos. Todo componente que acepta `icon` recibe uno de estos nombres.\n\n## Qué provee el consumidor\n- `name` (ver la grilla), `size` (16 en controles chicos, 18–20 por defecto), `strokeWidth`, `label` (solo si el ícono transmite información por sí solo; si no, es decorativo).\n\n## Reglas\n- Color heredado (`currentColor`): `ink-muted` por defecto, `primary-text` activo, color de estado solo junto a texto.\n- No mezclar con otros sets ni con emojis. Para sumar un ícono, agregalo desde Lucide al bundle.\n"},{"name":"IconButton","group":"Acciones","height":150,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, IconButton } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <div className=\"fk-row\">\n      <${IconButton} icon=\"edit\" label=\"Editar\" />\n      <${IconButton} icon=\"copy\" label=\"Duplicar\" variant=\"secondary\" />\n      <${IconButton} icon=\"plus\" label=\"Agregar\" variant=\"primary\" />\n      <${IconButton} icon=\"trash\" label=\"Eliminar\" variant=\"danger\" />\n      <${IconButton} icon=\"more-horizontal\" label=\"Más acciones\" size=\"sm\" />\n      <${IconButton} icon=\"star\" label=\"Favorito\" pressed=${true} />\n    </div>\n    <div className=\"fk-row\" style=${{ background: 'var(--surface-brand)', padding: 12, borderRadius: 20 }}>\n      <${IconButton} icon=\"chevron-up\" label=\"Subir\" variant=\"brand\" size=\"sm\" />\n      <${IconButton} icon=\"chevron-down\" label=\"Bajar\" variant=\"brand\" size=\"sm\" />\n      <${IconButton} icon=\"chevron-left\" label=\"Anterior\" variant=\"inverse\" />\n      <${IconButton} icon=\"chevron-right\" label=\"Siguiente\" variant=\"inverse\" />\n      <${IconButton} icon=\"arrow-up\" label=\"Volver arriba\" variant=\"inverse\" />\n      <${IconButton} icon=\"bell\" label=\"Notificaciones\" variant=\"inverse\" badge=${4} />\n    </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Acción compacta solo con ícono, para toolbars, tablas y headers.\n\n## Cuándo usarlo\n- Acciones obvias por su ícono (editar, cerrar, más opciones). Si el ícono no es obvio, usá `Button` con texto.\n- Sobre superficies de marca, como la lámina de botones: `brand` es el círculo con borde blanco que se rellena de blanco en hover (subir/bajar, expandir); `inverse` es el ícono suelto que se atenúa en hover (flechas anterior/siguiente, volver arriba, íconos del header).\n\n## Qué provee el consumidor\n- `icon`, `label` (obligatorio: se usa como `aria-label` y tooltip), `variant` (`ghost` · `secondary` · `primary` · `danger` · `inverse` · `brand`), `size`.\n- `badge`: número o `true` (punto) para notificaciones; `pressed` para toggles.\n\n## Reglas\n- Área mínima 32px (tablas) o 40px (resto).\n- No pongas más de 3 icon buttons seguidos; agrupá el resto en un `DropdownMenu`.\n"},{"name":"KanbanBoard","group":"Filtros y datos","height":420,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, KanbanBoard } = window.FlockUI;\nfunction Demo() {\n  return html`<${KanbanBoard} columns=${[\n    { id: 'todo', title: 'Por hacer', color: 'var(--border-strong)', cards: [{ id: 1, code: 'GES-212', title: 'Ajustar validación de CUIT en alta de partner', tags: ['Backend'], assignee: 'Julia Méndez', due: '10/10' }, { id: 2, code: 'GES-215', title: 'Exportar historial a Excel', tags: ['Frontend'], assignee: 'Martín López' }] },\n    { id: 'doing', title: 'En curso', color: 'var(--info)', cards: [{ id: 3, code: 'GES-198', title: 'Pantalla de detalle de período', tags: ['Frontend', 'UX'], assignee: 'Ana Torres', due: '07/10', comments: 4 }] },\n    { id: 'review', title: 'En revisión', color: 'var(--warning)', cards: [{ id: 4, code: 'GES-190', title: 'Cálculo de diferencias de horas', tags: ['Backend'], assignee: 'Diego Sosa', comments: 2 }] },\n    { id: 'done', title: 'Listo', color: 'var(--success)', cards: [{ id: 5, code: 'GES-181', title: 'Generación de mails a partners', tags: ['Backend'], assignee: 'Laura Ríos' }] },\n  ]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Tablero de columnas por estado; las tarjetas se arrastran entre columnas.\n\n## Cuándo usarlo\n- Seguimiento de tareas, hallazgos o tickets por estado. Para listados largos, `DataTable` con filtro de estado.\n\n## Qué provee el consumidor\n- `columns` `{ id, title, color (var de token), cards: [{ id, code, title, tags, assignee, due, comments }] }`, `onMove(cardId, columnId)`.\n\n## Mobile\n- Las columnas se deslizan de a una.\n\n## Reglas\n- 3 a 6 columnas. El punto de color de la columna se acompaña del nombre del estado.\n"},{"name":"Kbd","group":"Utilitarios","height":110,"head":"","body":"\n<div id=\"root\" class=\"fk-preview \"></div>\n<script>\nconst { html, Kbd } = window.FlockUI;\nfunction Demo() {\n  return html`<div className=\"fk-row\" style=${{ gap: 24 }}>\n    <span className=\"fk-text\">Buscar <${Kbd} keys=\"Ctrl+K\" /></span>\n    <span className=\"fk-text\">Guardar <${Kbd} keys=\"Ctrl+S\" /></span>\n    <span className=\"fk-text\">Nuevo <${Kbd} keys=${['Ctrl', 'Mayús', 'N']} /></span>\n    <span className=\"fk-text\">Cerrar <${Kbd}>Esc<//></span>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Tecla o atajo de teclado.\n\n## Cuándo usarlo\n- En menús, ayudas y `CommandPalette` para enseñar atajos.\n\n## Qué provee el consumidor\n- `keys` (\"Ctrl+K\" o un array) o `children` para una sola tecla.\n\n## Reglas\n- Nombres en español donde aplique (\"Mayús\", \"Supr\"); \"Ctrl\" en Windows, \"⌘\" solo si el producto es exclusivo de Mac.\n"},{"name":"Link","group":"Acciones","height":110,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Link } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <p className=\"fk-text\">El período de octubre tiene 3 partners con diferencias. <${Link} href=\"#\">Ver detalle<//> o revisá el <${Link} href=\"#\" external>manual de facturación<//>.</p>\n    <div className=\"fk-row\"><${Link} href=\"#\" variant=\"quiet\">Andes Software S.A.<//><${Link} href=\"#\" variant=\"muted\">Ver todos los partners<//></div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Enlace de navegación dentro de texto, celdas y ayudas.\n\n## Cuándo usarlo\n- Para ir a otra pantalla o recurso. Si dispara una acción (guardar, borrar), es un `Button`.\n\n## Qué provee el consumidor\n- `href`, `children`, `variant` (`default` en `primary-text` · `quiet` en `ink` · `muted`), `external` (abre en pestaña nueva con ícono).\n\n## Reglas\n- Siempre subrayado salvo `muted` en navegación secundaria.\n- Texto que describe el destino: \"Ver contrato\", nunca \"click acá\".\n"},{"name":"List","group":"Filtros y datos","height":300,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, List, StatusBadge } = window.FlockUI;\nfunction Demo() {\n  return html`<div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>\n    <div className=\"fk-card\" style=${{ padding: '4px 16px' }}>\n      <${List} items=${[\n        { icon: 'file-spreadsheet', title: 'Horas por partner - Octubre.xlsx', meta: 'Subido por Martín López · 03/10/2026', trailing: '242 KB' },\n        { icon: 'file', title: 'Contrato marco Andes Software 2026.pdf', meta: 'Firmado · 15/03/2026', trailing: '1,3 MB' },\n        { icon: 'mail', title: 'Mails de partners generados', meta: '5 borradores · hace 2 horas', trailing: html`<${StatusBadge} tone=\"info\" size=\"sm\">Listo<//>` },\n      ]} />\n    </div>\n    <div className=\"fk-card\" style=${{ padding: 8 }}>\n      <${List} interactive items=${[\n        { avatar: 'Martín López', title: 'Martín López', meta: 'Analista funcional · Equipo Alfa' },\n        { avatar: 'Julia Méndez', title: 'Julia Méndez', meta: 'Despliegues a TEST' },\n        { avatar: 'Diego Sosa', title: 'Diego Sosa', meta: 'Revisión de hallazgos' },\n      ]} />\n    </div>\n  </div>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Lista simple de ítems con ícono o avatar, título, metadato y contenido a la derecha.\n\n## Cuándo usarlo\n- Contenido con uno o dos datos por ítem: documentos, actividad reciente, personas. Si hay que comparar columnas, `DataTable`.\n\n## Qué provee el consumidor\n- `items` `{ title, meta, icon | avatar, trailing, onClick }`, `interactive` (hover y chevron).\n\n## Reglas\n- Título en una línea con elipsis; metadato en `ink-subtle`.\n"},{"name":"Login","group":"Plantillas","height":640,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<script>\nconst { html, Button, Checkbox, Divider, FormField, Link, TextInput } = window.FlockUI;\nconst LOGO = 'd
