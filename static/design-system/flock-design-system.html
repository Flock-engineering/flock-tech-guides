<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:var(--text-body);letter-spacing:.3px;-webkit-font-smoothing:antialiased}
a{color:var(--primary-text)}
#app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh}
#side{background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:16px 12px 40px;position:sticky;top:0;height:100vh}
#side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
#side .brand img{height:26px}
#side .brand b{font:var(--text-heading-4);font-family:var(--font-heading)}
#side h6{margin:18px 8px 6px;font:600 11px/14px var(--font-heading);text-transform:uppercase;letter-spacing:1px;color:var(--ink-subtle)}
#side a{display:block;padding:6px 10px;border-radius:var(--radius-md);color:var(--ink-muted);text-decoration:none;font-size:14px;line-height:20px}
#side a:hover{background:var(--surface-subtle);color:var(--ink)}
#side a.on{background:var(--primary-subtle);color:var(--primary-text);font-weight:600}
#side details{margin:2px 0}
#side summary{cursor:pointer;list-style:none;padding:6px 10px;border-radius:var(--radius-md);color:var(--ink);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#side summary::-webkit-details-marker{display:none}
#side summary:hover{background:var(--surface-subtle)}
#side summary span{font-weight:400;font-size:12px;color:var(--ink-subtle)}
#side details a{margin-left:10px}
#main{overflow:auto;height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 32px;background:var(--bg);border-bottom:1px solid var(--border)}
.top .crumb{color:var(--ink-muted);font-size:13px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-pill);padding:6px 14px;font-size:13px}
.btn:hover{background:var(--surface-subtle)}
#menu{display:none}
.page{max-width:1080px;margin:0 auto;padding:32px}
.page>h1.pt{font:var(--text-display-md);font-size:36px;line-height:44px;letter-spacing:-.4px;margin:0 0 8px;font-family:var(--font-display);font-weight:600}
.lede{color:var(--ink-muted);margin:0 0 24px}
.md{max-width:860px}
.md h1{font:600 32px/40px var(--font-display);letter-spacing:-.4px;margin:0 0 16px}
.md h2{font:600 24px/30px var(--font-heading);margin:36px 0 12px;padding-top:8px}
.md h3{font:600 18px/24px var(--font-heading);margin:28px 0 8px}
.md h4{font:600 16px/22px var(--font-heading);margin:20px 0 6px}
.md p,.md li{line-height:1.6;font-size:15px}
.md table{border-collapse:collapse;width:100%;display:block;overflow:auto;margin:12px 0;font-size:13.5px}
.md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface-subtle)}
.md code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-subtle);padding:1px 5px;border-radius:5px}
.md pre{background:var(--surface-subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:12px 0;padding:4px 16px;border-left:3px solid var(--primary);color:var(--ink-muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:28px 0}
.md img{max-width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin:16px 0 28px}
.card .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink-subtle)}
.card iframe{display:block;width:100%;border:0;background:var(--bg)}
.card .ph{display:flex;align-items:center;justify-content:center;color:var(--ink-subtle);font-size:13px}
.cgrp{margin:36px 0 12px;font:600 22px/28px var(--font-heading)}
.cname{font:600 18px/24px var(--font-heading);margin:28px 0 0}
.cname a{color:var(--ink);text-decoration:none}
.sec{font:600 22px/28px var(--font-heading);margin:40px 0 12px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sw .c{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
.sw .c i{display:block;height:56px;border-bottom:1px solid var(--border)}
.sw .c div{padding:8px 10px;font-size:12px;line-height:16px;color:var(--ink-muted)}
.sw .c b{display:block;color:var(--ink);font:600 13px/18px var(--font-mono)}
.sw .c small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-subtle)}
.sw .c em{display:block;font-style:normal;margin-top:4px;color:var(--ink-subtle)}
.scale{display:flex;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);margin:6px 0 14px}
.scale i{flex:1;height:54px;position:relative}
.scale i span{position:absolute;bottom:2px;left:4px;font:10px var(--font-mono)}
.lbl{font:600 13px/18px var(--font-mono);margin:10px 0 2px}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--border);align-items:baseline}
.trow code{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
.trow small{display:block;color:var(--ink-subtle);font-size:12px;margin-top:2px}
.bars div{display:flex;align-items:center;gap:12px;margin:6px 0;font:12px var(--font-mono)}
.bars i{display:block;height:16px;background:var(--primary);border-radius:3px}
.boxes{display:flex;gap:20px;flex-wrap:wrap}
.boxes div{width:110px;height:80px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:flex-end;padding:8px;font:11px var(--font-mono);color:var(--ink-muted)}
.tbl{border-collapse:collapse;font-size:13px;width:100%}
.tbl td,.tbl th{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl td:first-child{font-family:var(--font-mono);white-space:nowrap}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.logos figure{margin:0;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface)}
.logos .pic{display:flex;align-items:center;justify-content:center;height:150px;background:#fff;padding:20px}
.logos .pic.dark{background:var(--brand-night)}
.logos img{max-width:100%;max-height:80px}
.logos figcaption{padding:8px 12px;font-size:12px;color:var(--ink-muted);border-top:1px solid var(--border)}
.note{font-size:12px;color:var(--ink-subtle);margin-top:32px}
@media (max-width:820px){
  #app{display:block}
  #side{position:fixed;z-index:50;width:280px;transform:translateX(-100%);transition:transform .2s}
  #app.open #side{transform:none;box-shadow:var(--shadow-overlay)}
  #menu{display:inline-block}
  .top,.page{padding-left:16px;padding-right:16px}
  .trow{grid-template-columns:1fr}
}
</style>
</head>

r, Popover)."},{"name":"z-floating","value":"70","usage":"BulkActionBar flotante."},{"name":"z-overlay","value":"80","usage":"Fondo y panel de Modal, ConfirmDialog, Drawer y CommandPalette. Uno solo a la vez."},{"name":"z-popup","value":"85","usage":"Popups fijos (fixed) que se abren dentro de tablas u overlays: filtros de columna y acciones de fila."},{"name":"z-tooltip","value":"90","usage":"Tooltip."},{"name":"z-toast","value":"95","usage":"ToastStack: siempre arriba de todo."}]},"breakpoint":{"note":"Ancho de la ventana. Mobile es todo lo que está por debajo de bp-md.","tokens":[{"name":"bp-sm","value":"480px","usage":"Teléfonos grandes; debajo, los botones del pie pasan a ancho completo."},{"name":"bp-md","value":"768px","usage":"Corte mobile: por debajo se oculta el Sidebar (pasa a cajón), los formularios van a 1 columna, DataTable pasa a tarjetas, Modal a hoja inferior y Drawer a pantalla completa."},{"name":"bp-lg","value":"1024px","usage":"Tablet horizontal y notebooks chicas. Por debajo de ~880 px los diseños de dos columnas (detalle 8 + 4) pasan a una."},{"name":"bp-xl","value":"1280px","usage":"Escritorio: diseño completo con Sidebar expandido."}]},"size":{"note":"Medidas fijas de controles y estructura.","tokens":[{"name":"size-touch","value":"44px","usage":"Área táctil mínima en pantallas táctiles (botones, ítems de menú y de lista)."},{"name":"size-control","value":"40px","usage":"Alto de Button, IconButton e inputs medianos."},{"name":"size-control-sm","value":"32px","usage":"Alto de controles chicos (tablas, toolbars, filtros)."},{"name":"size-header","value":"64px","usage":"Alto del Header."},{"name":"size-sidebar","value":"248px","usage":"Ancho del Sidebar expandido."},{"name":"size-sidebar-collapsed","value":"68px","usage":"Ancho del Sidebar colapsado."}]}},"docs":[{"id":"readme","title":"Brand book","md":"Sistema de diseño para los productos internos de Flock IT (back-offices, herramientas de gestión, tableros). Toma la identidad de marca de Flock —la paleta Christalle, Purple Heart, Cornflower y Lavender sobre grises neutros, la familia Zalando Sans y las formas pill— y la lleva a interfaces densas de trabajo diario. Todo lo marcado como *propuesta* en los tokens no está en las láminas de marca y está abierto a revisión.\n\n## Principios\n\n- **Marca en los bordes, claridad en el centro.** El violeta y el Lavender identifican (header, foco, acción principal); el contenido de trabajo vive sobre `surface` neutra, en grises.\n- **Denso pero respirado.** Texto por defecto en `body` (14/20); espaciado en el ritmo de 10px del sitio (`space-10`, `space-20`, `space-30`).\n- **Pill = acción.** Todo lo que se aprieta o se filtra es pill (`radius-pill`); lo que contiene es `radius-lg`; lo que se completa es `radius-md`.\n- **El estado nunca depende solo del color.** Siempre ícono + palabra.\n\n## Voz y contenido\n\n- Español rioplatense con voseo, como el sitio: \"Contanos tu desafío\", \"Conocenos\". En la app: \"Revisá los datos\", \"Elegí un período\". Mantener el voseo también en imperativos con tilde (\"Agendá\", \"Exportá\"); el sitio a veces lo pierde (\"Agenda una consultoría estratégica\").\n- Mayúscula solo al inicio (sentence case) en títulos, botones y menús: \"Exportar a Excel\", no \"Exportar A Excel\". Siglas en mayúsculas: TEST, CUIT, PDF.\n- Botones con verbo + objeto: \"Guardar cambios\", \"Generar mails\", \"Descartar borrador\". Nunca \"OK\" ni \"Aceptar\" solos en acciones destructivas: \"Eliminar partner\".\n- Tono directo y breve; sin signos de exclamación en la UI, sin emojis.\n- Formato argentino: `1.234,56`, `$ 1.234,56`, fechas `dd/mm/aaaa`, hora 24 h `14:32`. IDs y códigos en `code`.\n- Mensajes de error: qué pasó + cómo seguir. \"No pudimos guardar el contrato. Revisá tu conexión y probá de nuevo.\"\n\n## Color\n\n- La paleta de marca son cinco escalas de 10 pasos, del color pleno (100) al tinte más claro (10): `black-*`, `christalle-*`, `purple-heart-*`, `cornflower-*` y `lavender-*`, más `brand-night` (#180026), el fondo de la lámina de botones y la tinta de los logos. Las pantallas no las usan directo: usan los tokens semánticos de abajo, que apuntan a ellas.\n- Fondo de página `bg`; contenedores `surface`; encabezados de tabla y zonas de filtro `surface-subtle`; menús y modales `surface-raised` con `shadow-overlay`.\n- Texto `ink`; secundario `ink-muted`; placeholder y metadatos `ink-subtle`. Nunca texto de color de marca sobre claro salvo `primary-text`.\n- Neutros de la escala Black: en claro `ink` = `black-90`, `ink-muted` = `black-70`, `ink-subtle` = `black-60`, `border` = `black-10`, `border-strong` = `black-50`. El violeta queda para marca, acción y selección.\n- Acción principal: relleno `primary` (Purple Heart en claro, Cornflower en oscuro) + texto `on-primary`; hover `primary-hover`. Una sola acción primaria por vista.\n- `accent` (Lavender) es señal, no texto: anillo de foco (`focus`), indicador de novedad, contadores, estrella de vista predeterminada, ícono activo sobre superficies de marca. Si un relleno es Lavender, el texto es `on-accent`. La marca no tiene naranja: no lo uses.\n- Selección (fila, ítem de nav, chip activo): `primary-subtle` con texto `ink` o `primary-text`.\n- Estados: `success`, `warning`, `danger`, `info` para texto/ícono/borde; sus `-subtle` para fondos de alertas y badges. `danger` es carmín e `info` es azul, para no confundirse con el Lavender ni con el violeta de `primary`. Los cuatro son propuesta: la paleta de marca no trae colores de estado.\n- **Tema claro** es el de trabajo diario. **Tema oscuro** se apoya en `brand-night`: `surface` = blanco 10%, `border` = blanco 20% (el mismo relleno del botón de marca), `surface-brand` y `primary-subtle` = Christalle.\n\n### Degradés de marca\n\nDos degradés, solo en superficies de marca (login, portadas, encabezados de reportes); nunca en UI densa ni detrás de texto chico:\n\n| Degradé | Paradas (izq. a der.) | Token |\n| --- | --- | --- |\n| Gradiente 1 | `christalle-100` sólido hasta el 20% → `lavender-100` desde el 55% | `gradient-1` |\n| Gradiente 2 | `purple-heart-100` sólido hasta el 43% → `lavender-100` desde el 80% | `gradient-2` |\n\nBrillos radiales: `purple-heart-100` → transparente al 59%; `lavender-100` → transparente al 69%. Usar uno por pantalla como máximo.\n\n## Tipografía\n\n- Tres anchos de **Zalando Sans** (Google Fonts; `components/bundle.css` los carga):\n  - `sans` — **Zalando Sans**: todo el texto corrido (`body-lg`, `body`, `body-sm`, `caption`), inputs, celdas y labels.\n  - `heading` — **Zalando Sans SemiExpanded**: títulos (`heading-1` a `heading-4`) y los elementos de interfaz del grupo Interfaz: botones (`button`, `button-sm`); tabs, SegmentedControl, SavedViews, FilterDropdown y Stepper (`ui-tab`); ítems del Sidebar y producto del Header (`ui-nav`); StatusBadge, Tag, EnvBadge y contadores (`ui-badge`).\n  - `display` — **Zalando Sans Expanded**: textos display (`display-xl`, `display-lg`, `display-md`): claim del login, código de ErrorPage, portadas.\n- Pesos de la marca: Regular 400, Semibold 600 y Bold 700. Títulos y display en Semibold; botones, tabs, navegación y badges en Regular; Bold solo para énfasis dentro del texto. Sin Light.\n- Los anchos no llevan tracking positivo: títulos e interfaz en 0, display apenas negativo.\n- UI: `body` por defecto; `body-sm` para labels de campo (en `ink-muted`), ayudas y metadatos; `caption` (12px) es el mínimo.\n- Títulos de página `heading-1`; secciones, modales y drawers `heading-2`; cards `heading-3`.\n- Números en tablas alineados a la derecha con `tabular-nums`: en Zalando Sans activa cifras tabulares con cero cruzado, buenas para montos e IDs. No lo uses en números grandes (StatCard, ErrorPage), que van con las cifras normales. IDs y códigos en `code`.\n\n## Espaciado y layout\n\n- Escala en el ritmo de 10px del sitio: `space-5`, `space-10`, `space-15`, `space-20`, `space-30`, `space-40`, `space-60`.\n- Padding de card `space-20` (compacta) o `space-30` `space-40` (como el sitio). Gap entre campos `space-15`; entre secciones `space-40`.\n- App shell: sidebar `size-sidebar` (248px; `size-sidebar-collapsed` 68px), header `size-header` (64px; 56px en mobile), contenido con margen `space-30` (`space-15` en mobile). Grilla de 12 columnas con gutter `space-20`.\n\n## Formas, bordes y elevación\n\n- `radius-pill`: botones, chips, tags, filtros, switches, búsqueda.\n- `radius-md`: inputs, selects, dropdowns, menús, alertas.\n- `radius-lg`: cards, modales, drawers, paneles.\n- `radius-sm`: checkbox, badges dentro de tablas, tooltips.\n- Bordes `border-1` en `border` para dividir; controles con `border-strong`.\n- Sobre superficies de marca, los botones siguen la lámina de botones: `Button` `brand` (pill blanco 20%, sin borde) e `IconButton` `brand` (círculo con borde blanco de 1,5px).\n- Elevación mínima: `shadow-sm` solo para cards en claro; `shadow-overlay` para todo lo que flota.\n\n## Estados de interacción\n\n- Hover: un paso más profundo (`primary-hover`) o fondo `surface-subtle` en elementos neutros.\n- Hover sobre superficies de marca, como la lámina de botones: el botón de marca pasa a blanco con texto `brand-night`, el botón de ícono de marca se rellena de blanco y los íconos sueltos (`IconButton` `inverse`) se atenúan.\n- Foco: anillo `border-2` en `focus` (Lavender) con 2px de separación, siempre visible con teclado.\n- Seleccionado: `primary-subtle`. Deshabilitado: opacidad 0.4 y sin cursor; nunca ocultar acciones por permisos sin explicar.\n- Movimiento: 150–200 ms, ease-out, solo en aperturas (menús, drawers) y feedback; respetar `prefers-reduced-motion`.\n\n## Iconografía\n\n- Set de línea **Lucide** (licencia ISC) incluido en el bundle como `Icon`: trazo 1.75px, puntas redondeadas, 16px en controles chicos y 18–20px por defecto. El sitio usa PNGs sueltos; este set es una incorporación para la app.\n- Color heredado: `ink-muted` por defecto, `primary-text` cuando está activo, color de estado solo junto a una palabra.\n- Sin emojis como íconos. Un ícono solo, sin texto, siempre lleva `label` o va dentro de un `IconButton` con tooltip.\n\n## Logo\n\n- `assets/Logos/Logo flock complete.svg` (isologo, 260×67) y `assets/Logos/Logo flock short.svg` (isotipo, 67×67): una sola tinta `brand-night` (#180026). Solo sobre fondos claros (`bg`, `surface`).\n- Sobre `surface-brand`, `brand-night`, Christalle o fotos oscuras va la versión blanca. Hoy es un PNG (222×57) que siguen usando las previews de Header, Login y ErrorPage, pero ya no figura en el grupo Logos: falta su SVG.\n- Altura mínima 24px en el header de la app; aire alrededor igual a la altura de la \"f\".\n- No recolorear, no estirar, no poner la versión oscura sobre fondos oscuros.\n\n## Gráficos\n\n- Series en orden fijo: `chart-1` (Purple Heart; Cornflower en oscuro), `chart-2` (Lavender), `chart-3` (Christalle; Cornflower 20% en oscuro), `chart-4` (gris); de la quinta en adelante, agrupar en \"Otros\" con `chart-other`. Paleta validada para daltonismo y contraste en ambos temas.\n- Un solo eje Y; grilla en `border`, ejes y etiquetas en `ink-subtle`; valores siempre con formato AR. Con dos o más series, leyenda siempre.\n\n## Componentes\n\n- Todo está construido con clases `fk-*` sobre los tokens (`components/bundle.css`), así que sirve para cualquier stack. En React 18, `window.FlockUI` expone los componentes y un helper `html` para escribir pantallas sin build.\n- Pantalla tipo: `AppShell` → `PageHeader` → `SavedViews` → `FilterBar` o `FilterGrid` → `DataTable` con `TableToolbar` y `Pagination`. Detalle: `PageHeader` con `Tabs` → `Grid` 8 + 4 con `Card`, `DescriptionList`, `Timeline` y `Comments`. Ver las plantillas `TemplateList` y `TemplateDetail`.\n- Ventanas: `Modal` para 1–5 campos, `Drawer` para ver o editar sin perder la lista, `ConfirmDialog` para lo destructivo.\n- Método de implementación: **Atomic Design** (sección propia). Cada componente tiene nivel, uso, límites y comportamiento en mobile; las mismas reglas están en `ai/components.json` para agentes de IA, y la sección **Prompt para agentes IA** trae las instrucciones listas para usar.\n- Responsive: el mismo código sirve para escritorio y mobile. Por debajo de `bp-md` (768 px) los componentes se adaptan solos (ver Atomic Design → Mobile); en pantallas táctiles todo control mide al menos `size-touch`.\n- Capas: cada componente trae su `z-*`; nadie escribe `z-index`.\n\n## Accesibilidad\n\n- Todo par de texto declarado en los tokens cumple 4.5:1 en ambos temas; bordes de control y foco ≥3:1.\n- Áreas táctiles de 40px mínimo (botón mediano); 32px solo en tablas compactas.\n- Toda acción con ícono solo lleva `aria-label` y tooltip.\n\n\n---\n\n## Consuming this system (generated — do not edit)\n\nEvery path named below is under `project/` in this design system: read `project/api/tokens.md`, not `api/tokens.md`.\n\n`components/bundle.js` defines `window.FlockUI` (77 components); `components/bundle.css` is its stylesheet; `tokens.css` is every token as a CSS variable plus `@font-face` for the fonts. `components/bundle.css` reads its variables from `tokens.css`. The bundle needs react 18 (not packed in this system: bring your own copy) (`window.React`), react-dom 18 (not packed in this system: bring your own copy) (`window.ReactDOM`), loaded before it. Build any UI by mounting these components; never hand-build a control or draw an icon the system provides.\n\n- **Standalone page:** inline `tokens.css` and `components/bundle.css` in a `<style>`, then the library files and `components/bundle.js` as classic scripts (a file containing `</style`, `<\/script` or `\u003c!--` breaks an inline element: write the sequence `<\\/style`, `<\\/script` or `\\x3C!--` in your copy, or load that file by URL).\n- **Design canvas:** bring `components/bundle.css`, `components/bundle.js` and `components/index.d.ts` (for the editor’s props panel) onto the canvas in full, as the canvas type’s design-system components reference says (a server-side copy first where it offers one); load the stylesheet before the script; skip the library files (the artboard supplies React); mount with `<x-import component-from-global-scope=\"FlockUI.<Comp>\" …>`.\n- **Slides deck, or any surface that cannot run the bundle:** tokens only — the values are on `api/tokens.md`; the deck takes `tokens.json` by file path for its colour pickers.\n\n**Read, per thing:** a component’s props, parts and examples: `api/components/<Comp>.md`; token values: `api/tokens.md`; stored assets and their paths: `api/assets/<Group>.md`. After this README, fetch the cards and fonts you need in ONE message as parallel calls — none depends on another.\n\n**Two rules.** Before you use a thing — a component, a token group, an icon, an asset — read its card from the index below; a value you did not read from a card is a guess. `tokens.json`, `manifest.json`, `components/index.d.ts` and `design-system.json` are sources for tools: hand them over. `components/<Comp>/README.md` and `assets/<Group>/README.md` are the long-form second read a card links to; `SKILL.md` and `artifact-type/` beside them are authoring guidance, not needed to consume the system.\n\n## Index (generated — do not edit)\n\n**Tokens**\n\n- `api/tokens.md` — Every token: surface, text, fill, border, chart, palette, type, spacing, radius, shadow, border-width, z-index, breakpoint, size. (14.5k)\n\n**Icons and assets**\n\n- `api/assets/Logos.md` — 2 files, by asset id. (1.2k)\n\n**Components** (`api/components/<Comp>.md`, 82; 5 of them showcase pages)\n\n- **Layout y navegación**: `AppShell` — Estructura base de toda app interna: header de marca arriba, sidebar a la izquierda, contenido y footer · `Header` — Barra superior de marca: logo, nombre del producto, ambiente, buscador global, notificaciones y usuario · `Sidebar` — Navegación lateral colapsable con secciones, contadores e ítems anidados · `PageHeader` — Encabezado de página: breadcrumbs, título, estado, descripción, acciones y, opcionalmente, tabs · `Breadcrumbs` — Muestra dónde está la página dentro de la jerarquía y permite subir niveles · `Tabs` — Secciones de una misma entidad o página (Datos, Historial, Documentos) · `Pagination` — Navegación entre páginas de resultados, con cantidad por página y total · `Stepper` — Progreso dentro de un flujo de varios pasos (altas, importaciones, wizards) · `UserMenu` — Menú de la persona usuaria: perfil, preferencias, tema y cerrar sesión · `CommandPalette` — Búsqueda global y acciones rápidas con teclado (Ctrl+K) · `AppFooter` — Pie de la app con versión, ambiente y enlaces de soporte · `Grid` — Grilla de 12 columnas (Grid + Col) y pila (Stack) para maquetar páginas con los espaciados del sistema\n- **Acciones**: `Button` — Botón pill para acciones: primario, de marca, secundario, ghost, peligro e inverso · `IconButton` — Acción compacta solo con ícono, para toolbars, tablas y headers · `Link` — Enlace de navegación dentro de texto, celdas y ayudas · `DropdownMenu` — Menú desplegable de acciones: el \"⋯\" de filas, cards y encabezados · `SplitButton` — Acción principal con un menú de alternativas relacionadas (\"Exportar ▾\") · `SegmentedControl` — Alterna entre pocas vistas o períodos mutuamente excluyentes · `BulkActionBar` — Barra de acciones sobre las filas seleccionadas de una tabla\n- **Formularios**: `FormField` — Contenedor de un campo: label, marca de obligatorio u opcional, ayuda y error · `TextInput` — Campo de texto de una línea, con ícono, prefijo/sufijo, contador y botón de limpiar · `Textarea` — Texto de varias líneas para observaciones y descripciones · `Select` — Elegir una opción de una lista cerrada y corta · `Combobox` — Selector con búsqueda para listas largas (partners, clientes, personas) · `MultiSelect` — Selección de varias opciones, mostradas como chips removibles · `Checkbox` — Casilla de verificación: una opción independiente, o varias con CheckboxGroup · `RadioGroup` — Elegir exactamente una opción entre pocas, todas visibles · `Switch` — Interruptor para activar o desactivar algo al instante · `DatePicker` — Fecha o rango de fechas en formato dd/mm/aaaa, con calendario y atajos · `NumberInput` — Números e importes con formato argentino: 1.234,56 y $ 1.234,56 · `SearchField` — Buscador pill con ícono, limpiar y atajo de teclado opcional · `FileUpload` — Zona para arrastrar o elegir archivos, con la lista de adjuntos y su estado · `TimePicker` — Hora del día en formato 24 h, elegida de una lista o tipeada · `Slider` — Valor o rango numérico sobre una pista · `FormLayout` — Estructura de formularios largos: secciones con título a la izquierda, campos en grilla y barra de acciones\n- **Filtros y datos**: `FilterBar` — Barra de filtros rápidos sobre una lista: buscador, pills de filtro, chips activos y \"Limpiar filtros\" · `FilterDropdown` — Pill de filtro que abre una lista con checkboxes (o una sola opción) para filtrar por una dimensión · `FilterChip` — Un filtro activo, removible · `FilterGrid` — Formulario de filtros en grilla sobre un listado, con \"Buscar\" y \"Limpiar\" — el clásico panel de búsqueda de los sistemas de gestión · `DataTable` — La grilla de datos: orden y filtros por columna, selección de filas, acciones por fila, densidad, encabezado fijo y estados de carga y vacío · `ColumnFilter` — Filtros de la tabla (data-table filters): cada columna filtra sus propios valores, desde un ícono en el encabezado o desde una fila de filtros debajo de los tí… · `TableToolbar` — Barra superior de una tabla: título, total, búsqueda local, columnas visibles, densidad y acciones · `FilterPanel` — Panel lateral con todos los criterios de filtro (filtros avanzados) · `SavedViews` — Vistas guardadas: combinaciones de filtros con nombre, a un clic · `DescriptionList` — Detalle clave–valor de un registro · `List` — Lista simple de ítems con ícono o avatar, título, metadato y contenido a la derecha · `StatCard` — KPI: una métrica con su variación y una sparkline · `Chart` — Gráficos de barras, líneas y dona con la paleta de marca, leyenda y tooltip al pasar el mouse · `Timeline` — Historial de actividad o auditoría de un registro · `TreeView` — Jerarquía expandible: organización, módulos, carpetas · `KanbanBoard` — Tablero de columnas por estado; las tarjetas se arrastran entre columnas · `Calendar` — Vista mensual con eventos\n- **Contenedores**: `Card` — Contenedor con encabezado, acciones y pie opcionales · `Modal` — Diálogo enfocado para formularios cortos y decisiones que bloquean el flujo · `ConfirmDialog` — Confirmación explícita antes de una acción destructiva o irreversible · `Drawer` — Panel lateral para ver o editar un registro sin salir de la lista · `Tooltip` — Ayuda breve al pasar el mouse o enfocar; etiqueta de los botones de solo ícono · `Popover` — Panel flotante con contenido interactivo, anclado a un disparador · `Accordion` — Secciones colapsables para contenido secundario o largo · `Divider` — Línea que separa bloques; puede llevar un texto centrado\n- **Feedback y estado**: `Alert` — Mensaje en la página: información, éxito, advertencia o error. banner para avisos globales de ancho completo · `Toast` — Confirmación breve de una acción, que desaparece sola · `StatusBadge` — Estado de un registro: punto + palabra · `Tag` — Etiqueta para categorías, tecnologías o palabras clave; puede ser seleccionable o removible · `Spinner` — Indicador de carga indeterminada · `Skeleton` — Marcador de posición mientras carga el contenido, con la forma del contenido final · `ProgressBar` — Progreso de un proceso largo: importaciones, generación de archivos, cargas masivas · `EmptyState` — Pantalla o bloque sin datos: todavía no hay nada, o los filtros no devuelven resultados · `ErrorPage` — Pantallas de error: 404, 403 (sin permisos), 500 y mantenimiento (503) · `EnvBadge` — Indica en qué ambiente estás: DEV, TEST, UAT o PROD\n- **Personas y colaboración**: `Avatar` — Persona o equipo, con foto o iniciales y estado de presencia · `UserCard` — Tarjeta de una persona: rol, equipo, contacto y acciones rápidas · `NotificationCenter` — Campana con contador de no leídas y panel de notificaciones · `Comments` — Hilo de comentarios sobre un registro, con menciones, respuestas y compositor\n- **Utilitarios**: `Icon` — Set de íconos de línea (Lucide, licencia ISC) con trazo de 1.75px y puntas redondeadas · `CopyButton` — Copiar al portapapeles un ID, CUIT o link, con confirmación · `Kbd` — Tecla o atajo de teclado\n- **Plantillas**: `Login` (showcase page) — Pantalla de ingreso: panel de marca con el isologo y el claim, y formulario con SSO · `TemplateDetail` (showcase page) — Plantilla de detalle: encabezado con estado y acciones, tabs, ficha, KPIs, historial y comentarios · `TemplateList` (showcase page) — Plantilla de listado: shell, encabezado, vistas guardadas, grilla de filtros, tabla con acciones y paginación · `TemplateMobile` (showcase page) — Plantilla de listado en mobile (390 px): es el mismo código que la versión de escritorio; los componentes se adaptan solos por debajo de bp-md (768 px) · `TemplateMobileForm` (showcase page) — Formulario corto en mobile: el mismo Modal de escritorio se convierte en hoja inferior por debajo de bp-md, con los botones del pie a ancho completo\n"},{"id":"atomic","title":"Atomic Design","md":"# Atomic Design\n\nMétodo de implementación del sistema. Cada pantalla se arma de abajo hacia arriba: tokens → átomos → moléculas → organismos → plantillas → páginas. Quien construye (una persona o un agente de IA) **compone** piezas existentes: no inventa componentes, no cambia estilos y no escribe valores sueltos. Si algo no existe, lo pide al sistema.\n\nEsta sección es la referencia para entrenar a los agentes. Va acompañada de `ai/components.json` (las mismas reglas por componente, en formato de datos) y de la sección **Prompt para agentes IA**.\n\n## Los niveles\n\n| Nivel | Qué es | Regla de oro | Piezas del sistema |\n| --- | --- | --- | --- |\n| **0 · Tokens** | Decisiones de diseño con nombre: color, tipografía, espaciado, radios, bordes, sombras, capas (`z-*`), breakpoints (`bp-*`) y medidas (`size-*`). | Nunca un valor suelto: ni hex, ni px, ni z-index a mano. | `tokens.json` |\n| **1 · Átomos** | Una sola pieza con una sola función. No contiene otros componentes del sistema (salvo `Icon`). | Se usan tal cual, con sus props. Nunca se restilan. | `Icon` `Button` `IconButton` `Link` `TextInput` `Textarea` `NumberInput` `SearchField` `Select` `Checkbox` `Switch` `Slider` `Avatar` `StatusBadge` `Tag` `FilterChip` `EnvBadge` `Kbd` `Spinner` `Skeleton` `ProgressBar` `Divider` |\n| **2 · Moléculas** | Un grupo chico de átomos que resuelve una tarea. | Una tarea por molécula. Si hace dos cosas, son dos moléculas. | `FormField` `CheckboxGroup` `RadioGroup` `Combobox` `MultiSelect` `DatePicker` `TimePicker` `FileUpload` `Tooltip` `Popover` `DropdownMenu` `SplitButton` `SegmentedControl` `Breadcrumbs` `Tabs` `Pagination` `Stepper` `CopyButton` `AvatarGroup` `Alert` `Toast` `EmptyState` `FilterDropdown` `ColumnFilter` `StatCard` `DescriptionList` `UserCard` `UserMenu` |\n| **3 · Organismos** | Una sección completa e independiente de la interfaz. | Ocupa una zona de la pantalla; se separa de otros organismos con espacio, no con líneas ni posiciones a mano. | `Header` `Sidebar` `AppFooter` `PageHeader` `Card` `Modal` `ConfirmDialog` `Drawer` `Accordion` `FormLayout` (`FormSection`, `FormActions`) `FilterBar` `FilterGrid` `FilterPanel` `SavedViews` `DataTable` `TableToolbar` `BulkActionBar` `List` `Chart` `Timeline` `TreeView` `KanbanBoard` `Calendar` `NotificationCenter` `Comments` `CommandPalette` `ErrorPage` |\n| **4 · Plantillas** | La estructura de una pantalla, sin datos reales. | Toda pantalla nueva empieza copiando una plantilla. | Estructura: `AppShell` `Grid` `Col` `Stack`. Plantillas: `TemplateList` `TemplateDetail` `TemplateMobile` `TemplateMobileForm` `Login` |\n| **5 · Páginas** | La plantilla con datos y textos reales del producto. | Viven en el código del producto, no en el sistema. | — |\n\n## Reglas de composición\n\n1. **Cada nivel solo contiene niveles inferiores.** Un átomo no contiene moléculas; un organismo no va dentro de una molécula (nunca una `DataTable` dentro de un `Tooltip` o de un `Popover`).\n2. **Props, no CSS.** El aspecto se elige con `variant`, `size`, `tone`; nunca con `style`, clases propias o `!important`. Las únicas excepciones son `Grid`, `Col` y `Stack`, que existen para maquetar.\n3. **No restiles un componente desde afuera.** Si falta una variante, se agrega al sistema y se documenta; no se resuelve en la pantalla.\n4. **Una acción primaria por vista** (pantalla, modal o drawer). Las demás son `secondary`, `ghost` o van al menú ⋯ (`DropdownMenu`).\n5. **El texto lo escribe la página, la forma la pone el sistema.** Voz y formato según \"Voz y contenido\" del README: voseo, sentence case, `1.234,56`, `dd/mm/aaaa`.\n6. **Si un componente no existe, no se inventa.** Se compone con lo que hay o se informa el faltante.\n\n### Qué puede ir dentro de qué\n\n| Contenedor | Puede contener | No puede contener |\n| --- | --- | --- |\n| `Header` | logo, nombre del producto, `EnvBadge`, `SearchField` chico, `IconButton` `inverse`, `NotificationCenter` `inverse`, `UserMenu` | botones con texto, filtros, tabs |\n| `Sidebar` | ítems de navegación (con ícono, contador y un nivel de hijos), secciones | botones de acción, formularios |\n| `PageHeader` | `Breadcrumbs`, título, `StatusBadge`, descripción, hasta 1 `primary` + 2 `secondary` + 1 `DropdownMenu`, `Tabs` | filtros, KPIs, alertas |\n| `Card` | `DescriptionList`, `List`, `Chart`, `Timeline`, `Comments`, campos de formulario, `DataTable` (con `padding=\"none\"`) | otra `Card` con borde (usá `variant=\"subtle\"`), `Modal` |\n| `Modal` | hasta 5 `FormField`, `Alert`, `DescriptionList`, texto | `DataTable`, `Tabs`, `Stepper`, otro `Modal` o `Drawer` |\n| `Drawer` | `DescriptionList`, `FormField`, `Tabs`, `Timeline`, `Comments`, `Alert` | otro `Drawer`, `Modal` (sí puede abrir `ConfirmDialog`) |\n| Celda de `DataTable` | texto (con texto secundario), `StatusBadge`, 1 `Tag`, `Avatar` `xs`, `Link`, código en `fk-mono` | `Button` mediano, inputs editables, gráficos, más de una acción visible |\n| `FilterBar` | `SearchField`, hasta 5 `FilterDropdown`, botón \"Más filtros\", acciones a la derecha | campos de formulario sueltos (para eso, `FilterGrid`) |\n| `FilterGrid` / `FilterPanel` | `FormField` con cualquier control de formulario | tablas, gráficos |\n| `Toast` | título, texto, una acción (`Link`) | formularios, más de una acción |\n\n### Cantidades máximas\n\n| Componente | Límite |\n| --- | --- |\n| `Tabs` | 2 a 7 pestañas |\n| `SegmentedControl` | 2 a 5 opciones |\n| `Sidebar` | 12 ítems de primer nivel, 2 niveles |\n| `DropdownMenu` | 8 ítems (agrupá con `label`) |\n| `PageHeader` | 1 primaria + 2 secundarias visibles |\n| `BulkActionBar` | 4 acciones |\n| `FilterBar` | 5 filtros rápidos |\n| `StatCard` | 4 por fila |\n| `Chart` | 4 series + \"Otros\"; un solo eje Y |\n| `ToastStack` | 3 a la vez |\n| `Modal` | 5 campos |\n\n## Cuándo usar cada uno\n\n### Elegir valores\n\n| Situación | Usá |\n| --- | --- |\n| 2–4 opciones que conviene ver juntas, en un formulario | `RadioGroup` |\n| 2–5 opciones que cambian la vista al instante | `SegmentedControl` |\n| Hasta ~10 opciones conocidas | `Select` |\n| Más de 10 opciones o hay que buscar | `Combobox` |\n| Varias opciones en un formulario | `MultiSelect` |\n| Activar algo al instante | `Switch` |\n| Confirmar una opción al guardar | `Checkbox` |\n| Montos, porcentajes, cantidades | `NumberInput` |\n| Fecha o período | `DatePicker` (`range` para períodos) |\n\n### Mostrar datos\n\n| Situación | Usá |\n| --- | --- |\n| Registros con varias columnas para comparar | `DataTable` |\n| Uno o dos datos por ítem | `List` |\n| Detalle clave–valor de un registro | `DescriptionList` |\n| Un número importante | `StatCard` |\n| Tendencia o comparación de magnitudes | `Chart` |\n| Registros por estado | `KanbanBoard` |\n| Registros por fecha | `Calendar` (en mobile, `List` agrupada por día) |\n| Historial de cambios | `Timeline` |\n| Jerarquías de más de dos niveles | `TreeView` |\n\n### Editar y confirmar\n\n| Situación | Usá |\n| --- | --- |\n| 1 a 5 campos | `Modal` |\n| Editar sin perder la lista | `Drawer` |\n| Más de 5 campos | Página con `FormLayout` y `FormActions sticky` |\n| Flujo en varios pasos | `Stepper` + `FormLayout` |\n| Acción destructiva o irreversible | `ConfirmDialog` |\n\n### Filtrar\n\n| Situación | Usá |\n| --- | --- |\n| Pocas dimensiones, filtrado al instante | `FilterBar` (+ `FilterDropdown`) |\n| Consulta que se arma y después se ejecuta | `FilterGrid` |\n| Muchos criterios | `FilterPanel` desde \"Más filtros\" |\n| Filtrar una columna puntual de la tabla | `ColumnFilter` (prop `filter` de la columna) |\n| Combinaciones que se repiten | `SavedViews` |\n\n### Avisar\n\n| Situación | Usá |\n| --- | --- |\n| Una acción terminó bien | `Toast` |\n| Estado que hay que ver mientras se trabaja | `Alert` |\n| Aviso para toda la app | `Alert banner` |\n| Error en un campo | `error` de `FormField` |\n| No hay datos o no hay resultados | `EmptyState` |\n| Ruta inexistente, sin permisos, falla o mantenimiento | `ErrorPage` |\n\n### Navegar y ayudar\n\n| Situación | Usá |\n| --- | --- |\n| Secciones de la app | `Sidebar` |\n| Secciones de un registro | `Tabs` |\n| Ubicación en la jerarquía | `Breadcrumbs` |\n| Páginas de resultados | `Pagination` |\n| Búsqueda global y atajos | `CommandPalette` |\n| Nombre de un botón de ícono | `Tooltip` |\n| Explicación con una acción | `Popover` |\n| Información necesaria para completar la tarea | Texto en pantalla (nunca solo en un tooltip) |\n\n## Sin solapamientos\n\n### Capas\n\nCada componente ya trae su capa. Nadie escribe `z-index`.\n\n| Token | Valor | Quién lo usa |\n| --- | --- | --- |\n| `z-base` | 0 | contenido normal |\n| `z-sticky` | 5 | encabezado de `DataTable`, `FormActions sticky` |\n| `z-header` | 40 | `Header` |\n| `z-dropdown` | 60 | `DropdownMenu`, `Select`, `DatePicker`, `Popover` |\n| `z-floating` | 70 | `BulkActionBar floating` |\n| `z-overlay` | 80 | `Modal`, `ConfirmDialog`, `Drawer`, `CommandPalette` |\n| `z-popup` | 85 | popups fijos dentro de tablas y overlays (filtros de columna, acciones de fila) |\n| `z-tooltip` | 90 | `Tooltip` |\n| `z-toast` | 95 | `ToastStack` |\n\n### Reglas\n\n1. **Un solo overlay bloqueante a la vez**: un `Modal` o un `Drawer`. La única excepción es `ConfirmDialog`, que puede abrirse sobre un `Drawer`.\n2. **Un solo popup abierto**: abrir un menú, una lista o un calendario cierra el anterior (todos se cierran con clic afuera y con Esc).\n3. **Dentro de tablas, paneles con scroll u overlays**, los menús van con `fixed` para no quedar recortados. `DataTable` ya lo hace con los filtros de columna y las acciones de fila.\n4. **Nada se posiciona a mano encima de otra cosa** (`position: absolute`, márgenes negativos). La ubicación la dan `Grid`, `Stack` y los propios componentes.\n5. **Solo tres cosas son sticky**: el `Header` (arriba), el encabezado de la `DataTable` y `FormActions` (abajo). No agregues más.\n6. **`BulkActionBar floating` y `FormActions sticky` no conviven** en la misma pantalla: los dos ocupan el borde inferior.\n7. **El texto largo no empuja ni tapa**: en celdas, listas y títulos de tarjeta se corta con elipsis y el texto completo se ve en el detalle. Todo contenedor flexible lleva `min-width: 0` (los del sistema ya lo tienen).\n8. **Los toasts no tapan la acción primaria**: salen abajo a la derecha (en mobile, abajo a todo el ancho) y se cierran solos a los 5 segundos (`duration`); los de error quedan hasta que la persona los cierra.\n\n## Márgenes y espaciado\n\nEl espacio **lo pone el contenedor**, nunca el hijo: se usa el `gap` de `Stack` y `Grid`, no `margin` en los componentes. Todo el espaciado sale de la escala de 10 px del sitio.\n\n| Dónde | Token |\n| --- | --- |\n| Adentro de un componente | lo resuelve el componente: no se toca |\n| Ícono y texto, badges | `space-5` |\n| Botones juntos, controles relacionados | `space-10` |\n| Entre campos de un formulario (vertical) | `space-15` |\n| Entre columnas de un formulario o grilla | `space-20` |\n| Entre bloques de una página (filtros → tabla) | `space-20` |\n| Entre secciones grandes de una página | `space-40` |\n| Margen de la página | `space-30` en escritorio, `space-15` en mobile (lo aplica `AppShell`) |\n| Padding de `Card` | `space-20`; `padding=\"roomy\"` usa `space-30` `space-40` como el sitio |\n\nEjemplo de una página bien espaciada:\n\n```jsx\n<AppShell header={<Header … />} sidebar={<Sidebar … />}>\n  <PageHeader title=\"Partners\" actions={<Button icon=\"plus\">Nuevo partner</Button>} />\n  <Stack gap=\"space-20\">\n    <FilterBar filters={…} />\n    <DataTable columns={…} rows={…} footer={<Pagination total={…} />} />\n  </Stack>\n</AppShell>\n```\n\n- Grilla de 12 columnas con gutter `space-20`. Combinaciones habituales: 8 + 4 (detalle + panel), 3 × 4 (KPIs), 6 + 6 (formularios).\n- Todo se alinea al borde izquierdo del contenido; no centres bloques salvo `EmptyState` y `ErrorPage`.\n\n## Mobile\n\nMobile es todo lo que está por debajo de `bp-md` (768 px). La regla es **el mismo código para todas las pantallas**: la mayoría de los componentes se adaptan solos y unos pocos necesitan una decisión de quien construye.\n\n### Se adaptan solos\n\n| Componente | En mobile |\n| --- | --- |\n| `AppShell` | Saca el `Sidebar` de la pantalla y lo muestra como cajón lateral desde el botón de menú del `Header`. Margen de página `space-15`. |\n| `Header` | Alto 56 px; oculta nombre de producto, buscador y ayuda; muestra un botón \"Buscar\" (conectalo con `onSearchClick` a `CommandPalette`). |\n| `PageHeader` | Título a 24 px; las acciones pasan abajo y la primaria ocupa el ancho. |\n| `DataTable` | Una tarjeta por registro. Filtros de columna y orden desde \"Filtrar\" y \"Ordenar\". Con `mobileLayout=\"scroll\"` queda como tabla con scroll horizontal. |\n| `FormLayout` / `FormSection` | Una columna; `FormActions` con botones a ancho completo. |\n| `FilterGrid` | 2 columnas en contenedores angostos, 1 columna en teléfonos. |\n| `FilterBar` | Buscador a ancho completo; chips activos con scroll horizontal. |\n| `Modal` | Hoja inferior a todo el ancho; botones del pie a ancho completo. |\n| `Drawer` | Pantalla completa. |\n| `CommandPalette` | Pantalla completa. |\n| `Pagination` | Oculta \"Por página\". |\n| `DescriptionList` | Una columna. |\n| `Grid` | Una columna (`responsive={false}` para mantener columnas, por ejemplo 2 KPIs por fila con `cols={2}`). |\n| `SavedViews`, `Tabs` | Scroll horizontal. |\n| `KanbanBoard` | Columnas deslizables de a una. |\n| `Calendar` | Los eventos pasan a marcas de color en cada día. |\n| `ToastStack`, `BulkActionBar floating` | Abajo a todo el ancho. |\n| Pantallas táctiles (todas) | Todo control mide al menos `size-touch` (44 px); los inputs usan 16 px para que el teléfono no haga zoom; los `Tooltip` no se muestran. |\n\n### Necesitan una decisión\n\n| Situación | Qué hacer |\n| --- | --- |\n| Columnas de `DataTable` en la tarjeta | Marcá cada columna con `mobile`: `title`, `subtitle`, `badge`, `amount`, `meta` u `hidden`. Por defecto: la primera es el título, la primera numérica el importe y hasta dos más quedan como datos. |\n| Información que hoy está en un `Tooltip` | Mostrala en pantalla o en un `Popover` que se abre al tocar. |\n| `Calendar` con muchos eventos | Usá una `List` agrupada por día (vista agenda). |\n| `Chart` | Máximo 6 categorías; si hay más, agrupá en \"Otros\". |\n| `Header` fuera de `AppShell` | Pasá `onMenuClick` para abrir tu navegación. |\n| Lógica distinta por tamaño | `useIsMobile()` (o `useMediaQuery('(max-width: 767px)')`) desde `FlockUI`. Usalo para decidir qué mostrar, no para cambiar estilos. |\n| Formularios de más de 5 campos | Página con `FormLayout`, nunca un `Modal` largo. |\n\n## Flujo para agentes IA\n\n1. **Leé** el README, después esta sección, después `ai/components.json`. No uses nada que no esté ahí.\n2. **Identificá el tipo de pantalla** y copiá su plantilla: listado → `TemplateList`; detalle → `TemplateDetail`; ingreso → `Login`; versión mobile → `TemplateMobile` / `TemplateMobileForm` (es el mismo código).\n3. **Dividí la pantalla en zonas** (header, navegación, encabezado de página, filtros, contenido, pie) y elegí un organismo por zona.\n4. **Para cada organismo**, elegí moléculas y átomos con las tablas de \"Cuándo usar cada uno\" y respetá \"Qué puede ir dentro de qué\".\n5. **Espaciá con `Stack` y `Grid`** usando la tabla de márgenes.\n6. **Revisá mobile**: marcá `mobile` en las columnas de las tablas y sacá información de los tooltips.\n7. **Verificá con el checklist** antes de entregar.\n\n### Checklist de entrega\n\n- [ ] Solo componentes de `FlockUI` (o sus clases `fk-*`); ninguno inventado.\n- [ ] Ningún hex, px, `z-index` ni `style` fuera de `Grid`, `Col` y `Stack`.\n- [ ] Una sola acción `primary` por vista.\n- [ ] Cada contenedor tiene solo hijos permitidos y respeta las cantidades máximas.\n- [ ] Un solo overlay bloqueante y un solo popup abierto a la vez.\n- [ ] Espacios con `gap` de tokens; sin márgenes en los hijos.\n- [ ] Estados con palabra e ícono (`StatusBadge`, `Alert`), no solo color.\n- [ ] Números, montos y fechas en formato argentino.\n- [ ] Textos con voseo y en sentence case.\n- [ ] Probado a 390 px y a 1280 px; columnas de tablas con `mobile` definido.\n- [ ] Toda acción de solo ícono tiene `label`.\n\n### Errores frecuentes\n\n| Error | Corrección |\n| --- | --- |\n| Poner `margin-top` en un componente para separarlo | Envolver en `Stack gap=\"space-20\"` |\n| Dos botones `primary` en el `PageHeader` | Uno `primary`, el otro `secondary` o al menú ⋯ |\n| `Card` dentro de `Card` | La interior con `variant=\"subtle\"` o un `Divider` |\n| Abrir un `Modal` desde otro `Modal` | Cerrar el primero, o pasar a `Drawer` + `ConfirmDialog` |\n| Tabla con 12 columnas en mobile | Definir `mobile` en las columnas: título, badge, importe y 2 datos |\n| Color de estado sin texto | `StatusBadge` con la palabra |\n| Tooltip con información obligatoria | Texto visible o `Popover` |\n| Filtros sueltos con `Select` arriba de la tabla | `FilterBar` con `FilterDropdown`, o `FilterGrid` |\n| Estilos copiados de otra librería (Material, Bootstrap) | Usar el componente equivalente de `FlockUI`; si no existe, informarlo |\n"},{"id":"catalog","title":"Component catalog","md":"# Catálogo de componentes\n\nInventario de componentes para los sistemas internos. Todos tienen su card con preview en vivo y guía de uso en la sección Componentes, con el nombre de la columna **En código**. Prioridad sugerida: **P1** = base para cualquier pantalla (MVP), **P2** = pantallas de gestión completas, **P3** = casos específicos. Estado: *propuesta en revisión*.\n\n## A. Layout y navegación\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 1 | App shell | `AppShell` | Estructura base: sidebar + header + contenido | P1 |\n| 2 | Header / Top bar | `Header` | Logo, buscador global, ambiente, notificaciones, usuario | P1 |\n| 3 | Sidebar | `Sidebar` | Navegación lateral colapsable, secciones, contadores | P1 |\n| 4 | Page header | `PageHeader` | Título de página + breadcrumbs + acciones | P1 |\n| 5 | Breadcrumbs | `Breadcrumbs` | Ubicación dentro de la jerarquía | P1 |\n| 6 | Tabs | `Tabs` | Secciones dentro de una entidad (Datos, Historial, Documentos) | P1 |\n| 7 | Pagination | `Pagination` | Navegar resultados de tablas y listas | P1 |\n| 8 | Stepper / Wizard | `Stepper` | Altas en varios pasos | P2 |\n| 9 | Menú de usuario | `UserMenu` | Perfil, preferencias, tema, cerrar sesión | P2 |\n| 10 | Command palette | `CommandPalette` | Búsqueda global y atajos (Ctrl+K) | P3 |\n| 11 | Footer de app | `AppFooter` | Versión, ambiente, soporte | P3 |\n\n## B. Acciones\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 12 | Button | `Button` | Primario, secundario, ghost, peligro; 3 tamaños; con ícono; cargando | P1 |\n| 13 | Icon button | `IconButton` | Acciones compactas en tablas y toolbars | P1 |\n| 14 | Link | `Link` | Navegación dentro de texto y celdas | P1 |\n| 15 | Dropdown menu | `DropdownMenu` | Menú de acciones (⋯) por fila o por página | P1 |\n| 16 | Split button | `SplitButton` | Acción principal + alternativas (\"Exportar ▾\") | P2 |\n| 17 | Segmented control | `SegmentedControl` | Alternar vistas o períodos (Día / Semana / Mes) | P2 |\n| 18 | Bulk action bar | `BulkActionBar` | Barra de acciones al seleccionar varias filas | P2 |\n\n## C. Formularios\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 19 | Form field | `FormField` | Contenedor: label, requerido, ayuda, error | P1 |\n| 20 | Text input | `TextInput` | Texto con prefijo/sufijo, limpiar, estados | P1 |\n| 21 | Textarea | `Textarea` | Observaciones, comentarios | P1 |\n| 22 | Select | `Select` | Lista cerrada de opciones | P1 |\n| 23 | Combobox / Autocomplete | `Combobox` | Lista larga con búsqueda (clientes, partners) | P1 |\n| 24 | Multiselect | `MultiSelect` | Varias opciones con chips | P1 |\n| 25 | Checkbox | `Checkbox` | Opción individual y selección en tablas | P1 |\n| 26 | Radio group | `RadioGroup` | Una opción entre pocas | P1 |\n| 27 | Switch | `Switch` | Activar/desactivar al instante | P1 |\n| 28 | Date picker / Range | `DatePicker` | Fechas y períodos (dd/mm/aaaa) | P1 |\n| 29 | Number / Currency input | `NumberInput` | Importes con formato AR ($ 1.234,56), porcentajes | P1 |\n| 30 | Search field | `SearchField` | Búsqueda pill en tablas y header | P1 |\n| 31 | File upload / Dropzone | `FileUpload` | Adjuntar Excel, PDF, imágenes | P2 |\n| 32 | Time picker | `TimePicker` | Horarios | P3 |\n| 33 | Slider / Range | `Slider` | Rangos numéricos | P3 |\n| 34 | Form layout / Fieldset | `FormLayout` | Grillas y grupos de campos, barra de guardar fija | P2 |\n\n## D. Filtros, datos y visualización\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 35 | Filter bar | `FilterBar` | Fila de filtros rápidos + \"Limpiar filtros\" | P1 |\n| 36 | Filter chip | `FilterChip` | Filtro activo removible, pill | P1 |\n| 37 | Data table | `DataTable` | Orden, filtros por columna, selección, acciones por fila, columnas fijas, densidad | P1 |\n| 38 | Table toolbar | `TableToolbar` | Búsqueda, columnas visibles, exportar, densidad | P1 |\n| 39 | Panel de filtros avanzados | `FilterPanel` | Drawer con todos los criterios | P2 |\n| 40 | Vistas guardadas | `SavedViews` | Combinaciones de filtros con nombre | P3 |\n| 41 | Description list | `DescriptionList` | Detalle clave–valor de un registro | P1 |\n| 42 | List / List item | `List` | Listas simples con avatar, meta y acción | P2 |\n| 43 | KPI / Stat card | `StatCard` | Métrica + variación + sparkline | P2 |\n| 44 | Charts | `Chart` | Barras, líneas, dona con la paleta de marca | P2 |\n| 45 | Timeline / Historial | `Timeline` | Actividad y auditoría de un registro | P2 |\n| 46 | Tree view | `TreeView` | Jerarquías (organización, módulos) | P3 |\n| 47 | Kanban board | `KanbanBoard` | Estados de tareas o tickets | P3 |\n| 48 | Calendar | `Calendar` | Vista mensual/semanal de eventos | P3 |\n\n## E. Contenedores y superposiciones\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 49 | Card | `Card` | Básica, con header y acciones, clickeable | P1 |\n| 50 | Modal / Dialog | `Modal` | Formularios cortos y confirmaciones | P1 |\n| 51 | Confirm dialog | `ConfirmDialog` | Acciones destructivas con texto explícito | P1 |\n| 52 | Drawer / Side panel | `Drawer` | Detalle o edición sin salir de la tabla | P1 |\n| 53 | Tooltip | `Tooltip` | Ayuda breve y etiqueta de icon buttons | P1 |\n| 54 | Popover | `Popover` | Contenido interactivo flotante | P2 |\n| 55 | Accordion | `Accordion` | Secciones colapsables | P2 |\n| 56 | Divider | `Divider` | Separación de bloques | P1 |\n\n## F. Feedback y estado\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 57 | Alert / Banner | `Alert` | Info, éxito, advertencia, error; en página o global | P1 |\n| 58 | Toast | `Toast` | Confirmación breve de una acción | P1 |\n| 59 | Status badge | `StatusBadge` | Estado de un registro (Activo, Pendiente, Rechazado) | P1 |\n| 60 | Tag / Chip | `Tag` | Categorías, tecnologías, etiquetas | P1 |\n| 61 | Spinner | `Spinner` | Carga puntual | P1 |\n| 62 | Skeleton | `Skeleton` | Carga de tablas y cards | P2 |\n| 63 | Progress bar | `ProgressBar` | Procesos largos (importaciones, generación de archivos) | P2 |\n| 64 | Empty state | `EmptyState` | Sin datos / sin resultados de filtro | P1 |\n| 65 | Páginas de error | `ErrorPage` | 404, 500, sin permisos, mantenimiento | P2 |\n| 66 | Environment badge | `EnvBadge` | DEV / TEST / PROD siempre visible | P1 |\n\n## G. Personas y colaboración\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 67 | Avatar / Avatar group | `Avatar` | Usuarios, responsables, equipos | P1 |\n| 68 | User card | `UserCard` | Persona con rol, equipo y contacto | P3 |\n| 69 | Notification center | `NotificationCenter` | Bandeja de notificaciones | P2 |\n| 70 | Comments | `Comments` | Hilo de comentarios en un registro | P3 |\n\n## H. Utilitarios\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 71 | Copy to clipboard | `CopyButton` | Copiar IDs, CUIT, links | P2 |\n| 72 | Kbd | `Kbd` | Mostrar atajos de teclado | P3 |\n| 73 | Login | `Login` (plantilla) | Pantalla de ingreso con SSO | P2 |\n\n## I. Incorporaciones\n\n| # | Componente | En código | Uso en un sistema interno | Prioridad |\n| --- | --- | --- | --- | --- |\n| 74 | Grilla de layout | `Grid` · `Col` · `Stack` | Maquetar páginas en 12 columnas con gaps de token | P1 |\n| 75 | Filter grid | `FilterGrid` | Formulario de filtros en grilla con Buscar / Limpiar sobre un listado | P1 |\n| 76 | Filter dropdown | `FilterDropdown` | Pill de filtro con checklist, la pieza de la `FilterBar` | P1 |\n| 77 | Íconos | `Icon` | Set de línea Lucide con los nombres disponibles | P1 |\n| 78 | Plantilla de listado | `TemplateList` | Pantalla de consulta completa: filtros, tabla, paginación | P1 |\n| 79 | Plantilla de detalle | `TemplateDetail` | Vista de un registro: tabs, ficha, historial, comentarios | P2 |\n| 80 | Filtros de tabla (data-table filters) | `ColumnFilter` · `DataTable filterMode` | Filtrar cada columna desde el encabezado o desde una fila de filtros: texto, selección, múltiple, número y fecha | P1 |\n| 81 | Plantilla mobile | `TemplateMobile` | Listado en 390 px: el mismo código de escritorio adaptado solo | P1 |\n| 82 | Formulario mobile | `TemplateMobileForm` | Modal como hoja inferior, campos a una columna | P2 |\n"},{"id":"prompt","title":"AI agent prompt","md":"# Prompt para agentes IA\n\nInstrucciones listas para darle a un modelo de IA (también a los más económicos) para que construya pantallas solo con este sistema. El modelo no diseña: **elige y compone** componentes siguiendo las reglas de Atomic Design.\n\n## Qué darle al modelo\n\n1. Este prompt como instrucción de sistema.\n2. Como contexto, en este orden: `README.md`, `atomic-design.md`, `ai/components.json` y `components/index.d.ts` (las props exactas).\n3. Si el pedido es parecido a una plantilla, el `preview.html` de esa plantilla (`TemplateList`, `TemplateDetail`, `TemplateMobile`, `TemplateMobileForm` o `Login`) como ejemplo.\n\nCon esos archivos un modelo chico tiene todo lo que necesita; no hace falta pasarle el CSS ni el bundle.\n\n## Prompt de sistema\n\n```text\nSos un desarrollador frontend de Flock IT. Construís pantallas de sistemas internos usando\nEXCLUSIVAMENTE el design system Flock UI (React: window.FlockUI; otros stacks: clases fk-*).\n\nFuente de verdad, en este orden: README.md, atomic-design.md, ai/components.json, index.d.ts.\nSi algo no está en esos archivos, no existe.\n\nMétodo (Atomic Design), siempre en este orden:\n1. Identificá el tipo de pantalla y partí de su plantilla\n   (listado → TemplateList, detalle → TemplateDetail, ingreso → Login,\n   mobile → TemplateMobile / TemplateMobileForm; es el mismo código).\n2. Dividí la pantalla en zonas: Header, Sidebar, PageHeader, filtros, contenido, pie.\n   Un organismo por zona.\n3. Para cada organismo elegí moléculas y átomos con \"Cuándo usar cada uno\"\n   y respetá \"Qué puede ir dentro de qué\" y \"Cantidades máximas\".\n4. Espaciá solo con Stack y Grid (gap con tokens space-*). Los hijos nunca llevan margin.\n5. Revisá mobile: definí column.mobile en cada DataTable y no dejes información solo en Tooltip.\n6. Pasá el checklist de entrega antes de responder.\n\nReglas que no se rompen:\n- No inventes componentes, props ni variantes. Si falta algo, decilo en \"Faltantes\".\n- Nada de hex, px, z-index, style ni clases propias (excepción: Grid, Col, Stack).\n- Una sola acción primary por vista.\n- Un solo overlay bloqueante (Modal o Drawer) y un solo popup abierto a la vez.\n- Estados con palabra (StatusBadge, Alert), nunca solo color.\n- Textos en español rioplatense con voseo y sentence case.\n  Formatos: 1.234,56 · $ 1.234,56 · dd/mm/aaaa · 24 h.\n- Toda acción de solo ícono lleva label.\n\nFormato de tu respuesta:\n1. \"Estructura\": árbol de la pantalla por niveles\n   (plantilla > organismos > moléculas > átomos), una línea por componente.\n2. \"Código\": el componente React completo, usando solo FlockUI.\n3. \"Mobile\": qué se adapta solo y qué decidiste (column.mobile, sustituciones).\n4. \"Checklist\": cada punto del checklist de atomic-design.md con OK o la corrección hecha.\n5. \"Faltantes\": componentes o variantes que el sistema no tiene (o \"Ninguno\").\n```\n\n## Ejemplo\n\nPedido: *\"Pantalla para consultar contratos de partners, filtrando por estado y vencimiento, con acción para crear uno nuevo.\"*\n\nRespuesta esperada (resumen de la estructura):\n\n```text\nTemplateList\n└ AppShell\n  ├ Header (logoSrc, product=\"Contratos\", env)\n  ├ Sidebar (Contratos activo)\n  └ Stack gap=\"space-20\"\n    ├ PageHeader title=\"Contratos\" · actions: Button primary \"Nuevo contrato\"\n    ├ FilterBar\n    │ ├ SearchField \"Buscar por partner o número\"\n    │ ├ FilterDropdown \"Estado\" (multi)\n    │ └ FilterDropdown \"Vence\" (single: 30 / 60 / 90 días)\n    └ DataTable (rowActions: Ver, Editar, Dar de baja)\n      ├ col Partner (mobile: title, sub: cuit)\n      ├ col Estado → StatusBadge (mobile: badge)\n      ├ col Vencimiento dd/mm/aaaa (mobile: meta)\n      ├ col Monto mensual $ (align right, mobile: amount)\n      └ footer: Pagination\n```\n\n## Señales de que el modelo se salió del sistema\n\n| Señal | Qué pedirle que corrija |\n| --- | --- |\n| Aparece `style={{ margin… }}`, `color: #…`, `px` sueltos | Reemplazar por `Stack`/`Grid` con tokens y props de variante |\n| Usa nombres que no están en `components.json` (`Navbar`, `Grid2`, `Badge`) | Usar el componente del sistema equivalente o listarlo en \"Faltantes\" |\n| Dos botones `primary`, o un `Modal` dentro de otro | Aplicar las reglas de composición |\n| Tabla sin `mobile` en las columnas | Definir título, badge, importe y hasta 2 datos |\n| Textos en \"tú\" o en Title Case | Voseo y sentence case |\n"}],"comps":[{"name":"Accordion","group":"Contenedores","height":330,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Accordion } = window.FlockUI;\nfunction Demo() {\n  return html`<${Accordion} variant=\"card\" defaultOpen=${[0]} items=${[\n    { title: '¿Cuándo cierra el período de carga?', meta: 'Facturación', content: 'El día 15 de cada mes a las 23:59. Después de esa fecha, los cambios necesitan aprobación del Team Manager.' },\n    { title: '¿Quién aprueba las diferencias de horas?', content: 'La persona responsable del partner en Flock, con copia al equipo de administración.' },\n    { title: '¿Cómo se envían los mails a los partners?', content: 'Desde Acciones → Generar mails. Se crean borradores para revisar antes de enviar.' },\n  ]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Secciones colapsables para contenido secundario o largo.\n\n## Cuándo usarlo\n- Preguntas frecuentes, detalles opcionales, grupos de configuración. No escondas información crítica.\n\n## Qué provee el consumidor\n- `items` `{ title, meta, icon, content, defaultOpen }`, `multiple` (varias abiertas), `variant` (`plain` | `card`), `defaultOpen` (índices).\n\n## Reglas\n- Títulos que anticipan el contenido. Chevron a la derecha que gira al abrir.\n"},{"name":"Alert","group":"Feedback y estado","height":420,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col\"></div>\n<script>\nconst { html, Alert, Link } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${Alert} tone=\"info\" title=\"Nuevo formato de Excel\">Desde noviembre el archivo de horas incluye la columna de perfil.<//>\n    <${Alert} tone=\"success\" title=\"Período aprobado\">Se generaron 5 borradores de mail para los partners.<//>\n    <${Alert} tone=\"warning\" title=\"Diferencia de 12 h en Nodo Labs\" actions=${html`<${Link} href=\"#\">Revisar diferencias<//><${Link} href=\"#\" variant=\"muted\">Ignorar<//>`}>El reporte del partner no coincide con lo cargado.<//>\n    <${Alert} tone=\"danger\" title=\"No pudimos guardar el período\" onClose=${() => {}}>Revisá tu conexión y probá de nuevo.<//>\n    <${Alert} tone=\"brand\" banner title=\"Mantenimiento programado:\" actions=${html`<${Link} href=\"#\">Más info<//>`}>el sábado 10/10 de 20:00 a 23:00 el sistema no va a estar disponible.<//>`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Mensaje en la página: información, éxito, advertencia o error. `banner` para avisos globales de ancho completo.\n\n## Cuándo usarlo\n- Estado que la persona tiene que ver mientras trabaja (validaciones de un formulario, un período con diferencias, mantenimiento programado).\n- Para confirmar una acción que ya pasó, `Toast`.\n\n## Qué provee el consumidor\n- `tone` (`info` · `success` · `warning` · `danger` · `brand`), `title`, `children` (texto), `actions` (links o botones chicos), `onClose`, `banner`, `outline`, `icon`.\n\n## Reglas\n- Título que resume, texto que explica qué hacer. El tono siempre va con ícono.\n- Fondo `-subtle` del estado y texto `ink`: sin bordes laterales de color.\n"},{"name":"AppFooter","group":"Layout y navegación","height":120,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--col fk-preview--flush\"></div>\n<script>\nconst { html, AppFooter } = window.FlockUI;\nfunction Demo() {\n  return html`\n    <${AppFooter} product=\"Facturación\" version=\"2.4.1\" env=\"test\" />\n    <${AppFooter} product=\"Portal de Gestión\" version=\"1.12.0\" links=${[{ label: 'Mesa de ayuda', href: '#' }, { label: 'Manual de uso', href: '#' }]} />`;\n}\nReactDOM.createRoot(document.getElementById('root')).render(html`<${Demo} />`);\n<\/script>\n","readme":"Pie de la app con versión, ambiente y enlaces de soporte.\n\n## Cuándo usarlo\n- En el slot `footer` de `AppShell`. Opcional, recomendado en sistemas con varias versiones desplegadas.\n\n## Qué provee el consumidor\n- `product`, `version` (sin la \"v\"), `env`, `links` `{ label, href }`.\n\n## Reglas\n- Texto en `caption`; no agregues contenido de negocio.\n"},{"name":"AppShell","group":"Layout y navegación","height":560,"head":"","body":"\n<div id=\"root\" class=\"fk-preview fk-preview--flush\"></div>\n<
