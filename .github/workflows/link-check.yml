name: Link Check

# Validates external links in the docs on a schedule (not on PRs), so flaky
# external sites never block a merge. Internal links are already covered by
# Docusaurus `onBrokenLinks: 'throw'` at build time.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--config ./lychee.toml './docs/**/*.md' './README.md'"
          fail: false
          output: ./lychee/out.md

      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '🔗 Link Checker — links externos rotos'
          content-filepath: ./lychee/out.md
          labels: link-check, automated
